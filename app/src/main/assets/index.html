<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#71851e"><title>Zaměřovač</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="top"><button id="back" class="ico" title="Zpět">☰</button><div class="brand" id="screenTitle">Zaměřovač</div><button class="ico" id="searchBtn" title="Hledat">⌕</button><button class="ico" id="settingsBtn" title="Nastavení">⋮</button></header>
<main id="browserView"><div id="breadcrumbs" class="breadcrumbs"></div><div class="items" id="items"></div></main>
<section id="editorView" hidden><div class="editor-head"><button id="editorBack" class="ico">←</button><span id="editorTitle">Fotografie</span><button id="zoomOut" class="small">−</button><button id="zoomIn" class="small">＋</button><button class="small" id="fitBtn">⛶</button></div><div id="stage"><canvas id="drawCanvas"></canvas><canvas id="loupe" width="136" height="136" hidden></canvas><div id="editorHint">Tažením určete dva body · hodnota se zadává ručně</div></div><div class="toolbar"><button class="ico" id="toolsToggle">＋</button><button id="activeTool">Rozměr</button><input type="color" id="lineColor" value="#f7dc27" title="Barva"><button id="selectTool" class="ico">◎</button><button class="ico" id="undo" title="Zpět">↶</button><button class="ico" id="redo" title="Znovu">↷</button><button class="ico" id="exportBtn">⇧</button></div></section>
<section id="noteView" hidden><div class="note-head"><button id="noteBack" class="ico">←</button><span>Poznámka</span><button id="saveNote" class="primary">Uložit</button></div><div class="note-body"><input id="noteTitle" placeholder="Název poznámky"><textarea id="noteText" rows="7" placeholder="Zadejte text..." ></textarea><div class="divider"></div><h3>Seznam úkolů</h3><div id="checkItems"></div><button id="addCheck" class="outline">＋ Přidat položku</button><div class="divider"></div><h3>Přílohy poznámky</h3><div id="noteAttachments"></div><div class="row wrap"><button id="attachFile" class="outline">＋ Soubor / foto</button><button id="recordAudio" class="outline">● Hlasová poznámka</button></div></div></section>
<footer id="browserFoot" class="bottom"><button class="ico" id="createBtn" title="Přidat">＋</button><button class="ico" id="galleryBtn" title="Fotografie">▧</button><span class="grow"></span><button class="ico" id="bluetoothBtn" title="Laser Bluetooth">ᛒ</button><button class="ico" id="cloudBtn" title="Google Disk">☁</button></footer>
<div id="toolMenu" class="sheet" hidden></div>
<div id="newMenu" class="sheet" hidden></div>
<div id="settingsPanel" class="panel" hidden><div class="panelHead"><button id="closeSettings" class="ico">←</button><b>Nastavení</b></div><div id="settingsContent"></div></div>
<div class="modal" id="modal" hidden><div class="dialog"><div id="modalTitle" class="dialogTitle"></div><div id="modalBody"></div><div class="dialogActions"><button id="cancelModal">Zrušit</button><button class="primary" id="okModal">Uložit</button></div></div></div>
<div id="toast" hidden></div><input type="file" id="filePick" hidden multiple accept="image/*,video/*,audio/*,application/pdf,*/*">
<script src="app.js"></script><script src="editor.js"></script></body></html>
