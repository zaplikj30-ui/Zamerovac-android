<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#8b5cf6"><title>Zaměřovač</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="upgrade.css"><link rel="stylesheet" href="feedback-reports.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="help.css"></head>
<body>
<header class="top"><button id="back" class="ico" title="Hlavní nabídka" aria-label="Hlavní nabídka">☰</button><div class="brand" id="screenTitle"></div><button class="ico" id="sortBtn" title="Řazení" aria-label="Řazení">ᴬ↓ᶻ</button><button class="ico" id="searchBtn" title="Hledat">⌕</button><button class="ico" id="settingsBtn" title="Další možnosti">⋮</button></header>
<main id="browserView"><div id="breadcrumbs" class="breadcrumbs"></div><div class="items" id="items"></div></main>
<section id="editorView" hidden><div class="editor-head"><button id="editorBack" class="ico" aria-label="Zpět">←</button><div class="editor-caption"><span id="editorTitle">Fotografie</span><small id="editorPhotoMeta"></small></div><button class="ico" id="fitBtn" title="Přizpůsobit fotografii" hidden>⤢</button><button class="ico" id="editorTopMenu" title="Další možnosti">⋮</button></div><div id="stage"><canvas id="drawCanvas"></canvas><div class="zoomControl"><button id="zoomIn" title="Přiblížit">＋</button><button id="zoomOut" title="Oddálit">−</button></div><canvas id="loupe" width="136" height="136" hidden></canvas><div id="editorHint">Tažením určete dva body · hodnota se zadává ručně</div></div><div class="toolbar"><button class="ico add-tool" id="toolsToggle" title="Přidat nástroj">＋</button><button class="ico last-tool" id="activeTool" title="Opakovat poslední nástroj">↔</button><input type="color" id="lineColor" value="#f7dc27" title="Barva"><button class="ico" id="styleTool" title="Vzhled a styl">♟</button><button class="ico" id="deleteTool" title="Odstranit vybraný prvek">▤</button><button class="ico" id="undo" title="Zpět" aria-label="Vrátit poslední úpravu"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="translate(24 0) scale(-1 1)"><path d="M21 8v6h-6"/><path d="M3 16a8 8 0 0 1 14-5l4 3"/></g></svg></button><button class="ico" id="editorMore" title="Další možnosti">⋮</button><button id="selectTool" hidden>Vybrat</button><button id="redo" hidden>Znovu</button><button id="exportBtn" hidden>Export</button></div></section>
<section id="noteView" hidden><div class="note-head"><button id="noteBack" class="ico">←</button><span>Poznámka</span><button id="saveNote" class="primary">Uložit</button></div><div class="note-body"><input id="noteTitle" placeholder="Název poznámky"><textarea id="noteText" rows="7" placeholder="Zadejte text..." ></textarea><div class="divider"></div><h3>Seznam úkolů</h3><div id="checkItems"></div><button id="addCheck" class="outline">＋ Přidat položku</button><div class="divider"></div><h3>Přílohy poznámky</h3><div id="noteAttachments"></div><div class="row wrap"><button id="attachFile" class="outline">＋ Soubor / foto</button><button id="recordAudio" class="outline">● Hlasová poznámka</button></div></div></section>
<footer id="browserFoot" class="bottom"><button class="ico" id="createBtn" title="Přidat">＋</button><button class="ico" id="galleryBtn" title="Importovat fotografii"><svg viewBox="0 0 24 24" width="25" height="25" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="17" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="9" r="2" fill="currentColor"/><path d="m4 18 5-5 3 3 3-4 5 6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button><span class="grow"></span><button class="ico" id="bluetoothBtn" title="Laser Bluetooth">ᛒ</button><button class="ico" id="boschHistoryBtn" type="button" title="Historie měření Bosch" aria-label="Historie měření Bosch"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><rect x="8.5" y="6" width="7" height="7" rx="0.8"/><path d="M10 17h4M12 3.5v0.5"/><circle cx="12" cy="19.5" r=".7" fill="currentColor" stroke="none"/></svg></button><button class="ico" id="cloudBtn" title="Google Disk">☁</button></footer>
<div id="toolMenu" class="sheet" hidden></div><div id="navMenu" class="appMenu" hidden></div><div id="overflowMenu" class="appMenu overflow" hidden></div><div id="editorOverflow" class="appMenu editorOverflow" hidden></div>
<div id="newMenu" class="sheet" hidden></div>
<div id="settingsPanel" class="panel" hidden><div class="panelHead"><button id="closeSettings" class="ico">←</button><b>Nastavení</b></div><div id="settingsContent"></div></div>
<div class="modal" id="modal" hidden><div class="dialog"><div id="modalTitle" class="dialogTitle"></div><div id="modalBody"></div><div class="dialogActions"><button id="cancelModal">Zrušit</button><button class="primary" id="okModal">Uložit</button></div></div></div>
<div id="toast" hidden></div><input type="file" id="filePick" hidden multiple accept="image/*,video/*,audio/*,application/pdf,*/*">
<script src="i18n.js"></script><script src="app.js"></script><script src="editor.js"></script><script src="release-history.js"></script><script src="upgrade.js"></script><script src="rich-notes.js"></script><script src="sketch.js"></script><script src="address-correction.js"></script><script src="inset-workspace.js"></script><script src="editor-extra-toolbar.js"></script><script src="laser-autofill.js"></script><script src="toolbar-customize.js"></script><script src="feedback-reports.js"></script><script src="customer-export.js"></script><script src="bulk-actions.js"></script><script src="menu-dismiss.js"></script><script src="help.js"></script></body></html>
