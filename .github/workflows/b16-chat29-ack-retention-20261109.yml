name: Zaměřovač - TEMP B16 Chat29 GREEN ACK/re-pair 61
# One-shot owner-controlled branch; fixed source SHA, no pull_request/fork or cloud runner.
on:
  push:
    branches: [qa/chat29-ack-retention-20261109]
    paths:
      - '.github/workflows/b16-chat29-ack-retention-20261109.yml'
permissions:
  contents: read
concurrency:
  group: zamerovac-b16-chat29-ack-retention-oneoff
  cancel-in-progress: false
jobs:
  targeted-native:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/qa/chat29-ack-retention-20261109' && github.event_name == 'push' }}
    name: Windows QA WSL2 - 61 recovery and sync regression tests
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 45
    env:
      CI: '1'
      TESTED_SHA: 'e5aa14285ce62fe66b4face699ec675a845a84d8'
    steps:
      - name: Verify owner-controlled branch and unprivileged Windows service
        shell: cmd
        run: |
          if /I not "%USERNAME%"=="ZamerovacQA" exit /b 1
          if not "%GITHUB_REF%"=="refs/heads/qa/chat29-ack-retention-20261109" exit /b 1
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          if not exist "C:\actions-runner\tools\Python313\python.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
          echo PASS owner branch and local tooling
      - name: Read-only source checkout pinned to exact Chat29 test-first SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: e5aa14285ce62fe66b4face699ec675a845a84d8
          path: b16-source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Compile Java and run two provider ACK boundary Robolectric tests in WSL2
        shell: 'C:\actions-runner\tools\Python313\python.exe {0}'
        run: |
          import os, subprocess
          from pathlib import Path
          expected = os.environ["TESTED_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "zaplikj30-ui/Zamerovac-android" or os.environ.get("USERNAME", "").lower() != "zamerovacqa":
              raise SystemExit("STOP untrusted account/repository")
          source = str(Path(os.environ["GITHUB_WORKSPACE"]) / "b16-source")
          reports = str(Path(os.environ["GITHUB_WORKSPACE"]) / "b16-junit-reports" / (os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]))
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=source, text=True).strip()
          if actual != expected:
              raise SystemExit("STOP checkout SHA mismatch "+actual)
          print("TESTED_SOURCE_SHA="+actual,flush=True)
          linux = r"""
          set -Eeuo pipefail
          export CI=1 LC_ALL=C.UTF-8 ANDROID_HOME=/opt/android-sdk ANDROID_SDK_ROOT=/opt/android-sdk
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 GRADLE_USER_HOME=/root/.gradle
          source_dir="$(wslpath -u "$1")"
          reports="$(wslpath -u "$2")"
          expected="$3"
          test -f "$source_dir/app/build.gradle"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x /opt/gradle-8.10.2/bin/gradle
          test -x "$JAVA_HOME/bin/java"
          base=/root/zamerovac-qa-commits
          mkdir -p "$base" "$reports"
          destination="$(mktemp -d "$base/b16-targeted-XXXXXXXX")"
          trap 'rc=$?; if [ -d "$destination/app/build/test-results/testPreviewUnitTest" ]; then cp -a "$destination/app/build/test-results/testPreviewUnitTest" "$reports/"; fi; rm -rf "$destination"; exit "$rc"' EXIT
          cp -a "$source_dir/." "$destination/"
          cd "$destination"
          actual="$(git rev-parse HEAD)"
          echo "WSL_TESTED_SOURCE_SHA=$actual"
          test "$actual" = "$expected"
          gradle=/opt/gradle-8.10.2/bin/gradle
          common=(--offline --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m" -PdriveRequireConfigured=true --console=plain)
          echo "PHASE_1_JAVAC compilePreviewJavaWithJavac"
          "$gradle" "${common[@]}" :app:verifyDriveRegistration :app:compilePreviewJavaWithJavac
          echo "PASS PHASE_1_JAVAC"
          echo "PHASE_2_TESTS 61 positive recovery and sync tests; 2 historical diagnostic RED excluded"
          set +e
          "$gradle" "${common[@]}" :app:testPreviewUnitTest \
            --tests cz.zamerovac.app.SafSyncV2Test.driveLateAckKeepsOriginalsAndRejectsUnapprovedRecoveryOnRestart \
            --tests cz.zamerovac.app.SafSyncV2Test.safLateAckKeepsOriginalsAndRejectsUnapprovedRecoveryOnRestart \
            --tests cz.zamerovac.app.SafSyncV2Test.observedReceiverRecoveryCannotReuseHistoricalSignedCloudAck \
            --tests cz.zamerovac.app.SafSyncV2Test.recoveredPeerCannotClearCloudAckBarrierByUnpairAndRepair \
            --tests cz.zamerovac.app.SafSyncV2Test.corruptionAfterAckOutputCreateCannotPublishValidCloudAck \
            --tests cz.zamerovac.app.SafSyncV2Test.authenticatedDirectArrivalDuringLocalHashReleasesCloudGateBeforePublication \
            --tests cz.zamerovac.app.SafSyncV2Test.unavailableOldMetadataDoesNotBlockNewerIncomingOrOwnOutgoingAndNeverGetsAcked \
            --tests cz.zamerovac.app.SafSyncV2Test.newCloudNamespacePublishesCompleteCopyDespitePriorConfirmedPeerAck \
            --tests cz.zamerovac.app.SafSyncV2Test.historicalSignedAckCannotHideIncompleteNewNamespaceOnMeteredNetwork \
            --tests cz.zamerovac.app.SafSyncV2Test.repairAfterFinalAckRestoresFallbackReceiverAndNeverOverwritesCorruptRemoteCopy \
            --tests cz.zamerovac.app.SafSyncV2Test.purgedPendingPhotoDoesNotBlockNewerTombstoneOrFalselyAckMissingOldMedia \
            --tests cz.zamerovac.app.SafSyncV2Test.concurrentLocalVersionCannotRetireAnUnfinishedRemoteSnapshot \
            --tests cz.zamerovac.app.SafSyncV2Test.missingFileStillRequiredByNewerLocalVersionCannotBeRetired \
            --tests cz.zamerovac.app.SafSyncV2Test.fallbackAfterFinalCloudAckReappliesHistoricalMessageDespiteCachedInbox \
            --tests cz.zamerovac.app.SafSyncV2Test.signedImmutableMessagesConvergeAndNoMutableProjectsFileExists \
            --tests cz.zamerovac.app.SafSyncV2Test.interruptedBlobAndRestartResumeWithoutPublishingPartialDatabase \
            --tests cz.zamerovac.app.SafSyncV2Test.forgedAcknowledgementCannotClearQueueAndRevokedAuthorCannotWrite \
            --tests cz.zamerovac.app.SafSyncV2Test.meteredMetadataUsesExistingOriginalButMissingLargePhotoWaits \
            --tests cz.zamerovac.app.SafSyncV2Test.committedInboxSurvivesLostAckAndAvoidsReadingOldMessagesAfterRestart \
            --tests cz.zamerovac.app.SafSyncV2Test.signedBodyCannotBeChangedReaddressedOrUsedAsAnotherProofKind \
            --tests cz.zamerovac.app.SafSyncV2Test.rejectedNetworkPolicyCannotExposeStaleFallbackAsConfirmed \
            --tests cz.zamerovac.app.SafSyncV2Test.rejectedNetworkPolicyDoesNotEvenListOrReadProvider \
            --tests cz.zamerovac.app.SafSyncV2Test.manyInvalidMessagesUseBoundedBatchesResumeAfterRestartAndCannotClearOutbox \
            --tests cz.zamerovac.app.SafSyncV2Test.newlyAvailableDirectRouteYieldsCloudBetweenChunksWithoutClearingQueue \
            --tests cz.zamerovac.app.SafSyncV2Test.networkPolicyChangeDuringLargeUploadStopsAtNextChunkAndRecovers \
            --tests cz.zamerovac.app.SafSyncV2Test.pendingSourceReopenDoesNotReadAlreadyVerifiedLargeOriginalAgain \
            --tests cz.zamerovac.app.SafSyncV2Test.deletedCloudCopyIsRepublishedWithoutOverwritingLocalOriginal \
            --tests cz.zamerovac.app.SafSyncV2Test.signedRepairFixesSameSizeCorruptBlobAndReplayedRequestDoesNotRedownloadIt \
            --tests cz.zamerovac.app.SafSyncV2Test.forgedOrUnreferencedRepairCannotTriggerLargeReadsOrClearOutbox \
            --tests cz.zamerovac.app.SafSyncV2Test.largeRepairWaitsForUnmeteredPolicy \
            --tests cz.zamerovac.app.SafSyncV2Test.missingSnapshotRequestsVerifiedMetadataAndLegacyStateStillConverges \
            --tests cz.zamerovac.app.SafSyncV2Test.quarantinedHistoricalOutboxDoesNotBlockFreshSignedCloudSync \
            --tests cz.zamerovac.app.PeerTransferTest.firstSyncIntoCleanReceiverKeepsExactPhotoAndNoDuplicateOnRetry \
            --tests cz.zamerovac.app.PeerTransferTest.interruptedFirstPhotoTransferKeepsCleanBaselineAndResumesSafely \
            --tests cz.zamerovac.app.PeerTransferTest.diskFailureBeforePeerDatabaseCommitLeavesMetadataAndExactDataUntouched \
            --tests cz.zamerovac.app.PeerTransferTest.completeBidirectionalMediaAndExactAnnotationsRemainIdempotent \
            --tests cz.zamerovac.app.PeerTransferTest.corruptReceiverCannotAcceptOldBackupOrAckPeerSnapshot \
            --tests cz.zamerovac.app.PeerTransferTest.fallbackOnResponderInvalidatesRemoteAckAndRestoresExactDataWithoutNewUserEdit \
            --tests cz.zamerovac.app.PeerTransferTest.recoveryOnInitiatorInvalidatesRemoteAckBeforeResponderPreparesSnapshot \
            --tests cz.zamerovac.app.PeerTransferTest.disconnectNineteenthOfThirtyKeepsDatabaseAndResumesAfterReopen \
            --tests cz.zamerovac.app.PeerTransferTest.editDuringMediaTransferIsMergedFromLatestDatabase \
            --tests cz.zamerovac.app.PeerTransferTest.sameMediaIdDifferentBytesRefusesWithoutOverwritingOrFalseAck \
            --tests cz.zamerovac.app.PeerTransferTest.corruptAndPartialStreamsDoNotPublishMedia \
            --tests cz.zamerovac.app.PeerTransferTest.coalescesOnlyObservedRevisionsAndRejectsUnsafeMetadata \
            --tests cz.zamerovac.app.PeerTransferTest.recoveryQuarantineWithMoreThanSixteenOldJobsDoesNotBlockDirectTls \
            --tests cz.zamerovac.app.PeerTransferTest.receiverFailureBeforeFirstPhotoBaselineIsNotDatabaseLoss \
            --tests cz.zamerovac.app.CloudInboxTest.committedReceiptSurvivesReopenAndIsScopedToInstallationAndStore \
            --tests cz.zamerovac.app.CloudInboxTest.failedReceiptWriteCannotTurnUnacknowledgedCommitIntoCachedSuccess \
            --tests cz.zamerovac.app.CloudInboxTest.missingCommitAndChangedImmutableMessageCannotBeAcknowledged \
            --tests cz.zamerovac.app.CloudInboxTest.supersededLocalIntentCannotBecomeRemoteAcknowledgementAndRecoveryInvalidatesIt \
            --tests cz.zamerovac.app.DatabaseRecoveryTest.fallbackRotatesDurablyOnceAndNeverOverwritesEitherOriginal \
            --tests cz.zamerovac.app.DatabaseRecoveryTest.orphanOriginalNeverAuthorizesImplicitFreshDatabase \
            --tests cz.zamerovac.app.DatabaseRecoveryTest.failedRecoveryJournalCannotReturnOlderDataAsConfirmed \
            --tests cz.zamerovac.app.DatabaseRecoveryTest.deletedDatabaseInvalidatesReceiptsAndMalformedJournalFailsClosed \
            --tests cz.zamerovac.app.DatabaseRecoveryTest.partialAndCompleteUnconfirmedTemporaryFilesNeverReplaceConfirmedDatabaseOnRead \
            --tests cz.zamerovac.app.DatabaseRecoveryTest.restartResidueAfterBackupPublicationKeepsPrimaryAndFallbackDoesNotPromotePendingData \
            --tests cz.zamerovac.app.DatabaseRecoveryTest.failedDatabaseStagingPreservesConfirmedPrimaryAndRecoveryCopy \
            --tests cz.zamerovac.app.CloudPublicationsTest.verifiedReceiptSurvivesRestartButMissingChangedExpiredOrForeignStoreCannotReuseIt \
            --tests cz.zamerovac.app.CloudPublicationsTest.repairRequestUsesDurableCounterBackoffAndNeverTreatsPublicationAsDataAck \
            --tests cz.zamerovac.app.CloudPublicationsTest.failedAtomicReceiptCannotEnterCacheOrAdvanceRepair \
            --tests cz.zamerovac.app.CloudPublicationsTest.completeSnapshotPublicationIsScopedDurableExpiringAndStillNotADataAck
          test_rc=$?
          set -e
          python3 - <<'PY_XML'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          directory=Path("app/build/test-results/testPreviewUnitTest")
          files=sorted(directory.glob("TEST-*.xml"))
          stats={k:0 for k in ("tests","failures","errors","skipped")}
          suite_counts={}
          for p in files:
              root=ET.parse(p).getroot()
              suite_counts[root.attrib["name"]]=int(root.attrib["tests"])
              for k in stats: stats[k]+=int(root.attrib.get(k,"0"))
          print("B16_JUNIT_XML_COUNTS:",stats,"XML_FILES:",len(files),flush=True)
          print("B16_JUNIT_SUITES:",suite_counts,flush=True)
          expected_suites={
              "cz.zamerovac.app.SafSyncV2Test":32,
              "cz.zamerovac.app.PeerTransferTest":14,
              "cz.zamerovac.app.CloudInboxTest":4,
              "cz.zamerovac.app.DatabaseRecoveryTest":7,
              "cz.zamerovac.app.CloudPublicationsTest":4,
          }
          if len(files)!=5 or suite_counts!=expected_suites or stats["tests"]!=61 or any(stats[k] for k in ("failures","errors","skipped")):
              raise SystemExit("FAIL or SKIP: check exact JUnit XML and Gradle log")
          PY_XML
          test "$test_rc" -eq 0
          echo "PASS TARGETED ROBOLECTRIC - exact SHA, no APK"
          """
          cmd = ["wsl.exe", "--distribution", "Zamerovac-Ubuntu-QA", "--user", "root",
                 "--exec", "/bin/bash", "-lc", linux, "_", source, reports, expected]
          print("Home WSL2 capped 4 GB RAM / 2 CPU, one Gradle worker, offline dependencies; no APK",flush=True)
          result = subprocess.run(cmd, stdin=subprocess.DEVNULL, check=False)
          if result.returncode:
              raise SystemExit("NATIVE_TEST_EXIT="+str(result.returncode))
      - name: Preserve only native JUnit evidence, never APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat29-b16-ack-repair-e5aa142-regression61
          path: b16-junit-reports/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 7
