name: Zamerovac - one-off Bash lint on home WSL ONLY
on:
  push:
    branches:
      - infra/cloud-apk-monotonic-guard-20261108
    paths:
      - '.github/workflows/windows-cloud-release-bash-temporary.yml'
permissions:
  contents: read
jobs:
  local-bash-lint:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/infra/cloud-apk-monotonic-guard-20261108' && github.event_name == 'push' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 5
    steps:
      - name: Trusted Git
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Parse actual checked-out cloud YAML Bash scripts with WSL2
        shell: 'C:\actions-runner\tools\Python313\python.exe {0}'
        run: |
          import os
          from pathlib import Path
          import subprocess

          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual.lower() != os.environ['GITHUB_SHA'].lower():
              raise SystemExit('STOP: invalid checkout SHA')
          lines = Path('.github/workflows/build-apk.yml').read_text(encoding='utf-8').splitlines()
          scripts = []
          for n, line in enumerate(lines):
              if line != '        run: |':
                  continue
              body = []
              for continuation in lines[n + 1:]:
                  if continuation.startswith('          '):
                      body.append(continuation[10:])
                  elif not continuation.strip():
                      body.append('')
                  else:
                      break
              if body:
                  scripts.append('\n'.join(body) + '\n')
          if len(scripts) < 5:
              raise SystemExit('STOP: unexpected number of Bash scripts')
          for i, script in enumerate(scripts, 1):
              result = subprocess.run(
                  ['wsl.exe', '-d', 'Zamerovac-Ubuntu-QA', '--user', 'root', '--',
                   '/bin/bash', '-n'],
                  input=script.encode('utf-8'), capture_output=True, timeout=30)
              if result.returncode != 0:
                  raise SystemExit(f'FAIL Bash syntax script {i}: {result.stderr.decode("utf-8", "replace")}')
              print(f'PASS real Linux Bash -n script {i}', flush=True)
          print(f'PASS {len(scripts)} Bash syntax checks at source SHA {actual}', flush=True)
