name: QA34 - one-shot real Windows token and empty Job Object probe
# Inert until exact owner-only marker push. No worker subprocess is created.
on:
  push:
    branches: ['coord34/rf131-failclosed-cleanup-20261114']
    paths: ['docs/qa/qa34-native-preflight.trigger']
permissions:
  contents: read
concurrency:
  group: qa34-windows-native-empty-job-probe
  cancel-in-progress: false
jobs:
  real-windows-native:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.triggering_actor == 'zaplikj30-ui' && github.ref == 'refs/heads/coord34/rf131-failclosed-cleanup-20261114' && github.event_name == 'push' && github.event.created == false && github.run_number == 1 && github.run_attempt == 1 && github.event.head_commit.message == 'OWNER-APPROVED-QA34-NATIVE-PREFLIGHT-20261114' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 3
    env:
      PYTHONUTF8: '1'
      EXPECTED_QA_SHA: ${{ github.event.before }}
    steps:
      - name: Verify owner, Windows service identity, and pinned tools
        shell: cmd
        run: |
          @echo off
          if /i not "%GITHUB_REPOSITORY%"=="zaplikj30-ui/Zamerovac-android" exit /b 1
          if /i not "%GITHUB_ACTOR%"=="zaplikj30-ui" exit /b 1
          if /i not "%GITHUB_TRIGGERING_ACTOR%"=="zaplikj30-ui" exit /b 1
          if /i not "%GITHUB_RUN_ATTEMPT%"=="1" exit /b 1
          if /i not "%GITHUB_RUN_NUMBER%"=="1" exit /b 1
          if not exist "C:\actions-runner\tools\Python313\python.exe" exit /b 1
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          for /f "delims=" %%U in ('whoami') do set "RUN_USER=%%U"
          if /i not "%RUN_USER%"=="%COMPUTERNAME%\ZamerovacQA" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
          echo QA34_WINDOWS_OWNER_PREFLIGHT=1
      - name: Checkout exact previous reviewed source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.before }}
          # Unique checkout path: NEVER git-clean a previous HOME workspace.
          path: qa34-native-${{ github.run_id }}
          clean: false
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify exact SHA and clean checkout
        shell: cmd
        working-directory: qa34-native-${{ github.run_id }}
        run: |
          @echo off
          set "ACTUAL_SHA="
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if not defined ACTUAL_SHA exit /b 1
          if /i not "%ACTUAL_SHA%"=="%EXPECTED_QA_SHA%" exit /b 1
          git status --porcelain --untracked-files=all >"%RUNNER_TEMP%\qa34-clean-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          for %%F in ("%RUNNER_TEMP%\qa34-clean-%GITHUB_RUN_ID%.txt") do if %%~zF GTR 0 exit /b 1
          del /q "%RUNNER_TEMP%\qa34-clean-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          echo QA34_PINNED_CLEAN_SHA=1
      - name: Actual native token and empty JobObject test (no CreateProcessW)
        shell: cmd
        working-directory: qa34-native-${{ github.run_id }}
        run: |
          @echo off
          "C:\actions-runner\tools\Python313\python.exe" tools\qa34_native_job_preflight.py
          if errorlevel 1 exit /b 1
          echo QA34_NATIVE_PREFLIGHT_PASS=1
