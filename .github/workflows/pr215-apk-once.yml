name: Zaměřovač PR215 - jednorazova APK, build only
on:
  push:
    branches:
      - qa/pr215-apk-once-20261119
permissions:
  contents: read
concurrency:
  group: zamerovac-pr215-apk-once-20261119
  cancel-in-progress: false
jobs:
  preview_apk:
    if: >-
      github.repository == 'zaplikj30-ui/Zamerovac-android' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/qa/pr215-apk-once-20261119' &&
      github.actor == 'zaplikj30-ui' &&
      github.triggering_actor == 'zaplikj30-ui' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'qa: build PR215 once 2009e0acf57a97ab32a8217a1365f62653884001'
    name: Single preview APK, no release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Exact approved source only
        uses: actions/checkout@v4
        with:
          ref: 2009e0acf57a97ab32a8217a1365f62653884001
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Check source SHA and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2009e0acf57a97ab32a8217a1365f62653884001"
          test "$(sed -n 's/^versionName=//p' config/app-version.properties)" = "1.4.1"
          test -f tools/release/apk_gate.py
          node tools/release/versioning.js --release
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true
      - name: Build preview without publishing
        shell: bash
        env:
          GITHUB_RUN_NUMBER: '157'
        run: |
          set -euo pipefail
          gradle --no-daemon -p tools/drive-config-checks verify
          gradle --no-daemon :app:verifyDriveRegistration :app:assemblePreview -PdriveRequireConfigured=true
      - name: Verify actual APK signature, package, versionCode and bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import runpy
          import shutil
          gate = runpy.run_path("tools/release/apk_gate.py")
          source = Path("app/build/outputs/apk/preview/app-preview.apk")
          if not source.is_file() or not 1 <= source.stat().st_size <= 100 * 1024 * 1024:
              raise SystemExit("FAIL: missing or oversized APK")
          meta = gate["inspect_apk"](source, "1.4.1")
          if meta["version_code"] != 1157:
              raise SystemExit("FAIL: wrong versionCode")
          output = Path("dist/Zamerovac-pr215-v1.4.1-test-vc1157.apk")
          output.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, output)
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          if digest != meta["sha256"]:
              raise SystemExit("FAIL: APK digest changed after copy")
          print("PASS exact approved source 2009e0acf57a97ab32a8217a1365f62653884001")
          print("PASS preview signer, package, version 1.4.1-test, versionCode 1157")
          print("PASS actual APK SHA256=" + digest)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("BUILD ONLY, NOT RELEASED. Product SHA: 2009e0acf57a97ab32a8217a1365f62653884001\n\n")
              summary.write("Package: cz.zamerovac.app.preview; versionName: 1.4.1-test; versionCode: 1157\n\n")
              summary.write("APK SHA256: " + digest + "\n\n")
              summary.write("Known #88 raw JVM 2 diagnostic FAIL unchanged; physical Android NOT RUN.\n")
          PY
      - name: Upload one short-lived APK artifact, no GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: Zamerovac-pr215-preview-apk-vc1157
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
