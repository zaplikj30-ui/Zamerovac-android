name: Zamerovac - domaci WSL2 izolovany import a runtime smoke

# Jednorazovy infrastrukturni probe na duveryhodne vlastni vetvi.
# Nemeni aplikaci, neinstaluje do hlavniho uctu, zadny cloud/fork/PR.
on:
  push:
    branches: [infra/windows-self-hosted-qa-20261108]
    paths:
      - '.github/workflows/windows-wsl-import-smoke.yml'

permissions:
  contents: read

concurrency:
  group: zamerovac-wsl-import-smoke
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui'
    name: WSL Ubuntu 24.04 - pouze ucet ZamerovacQA
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 22
    steps:
      - name: Pinned Ubuntu rootfs, 4 GB RAM limit a kontrola skutecneho linuxoveho behu
        shell: 'C:\actions-runner\tools\Python313\python.exe {0}'
        run: |
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import urllib.request

          def report(*args):
              print(*args, flush=True)

          def decode(b):
              return b.decode("utf-16-le" if b.count(b"\x00") > len(b)//8 else "utf-8", errors="replace").strip()

          def call(args, timeout):
              report("COMMAND:", " ".join(args))
              try:
                  p = subprocess.run(args, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                     stderr=subprocess.STDOUT, timeout=timeout, check=False)
              except subprocess.TimeoutExpired as e:
                  report("TIMEOUT (seconds):", timeout)
                  raise SystemExit(1) from e
              report("EXIT:", p.returncode, decode(p.stdout)[:2200])
              if p.returncode != 0:
                  raise SystemExit(1)
              return decode(p.stdout)

          report("WINDOWS_ACCOUNT:", os.environ.get("USERNAME"))
          if os.environ.get("USERNAME", "").lower() != "zamerovacqa":
              raise SystemExit("STOP: not the isolated QA service account")

          base = Path(r"C:\actions-runner\wsl-qa")
          distro = "Zamerovac-Ubuntu-QA"
          home = Path(os.environ["USERPROFILE"])
          config = home / ".wslconfig"
          existing = call(["wsl.exe", "--list", "--quiet"], 25)
          if distro.lower() in existing.lower():
              report("DISTRO_ALREADY_REGISTERED: will only validate runtime")
          else:
              if (base / "linux").exists():
                  raise SystemExit("STOP: previous unregistered WSL data found, manual inspection required")
              free_gib = shutil.disk_usage("C:/").free / (1024**3)
              report("FREE_C_GiB:", round(free_gib, 2))
              if free_gib < 10:
                  raise SystemExit("STOP: less than 10 GiB free, no download or import")
              if config.exists():
                  report("EXISTING_WSL_CONFIG: preserving without modification")
                  if "memory=4GB" not in config.read_text(encoding="utf-8", errors="replace"):
                      raise SystemExit("STOP: existing WSL limits require manual review")
              else:
                  config.write_text("[wsl2]\nmemory=4GB\nprocessors=2\nswap=1GB\nguiApplications=false\n",
                                    encoding="utf-8")
                  report("NEW_SERVICE_ACCOUNT_WSL_LIMITS: 4GB / 2 CPU / 1GB swap")
              base.mkdir(parents=True, exist_ok=True)
              artifact = base / "ubuntu-noble-wsl-amd64-24.04lts.rootfs.tar.gz"
              expected = "2a790896740b14d637dbdc583cce1ba081ac53b9e9cdb46dc09a2f73abbd9934"
              def sha256(path):
                  h = hashlib.sha256()
                  with path.open("rb") as f:
                      for chunk in iter(lambda: f.read(1024 * 1024), b""):
                          h.update(chunk)
                  return h.hexdigest()
              if not artifact.is_file() or sha256(artifact) != expected:
                  tmp = base / "rootfs.partial"
                  if tmp.exists():
                      tmp.unlink()
                  url = ("https://cloud-images.ubuntu.com/wsl/releases/noble/current/"
                         "ubuntu-noble-wsl-amd64-24.04lts.rootfs.tar.gz")
                  report("OFFICIAL_UBUNTU_ROOTFS_DOWNLOAD: verification mandatory")
                  with urllib.request.urlopen(url, timeout=45) as source, tmp.open("wb") as dest:
                      while True:
                          block = source.read(1024 * 1024)
                          if not block:
                              break
                          dest.write(block)
                  digest = sha256(tmp)
                  report("DOWNLOADED_SHA256:", digest)
                  if digest != expected:
                      tmp.unlink(missing_ok=True)
                      raise SystemExit("STOP: official Ubuntu rootfs SHA256 mismatch")
                  tmp.replace(artifact)
              report("VERIFIED_PINNED_UBUNTU_ROOTFS_SHA256:", sha256(artifact))
              location = base / "linux"
              call(["wsl.exe", "--import", distro, str(location), str(artifact),
                    "--version", "2"], 480)

          linux = call(["wsl.exe", "--distribution", distro, "--user", "root",
                        "--exec", "/usr/bin/env", "uname", "-s"], 90)
          if linux.strip() != "Linux":
              raise SystemExit("FAIL: WSL runtime did not confirm Linux")
          report("PASS: Linux runtime on isolated home runner account")
          report("NO APK, NO CLOUD, NO APP DATA MODIFIED")
