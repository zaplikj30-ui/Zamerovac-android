name: Zamerovac - temporary cloud fallback safety check HOME ONLY
# One-off local Python unit verification; delete after PASS/FAIL.
on:
  push:
    branches:
      - infra/cloud-apk-monotonic-guard-20261108
    paths:
      - '.github/workflows/windows-cloud-release-safety-temporary.yml'
      - '.github/workflows/build-apk.yml'
      - 'tests/test_ci_cloud_release_gate.py'

permissions:
  contents: read

jobs:
  windows-local-cloud-gate:
    name: Windows home - manual cloud fallback contract check
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/infra/cloud-apk-monotonic-guard-20261108' && github.event_name == 'push' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 5
    steps:
      - name: Verified installed Git
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
      - name: Checkout ONLY trusted pushed SHA without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Exact checkout and one targeted guard test
        shell: cmd
        run: |
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if not defined ACTUAL_SHA exit /b 1
          if /I not "%ACTUAL_SHA%"=="%GITHUB_SHA%" exit /b 1
          "C:\actions-runner\tools\Python313\python.exe" -m unittest discover -s tests -p "test_ci_cloud_release_gate.py" -v
          if errorlevel 1 exit /b 1
          echo PASS targeted cloud fallback safety guard
