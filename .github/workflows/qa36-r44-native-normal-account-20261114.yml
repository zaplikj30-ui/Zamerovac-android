name: QA36 - normal native no-op plus 15 with account-scoped preflight
# Explicitly authorized sequel to proven contained no-op. Marker-only; no PR/fork.
on:
  push:
    branches: ['coord36/pr135-review-fixes-20261114']
    paths: ['docs/qa/qa36-r44-native-normal-account.trigger']
permissions:
  contents: read
concurrency:
  group: qa36-r44-native-normal-account-once
  cancel-in-progress: false
jobs:
  windows-fixture15:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.triggering_actor == 'zaplikj30-ui' && github.event_name == 'push' && github.ref == 'refs/heads/coord36/pr135-review-fixes-20261114' && github.event.created == false && github.run_number == 1 && github.run_attempt == 1 && github.event.head_commit.message == 'OWNER-APPROVED-QA36-R44-NORMAL-ACCOUNT-20261114' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 7
    env:
      CI: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ZAMEROVAC_PYTHON: 'C:\actions-runner\tools\Python313\python.exe'
      EXPECTED_QA_SHA: ${{ github.event.before }}
      EXPECTED_PRODUCT_SHA: 'ae3b4df53c25557f28b4a25ccb65adc2abdff639'
      ZAMEROVAC_SOURCE_ROOT: '${{ github.workspace }}\qa36-product-${{ github.run_id }}'
    steps:
      - name: Identity and pinned Windows tools
        shell: cmd
        run: |
          @echo off
          if /i not "%GITHUB_REPOSITORY%"=="zaplikj30-ui/Zamerovac-android" exit /b 1
          if /i not "%GITHUB_ACTOR%"=="zaplikj30-ui" exit /b 1
          if /i not "%GITHUB_TRIGGERING_ACTOR%"=="zaplikj30-ui" exit /b 1
          if /i not "%GITHUB_EVENT_NAME%"=="push" exit /b 1
          if /i not "%GITHUB_RUN_ATTEMPT%"=="1" exit /b 1
          if /i not "%GITHUB_RUN_NUMBER%"=="1" exit /b 1
          set "QA_USER="
          for /f "delims=" %%U in ('C:\Windows\System32\whoami.exe') do set "QA_USER=%%U"
          if not defined QA_USER exit /b 1
          if not defined COMPUTERNAME exit /b 1
          if /i not "%QA_USER%"=="%COMPUTERNAME%\ZamerovacQA" exit /b 1
          if not exist "%ZAMEROVAC_PYTHON%" exit /b 1
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
          where node >nul 2>nul
          if errorlevel 1 exit /b 1
          node -e "if(!process.version.startsWith('v26.13.'))process.exit(1)"
          if errorlevel 1 exit /b 1
          echo QA36_FIXTURE_TRUSTED_IDENTITY=PASS
      - name: Checkout reviewed QA commit in unique nonclean directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.before }}
          path: qa36-gate-${{ github.run_id }}
          clean: false
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Checkout pinned original product in distinct nonclean directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ae3b4df53c25557f28b4a25ccb65adc2abdff639
          path: qa36-product-${{ github.run_id }}
          clean: false
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify both exact SHAs and unmodified checkouts
        shell: cmd
        run: |
          @echo off
          set "QA_SHA="
          set "PROD_SHA="
          for /f %%H in ('git -C "%GITHUB_WORKSPACE%\qa36-gate-%GITHUB_RUN_ID%" rev-parse HEAD') do set "QA_SHA=%%H"
          for /f %%H in ('git -C "%GITHUB_WORKSPACE%\qa36-product-%GITHUB_RUN_ID%" rev-parse HEAD') do set "PROD_SHA=%%H"
          if not defined QA_SHA exit /b 1
          if not defined PROD_SHA exit /b 1
          if /i not "%QA_SHA%"=="%EXPECTED_QA_SHA%" exit /b 1
          if /i not "%PROD_SHA%"=="%EXPECTED_PRODUCT_SHA%" exit /b 1
          git -C "%GITHUB_WORKSPACE%\qa36-gate-%GITHUB_RUN_ID%" status --porcelain --untracked-files=all >"%RUNNER_TEMP%\qa36-qa-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          for %%F in ("%RUNNER_TEMP%\qa36-qa-%GITHUB_RUN_ID%.txt") do if %%~zF GTR 0 exit /b 1
          git -C "%GITHUB_WORKSPACE%\qa36-product-%GITHUB_RUN_ID%" status --porcelain --untracked-files=all >"%RUNNER_TEMP%\qa36-prod-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          for %%F in ("%RUNNER_TEMP%\qa36-prod-%GITHUB_RUN_ID%.txt") do if %%~zF GTR 0 exit /b 1
          del /q "%RUNNER_TEMP%\qa36-qa-%GITHUB_RUN_ID%.txt" "%RUNNER_TEMP%\qa36-prod-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          echo QA36_BOTH_SHAS_CLEAN=PASS
      - name: Validate mocked native containment and JS before real tests
        shell: cmd
        working-directory: qa36-gate-${{ github.run_id }}
        run: |
          @echo off
          "%ZAMEROVAC_PYTHON%" tests\test_qa_windows_job_contract.py -v
          if errorlevel 1 exit /b 1
          "%ZAMEROVAC_PYTHON%" tests\test_qa_process_diagnostic.py -v
          if errorlevel 1 exit /b 1
          node --check tools\qa-process-client.cjs
          if errorlevel 1 exit /b 1
          node --check tools\qa-fixture-gate.cjs
          if errorlevel 1 exit /b 1
          node --check tools\qa-fixture-worker.cjs
          if errorlevel 1 exit /b 1
          echo QA36_FIXTURE_MODELS=PASS
      - name: Read-only runner preflight - no leftover QA-account Node or Python jobs
        shell: cmd
        run: |
          @echo off
          tasklist /FI "IMAGENAME eq node.exe" /FI "USERNAME eq %COMPUTERNAME%\ZamerovacQA" /FO CSV /NH > "%RUNNER_TEMP%\qa36-node-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          findstr /I /C:"node.exe" "%RUNNER_TEMP%\qa36-node-%GITHUB_RUN_ID%.txt" >nul
          if not errorlevel 1 exit /b 1
          tasklist /FI "IMAGENAME eq python.exe" /FI "USERNAME eq %COMPUTERNAME%\ZamerovacQA" /FO CSV /NH > "%RUNNER_TEMP%\qa36-python-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          findstr /I /C:"python.exe" "%RUNNER_TEMP%\qa36-python-%GITHUB_RUN_ID%.txt" >nul
          if not errorlevel 1 exit /b 1
          tasklist /FI "IMAGENAME eq pythonw.exe" /FI "USERNAME eq %COMPUTERNAME%\ZamerovacQA" /FO CSV /NH > "%RUNNER_TEMP%\qa36-pythonw-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          findstr /I /C:"pythonw.exe" "%RUNNER_TEMP%\qa36-pythonw-%GITHUB_RUN_ID%.txt" >nul
          if not errorlevel 1 exit /b 1
          del /q "%RUNNER_TEMP%\qa36-node-%GITHUB_RUN_ID%.txt" "%RUNNER_TEMP%\qa36-python-%GITHUB_RUN_ID%.txt" "%RUNNER_TEMP%\qa36-pythonw-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          echo QA36_RUNNER_IDLE_PREFLIGHT=PASS
      - name: Single normal inert native no-op with verified cleanup
        shell: cmd
        working-directory: qa36-gate-${{ github.run_id }}
        run: |
          @echo off
          call tools\qa35-noop-gate.cmd
          if errorlevel 1 exit /b 1
          echo QA36_NATIVE_NOOP=PASS
      - name: One original fifteen-case suite after no-op; cooperative stop only
        shell: cmd
        working-directory: qa36-gate-${{ github.run_id }}
        run: |
          @echo off
          if not "%PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD%"=="1" exit /b 1
          if not defined ZAMEROVAC_SOURCE_ROOT exit /b 1
          call tools\qa35-fixture15-gate.cmd
          if errorlevel 1 exit /b 1
          echo QA36_FIXTURE15_FULL=PASS
