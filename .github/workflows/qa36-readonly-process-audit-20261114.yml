name: QA36 - read only process presence after blocked normal preflight
# Diagnostic only; no checkout, Node/Python invocation, process termination or worker.
on:
  push:
    branches: ['coord36/pr135-review-fixes-20261114']
    paths: ['docs/qa/qa36-readonly-process-audit.trigger']
permissions:
  contents: read
concurrency:
  group: qa36-r44-readonly-process-audit-one-shot
  cancel-in-progress: false
jobs:
  read-only-runner:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.triggering_actor == 'zaplikj30-ui' && github.event_name == 'push' && github.ref == 'refs/heads/coord36/pr135-review-fixes-20261114' && github.event.created == false && github.run_number == 1 && github.run_attempt == 1 && github.event.head_commit.message == 'OWNER-APPROVED-QA36-READONLY-PROCESS-AUDIT-20261114' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 2
    steps:
      - name: Validate trusted service identity
        shell: cmd
        run: |
          @echo off
          set "QA_USER="
          for /f "delims=" %%U in ('C:\Windows\System32\whoami.exe') do set "QA_USER=%%U"
          if not defined QA_USER exit /b 1
          if not defined COMPUTERNAME exit /b 1
          if /i not "%QA_USER%"=="%COMPUTERNAME%\ZamerovacQA" exit /b 1
          echo QA36_READONLY_IDENTITY=PASS
      - name: Read-only Node/Python process presence - no paths or PIDs published
        shell: cmd
        run: |
          @echo off
          tasklist /FI "IMAGENAME eq node.exe" /FO CSV /NH > "%RUNNER_TEMP%\qa36-all-node-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          findstr /I /C:"node.exe" "%RUNNER_TEMP%\qa36-all-node-%GITHUB_RUN_ID%.txt" >nul
          if not errorlevel 1 (echo QA36_ANY_NODE=YES) else (echo QA36_ANY_NODE=NO)
          tasklist /FI "IMAGENAME eq python.exe" /FO CSV /NH > "%RUNNER_TEMP%\qa36-all-python-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          findstr /I /C:"python.exe" "%RUNNER_TEMP%\qa36-all-python-%GITHUB_RUN_ID%.txt" >nul
          if not errorlevel 1 (echo QA36_ANY_PYTHON=YES) else (echo QA36_ANY_PYTHON=NO)
          tasklist /FI "IMAGENAME eq pythonw.exe" /FO CSV /NH > "%RUNNER_TEMP%\qa36-all-pythonw-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          findstr /I /C:"pythonw.exe" "%RUNNER_TEMP%\qa36-all-pythonw-%GITHUB_RUN_ID%.txt" >nul
          if not errorlevel 1 (echo QA36_ANY_PYTHONW=YES) else (echo QA36_ANY_PYTHONW=NO)
          tasklist /FI "IMAGENAME eq node.exe" /FI "USERNAME eq %COMPUTERNAME%\ZamerovacQA" /FO CSV /NH > "%RUNNER_TEMP%\qa36-service-node-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          findstr /I /C:"node.exe" "%RUNNER_TEMP%\qa36-service-node-%GITHUB_RUN_ID%.txt" >nul
          if not errorlevel 1 (echo QA36_SERVICE_NODE=YES) else (echo QA36_SERVICE_NODE=NO)
          tasklist /FI "IMAGENAME eq python.exe" /FI "USERNAME eq %COMPUTERNAME%\ZamerovacQA" /FO CSV /NH > "%RUNNER_TEMP%\qa36-service-python-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          findstr /I /C:"python.exe" "%RUNNER_TEMP%\qa36-service-python-%GITHUB_RUN_ID%.txt" >nul
          if not errorlevel 1 (echo QA36_SERVICE_PYTHON=YES) else (echo QA36_SERVICE_PYTHON=NO)
          del /q "%RUNNER_TEMP%\qa36-*-node-%GITHUB_RUN_ID%.txt" "%RUNNER_TEMP%\qa36-*-python-%GITHUB_RUN_ID%.txt" "%RUNNER_TEMP%\qa36-all-pythonw-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          echo QA36_READONLY_PROCESS_INSPECTION=PASS
