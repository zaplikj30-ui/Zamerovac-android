name: Zamerovac - domaci technicky APK build bez vydani

# Jen vlastni infrastruktura, bez placeneho cloudoveho runneru.
# Zamerne nezavisi na Linux-only Robolectric FAIL; sestaveni NENAHRAZUJE QA.
on:
  push:
    branches: [infra/windows-self-hosted-qa-20261108]
    paths:
      - '.github/workflows/windows-preview-build-proof.yml'

permissions:
  contents: read

concurrency:
  group: zamerovac-windows-tech-build
  cancel-in-progress: false

jobs:
  technical-preview:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/infra/windows-self-hosted-qa-20261108' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 45
    name: Windows11 - pouze build, podpis, verze; pak smazat APK
    env:
      CI: '1'
      QA_SOURCE_SHA: 'bc67b1a3507829a39be46a2b41e04198c71fe767'
      ANDROID_HOME: 'C:\actions-runner\tools\AndroidSdk'
      ANDROID_SDK_ROOT: 'C:\actions-runner\tools\AndroidSdk'
    steps:
      - name: Git CLI z overene lokalni instalace
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"

      - name: Checkout overenych vlastnich zdroju B12 QA - zadne forky
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Overit presny skutecny commit
        shell: cmd
        run: |
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if not defined ACTUAL_SHA exit /b 1
          if /I not "%ACTUAL_SHA%"=="%QA_SOURCE_SHA%" (
            echo FAIL: tested source commit mismatch
            exit /b 1
          )
          echo TECHNICAL_BUILD_SOURCE_SHA=%ACTUAL_SHA%

      - name: JDK17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2, bez cache akce
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Overit sdk a verzi pripravenych zdroju
        shell: cmd
        run: |
          if not exist "%ANDROID_HOME%\platforms\android-35\source.properties" exit /b 1
          if not exist "%ANDROID_HOME%\build-tools\34.0.0\apksigner.bat" exit /b 1
          if not exist "%ANDROID_HOME%\build-tools\34.0.0\aapt.exe" exit /b 1
          call node tools\release\versioning.js --check
          if errorlevel 1 exit /b 1

      - name: Sestavit podepsanou preview APK JEN pro kontrolu
        shell: cmd
        run: |
          rem GITHUB_RUN_NUMBER je cislo JINEHO workflow - nepouzivat jej pro versionCode.
          rem V technicke zkousce explicitne vyssi versionCode=1155 nez release 1154.
          set "GITHUB_RUN_NUMBER=155"
          call gradle.bat --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=-Xmx1536m" :app:verifyDriveRegistration :app:assemblePreview -PdriveRequireConfigured=true
          if errorlevel 1 exit /b 1
          set "APK=%GITHUB_WORKSPACE%\app\build\outputs\apk\preview\app-preview.apk"
          if not exist "%APK%" exit /b 1
          call "%ANDROID_HOME%\build-tools\34.0.0\apksigner.bat" verify --min-sdk-version 26 --print-certs "%APK%" > "%RUNNER_TEMP%\zamerovac-sign-check.txt"
          if errorlevel 1 exit /b 1
          findstr /i /c:"c828c96739e554e8da4f5851913356134f1359a98d5013772ad5587e74a2d229" "%RUNNER_TEMP%\zamerovac-sign-check.txt" >nul
          if errorlevel 1 exit /b 1
          "%ANDROID_HOME%\build-tools\34.0.0\aapt.exe" dump badging "%APK%" > "%RUNNER_TEMP%\zamerovac-package-check.txt"
          if errorlevel 1 exit /b 1
          findstr /c:"name='cz.zamerovac.app.preview'" "%RUNNER_TEMP%\zamerovac-package-check.txt" >nul
          if errorlevel 1 exit /b 1
          findstr /c:"versionCode='1155'" "%RUNNER_TEMP%\zamerovac-package-check.txt" >nul
          if errorlevel 1 exit /b 1
          findstr /c:"versionName='1.3.0-test'" "%RUNNER_TEMP%\zamerovac-package-check.txt" >nul
          if errorlevel 1 exit /b 1
          echo PASS: technicke sestaveni a stejny podpis, balicek, verze, code 1155.
          echo NOT RELEASED, NOT UPLOADED, NOT INSTALLED. Native QA FAIL je oddeleny blokator.

      - name: Zlikvidovat jen technicke sestaveni a diagnostiku
        if: always()
        shell: cmd
        run: |
          if exist "app\build\outputs\apk\preview\app-preview.apk" del /f /q "app\build\outputs\apk\preview\app-preview.apk"
          if exist "%RUNNER_TEMP%\zamerovac-sign-check.txt" del /f /q "%RUNNER_TEMP%\zamerovac-sign-check.txt"
          if exist "%RUNNER_TEMP%\zamerovac-package-check.txt" del /f /q "%RUNNER_TEMP%\zamerovac-package-check.txt"
          echo No APK published or attached.
