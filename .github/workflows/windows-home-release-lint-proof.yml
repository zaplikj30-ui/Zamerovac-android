name: Zamerovac - read-only staticky audit domaciho release workflow
on:
  push:
    branches: [infra/windows-self-hosted-qa-20261108]
    paths:
      - '.github/workflows/windows-home-release-lint-proof.yml'
permissions:
  contents: read
jobs:
  release-lint:
    if: github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui'
    name: Windows QA - YAML / Python AST / safety gates (NO APK)
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 12
    steps:
      - name: Git before checkout
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
      - name: Checkout only own exact infra SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Pinned Python/YAML parser and AST review
        shell: 'C:\actions-runner\tools\Python313\python.exe {0}'
        run: |
          import ast
          import os
          from pathlib import Path
          import subprocess
          import sys

          expected = os.environ["GITHUB_SHA"]
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != expected or os.environ.get("USERNAME", "").lower() != "zamerovacqa":
              sys.exit("STOP: untrusted workspace")
          binary = r"C:\actions-runner\tools\Python313\python.exe"
          subprocess.run([binary, "-m", "pip", "install", "--disable-pip-version-check",
                          "--only-binary=:all:", "PyYAML==6.0.3"], check=True)
          import yaml
          path = Path(".github/workflows/windows-home-apk-release.yml")
          source = path.read_text(encoding="utf-8")
          data = yaml.safe_load(source)
          event = data.get("on") or data.get(True)
          if not isinstance(event, dict) or set(event) != {"workflow_dispatch"}:
              sys.exit("STOP: release cannot be automatically triggered")
          jobs = data["jobs"]
          if len(jobs) != 1 or "home-preview-release" not in jobs:
              sys.exit("STOP: unexpected release jobs")
          job = jobs["home-preview-release"]
          if job["runs-on"] != ["self-hosted", "Windows", "X64", "zamerovac-qa"]:
              sys.exit("STOP: release not pinned to home Windows")
          guards = job.get("if", "")
          for token in ("publish_release == true", "github.actor == 'zaplikj30-ui'",
                        "github.ref == 'refs/heads/main'", "qa_run_id != ''"):
              if token not in guards:
                  sys.exit("STOP: release gate missing " + token)
          if data["permissions"] != {"contents": "write", "actions": "read"}:
              sys.exit("STOP: invalid token permissions")
          inputs = event["workflow_dispatch"]["inputs"]
          if inputs["publish_release"]["default"] is not False:
              sys.exit("STOP: release must default to disabled")
          steps = job["steps"]
          scripts = []
          for step in steps:
              if "Python313" in step.get("shell", "") and "run" in step:
                  scripts.append(step["run"])
                  ast.parse(step["run"])
          if len(scripts) != 3:
              sys.exit("STOP: expected 3 syntactically valid Python release scripts")
          all_code = "\n".join(scripts)
          for token in ('head_sha', '265 Robolectric + PDF', 'prior_code + 1',
                        'releases/tags/', 'signer', 'draft', 'published',
                        'RELEASE_VERSION_CODE'):
              if token not in all_code:
                  sys.exit("STOP: release proof missing " + token)
          print("PASS: guarded manual-only home release YAML, three valid Python scripts, QA SHA/4 jobs, cert, previous APK and atomic draft publication")
          print("NOT RUN: actual release API, actual APK publishing. No APK created.")
