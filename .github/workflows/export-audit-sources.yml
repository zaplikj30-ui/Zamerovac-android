name: Zaměřovač – export zdrojů pro nezávislý audit (BEZ APK)
on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: 'Úplný commit SHA vydané APK pro zdrojový audit'
        required: false
        default: '2d1e4a45d4e35e8dd7e9c7109c92a8a62344b12e'
      cloud_run_approved:
        description: 'Placený GitHub cloud pouze s výslovným souhlasem; měsíční strop 12 USD'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  export:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && inputs.cloud_run_approved == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Načíst aktuální exportní skript (ne Android aplikaci)
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - name: Načíst PŘESNÝ vydaný commit Zaměřovače
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit || '2d1e4a45d4e35e8dd7e9c7109c92a8a62344b12e' }}
          path: release-source
          persist-credentials: false
      - name: Vytvořit textové balíky a seznam souborů bez klíčů
        env:
          EXPECTED_RELEASE_COMMIT: ${{ inputs.release_commit || '2d1e4a45d4e35e8dd7e9c7109c92a8a62344b12e' }}
        run: |
          set -euo pipefail
          python3 builder/tools/audit/source_bundle.py release-source audit-output
      - name: Uložit pouze TXT zdroje ke stažení – nikoli APK
        uses: actions/upload-artifact@v4
        with:
          name: Zamerovac-1.3.0-auditni-zdroje-${{ github.run_number }}
          path: audit-output/*.txt
          if-no-files-found: error
          retention-days: 14
