name: Zamerovac - owner-only targeted HOME native QA, no APK
on:
  push:
    branches: [qa/pr102-targeted-native-20261110]
    paths: ['.github/workflows/home-qa-targeted-native.yml']
permissions:
  contents: read
concurrency:
  group: zamerovac-targeted-native-qa/pr102-targeted-native-20261110
  cancel-in-progress: false
jobs:
  targeted-native:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/qa/pr102-targeted-native-20261110' && github.event_name == 'push' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 80
    env:
      CI: '1'
      PYTHONUTF8: '1'
      TESTED_SHA: '144bb5573932be032411c11451aa560a10f623ee'
    steps:
      - name: Require owner service and locally installed trusted tools
        shell: cmd
        run: |
          if /I not "%USERNAME%"=="ZamerovacQA" exit /b 1
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          if not exist "C:\actions-runner\tools\Python313\python.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
          echo C:\actions-runner\tools\Python313>>"%GITHUB_PATH%"
      - name: Checkout independently reviewed immutable QA gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: bd5bac7298b92a8d85bc3ec14f2bb8d2e79aa519
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Checkout triggering workflow YAML as inert data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: workflow
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Prove reviewed QA gate SHA before executing any checked out code
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\recipe"
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_GATE_SHA=%%H"
          if not defined ACTUAL_GATE_SHA exit /b 1
          if /I not "%ACTUAL_GATE_SHA%"=="bd5bac7298b92a8d85bc3ec14f2bb8d2e79aa519" exit /b 1
          echo REVIEWED_QA_GATE_SHA=%ACTUAL_GATE_SHA%
      - name: Strict workflow lint and generator negative regressions
        shell: cmd
        run: |
          python recipe\tools\home_qa_gate.py lint-native-workflow workflow\.github\workflows\home-qa-targeted-native.yml --strict
          if errorlevel 1 exit /b 1
          python -m unittest discover -s recipe\tests -p test_home_qa_gate.py -v
          if errorlevel 1 exit /b 1
      - name: Verify owner-repository source branch HEAD before checkout
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python recipe\tools\home_qa_gate.py verify-trusted-source --source-branch fix/p1-34-b-protected-archive-chat33-20261110 --expected-sha 144bb5573932be032411c11451aa560a10f623ee
          if errorlevel 1 exit /b 1
      - name: Read-only exact source SHA, no fork, credentials or submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 144bb5573932be032411c11451aa560a10f623ee
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Verify checked out source SHA and run serial targeted WSL2 tests
        shell: cmd
        run: |
          python recipe\tools\home_qa_gate.py wsl-targeted-from-windows --expected-sha 144bb5573932be032411c11451aa560a10f623ee --root source
          if errorlevel 1 exit /b 1
      - name: Archive only successful numeric JUnit summary, never APK or source
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-targeted-144bb5573932be032411c11451aa560a10f623ee
          path: qa-evidence/native-targeted-summary.txt
          retention-days: 7
          if-no-files-found: error
