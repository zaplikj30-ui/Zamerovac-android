name: Zaměřovač – PR150 strict CLOUD Chromium C (owner-only one-shot)
# Owner-approved GitHub-hosted one-shot via exact owner comment on PR #160.
# No push trigger, no HOME, no release, no APK. Unrelated comments skip the job.
# Q=independently SOURCE-reviewed PR163; all P/V/Q-parent/Q/E gates remain.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      product_sha:
        description: 'Exact reviewed PR150 product commit'
        type: string
        required: true
      validator_sha:
        description: 'Exact independently reviewed PR163 Q validator commit'
        type: string
        required: true
      event_sha:
        description: 'Exact owner-approved event/main commit'
        type: string
        required: true
      owner_approved:
        description: 'Explicitly approved one cloud-only run'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: zamerovac-pr150-strict-cloud-only
  cancel-in-progress: false
jobs:
  cloud-pr150:
    # Only exact owner approval comment on PR160 or separately approved manual dispatch.
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.event.repository.private == false && github.actor == 'zaplikj30-ui' && github.triggering_actor == 'zaplikj30-ui' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && ((github.event_name == 'workflow_dispatch' && inputs.owner_approved == true && inputs.product_sha == '3886fcf80213e4693464d3f30104885c1c58f53e') || (github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.number == 160 && github.event.comment.user.login == 'zaplikj30-ui' && github.event.comment.body == format('ZAMEROVAC-CLOUD-RUN E={0} P=3886fcf80213e4693464d3f30104885c1c58f53e Q=445d7df8ecb77c902b58220e16d8ed1873f816da', github.sha))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONOPTIMIZE: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      QA_APPROVED_Q: ${{ github.event_name == 'issue_comment' && '445d7df8ecb77c902b58220e16d8ed1873f816da' || vars.CLOUD_DIAG_APPROVED_Q }}
      QA_APPROVED_E: ${{ github.event_name == 'issue_comment' && github.sha || vars.CLOUD_DIAG_APPROVED_E }}
      QA_PRODUCT_SHA: ${{ github.event_name == 'issue_comment' && '3886fcf80213e4693464d3f30104885c1c58f53e' || inputs.product_sha }}
      QA_VALIDATOR_SHA: ${{ github.event_name == 'issue_comment' && '445d7df8ecb77c902b58220e16d8ed1873f816da' || inputs.validator_sha }}
      QA_EVENT_SHA: ${{ github.event_name == 'issue_comment' && github.sha || inputs.event_sha }}
    steps:
      - name: Strict precheckout owner/main/P/V/E/public metadata; no payload
        id: preflight
        shell: bash
        timeout-minutes: 2
        env:
          QA_CLOUD_METADATA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          e=os.environ
          expected={'GITHUB_REPOSITORY':'zaplikj30-ui/Zamerovac-android',
            'GITHUB_ACTOR':'zaplikj30-ui','GITHUB_TRIGGERING_ACTOR':'zaplikj30-ui',
            'GITHUB_REF':'refs/heads/main',
            'GITHUB_RUN_ATTEMPT':'1','RUNNER_OS':'Linux','RUNNER_ENVIRONMENT':'github-hosted'}
          def block(message):raise SystemExit('BLOCKED cloud precheckout: '+message)
          if any(e.get(k)!=v for k,v in expected.items()):block('actor/ref/runner')
          if e.get('GITHUB_EVENT_NAME') not in ('workflow_dispatch','issue_comment'):block('event')
          if e['GITHUB_EVENT_NAME']=='issue_comment':
            with open(e['GITHUB_EVENT_PATH'],encoding='utf-8') as source: event=json.load(source)
            issue=event.get('issue') or {}
            comment=event.get('comment') or {}
            expected_comment='ZAMEROVAC-CLOUD-RUN E='+e['QA_EVENT_SHA']+' P='+e['QA_PRODUCT_SHA']+' Q='+e['QA_VALIDATOR_SHA']
            if (event.get('action')!='created' or issue.get('number')!=160 or
                (comment.get('user') or {}).get('login')!='zaplikj30-ui' or
                comment.get('body')!=expected_comment):block('owner approval comment')
          if e.get('QA_PRODUCT_SHA')!='3886fcf80213e4693464d3f30104885c1c58f53e':block('unreviewed P')
          for k in ('QA_VALIDATOR_SHA','QA_EVENT_SHA','GITHUB_SHA'):
            if not re.fullmatch('[0-9a-f]{40}',e.get(k,'')):block('missing SHA')
          if e['GITHUB_SHA']!=e['QA_EVENT_SHA'] or e.get('GITHUB_WORKFLOW_SHA')!=e['QA_EVENT_SHA']:block('stale E')
          if e.get('QA_APPROVED_Q')!=e['QA_VALIDATOR_SHA'] or e.get('QA_APPROVED_E')!=e['QA_EVENT_SHA']:block('external approval missing')
          def get(resource):
            if not e.get('QA_CLOUD_METADATA_TOKEN'):block('metadata token unavailable')
            req=urllib.request.Request('https://api.github.com/repos/zaplikj30-ui/Zamerovac-android'+('/'+resource if resource else ''),
              headers={'Accept':'application/vnd.github+json','User-Agent':'zamerovac-cloud-qa',
                'Authorization':'Bearer '+e['QA_CLOUD_METADATA_TOKEN']})
            with urllib.request.urlopen(req,timeout=12) as response:
              if response.status!=200:block('API status')
              return json.load(response)
          repo=get('')
          p=get('pulls/150')
          v=get('pulls/155')
          parent_q=get('pulls/156')
          q=get('pulls/163')
          if (get('git/ref/heads/main').get('object') or {}).get('sha')!=e['QA_EVENT_SHA']:block('moved main')
          if (get('git/ref/heads/fix/cloud-validator-owner-comment-live-20261117').get('object') or {}).get('sha')!=e['QA_VALIDATOR_SHA']:block('moved Q branch')
          if repo.get('private') is not False or repo.get('visibility')!='public':block('billing/private')
          def safe_pr(pr,sha):
            return (pr.get('state')=='open' and (pr.get('head') or {}).get('sha')==sha
              and ((pr.get('head') or {}).get('repo') or {}).get('full_name')==e['GITHUB_REPOSITORY'])
          if not safe_pr(p,e['QA_PRODUCT_SHA']):block('moved P')
          if not safe_pr(v,'9f733b24194a7870fa1377b256076bca7a71eb5a'):block('moved V')
          if not safe_pr(parent_q,'ca6c23727f692e26811d9e7f3b346116533aa6b5'):block('moved Q parent')
          if not safe_pr(q,e['QA_VALIDATOR_SHA']):block('moved Q')
          if (p.get('base') or {}).get('ref')!='main':block('P base')
          if (v.get('base') or {}).get('ref')!='implement/home4-p1-p4-20261115':block('V base')
          if (parent_q.get('base') or {}).get('ref')!='programator/cloud-qa-a1-a3-20261116':block('Q parent base')
          if ((q.get('base') or {}).get('ref')!='fix/quick155-real-regression-20261116'
              or (q.get('head') or {}).get('ref')!='fix/cloud-validator-owner-comment-live-20261117'):block('Q branch/base')
          print('PASS only precheckout P/V/Q-parent/Q/E/public metadata; NOT test PASS')
          PY
      - name: Checkout exact reviewed validator V, no persisted credentials
        id: checkout_v
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_VALIDATOR_SHA }}
          path: validator
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact product P separately, no replaced source bytes
        id: checkout_p
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_PRODUCT_SHA }}
          path: product
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Verify both clean HEAD and no HOME or unexpected source overlay
        id: pinned
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test "$(git -C validator rev-parse HEAD)" = "$QA_VALIDATOR_SHA"
          test "$(git -C product rev-parse HEAD)" = "$QA_PRODUCT_SHA"
          test -z "$(git -C validator status --porcelain --untracked-files=all)"
          test -z "$(git -C product status --porcelain --untracked-files=all)"
          # QUICK executes validator-owned tests; they must exercise exactly P's
          # product/native sources, not a quietly altered V product overlay.
          # git tree/blob identities compare *all bytes* within each path.
          for product_path in app sync config gradle build.gradle gradle.properties settings.gradle; do
            test "$(git -C validator rev-parse "HEAD:$product_path")" = \
                 "$(git -C product rev-parse "HEAD:$product_path")" || {
              echo 'BLOCKED P/V product tree differs; STOP NO RETRY'; exit 78;
            }
          done
      - name: Node 24 exact major; no npm cache/install
        id: node_setup
        if: ${{ !cancelled() && steps.pinned.outcome == 'success' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: QUICK – exact 74+4 Node families, 190 named TAP, 216+5 Python
        id: quick
        if: ${{ !cancelled() && steps.pinned.outcome == 'success' && steps.node_setup.outcome == 'success' }}
        working-directory: validator
        timeout-minutes: 22
        env:
          ZAMEROVAC_CLOUD_QUICK: '1'
          ZAMEROVAC_CLOUD_QUICK_PRODUCT_ROOT: ${{ github.workspace }}/product
        shell: bash
        run: |
          set -euo pipefail
          for file in app/src/main/assets/*.js sync/*.js; do node --check "$file"; done
          node tools/qa/audit.cjs
          node tools/check-android-window.cjs
          node tools/qa-cloud-quick.cjs
          python3 tools/qa_cloud_quick.py
      - name: Start one shared 200 minute deadline after QUICK
        id: cloud_deadline
        if: ${{ !cancelled() && steps.quick.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          echo "ZAMEROVAC_CLOUD_DEADLINE=$(( $(date +%s)*1000 + 12000000 ))" >> "$GITHUB_ENV"
      - name: CLOUD-C synthetic provision + handoff negative regression (no install)
        id: cloud_c_tests
        if: ${{ !cancelled() && steps.cloud_deadline.outcome == 'success' }}
        timeout-minutes: 3
        working-directory: validator
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa_cloud_provision_test.py
          node --test tools/qa-cloud-handoff-test.cjs
      - name: One credential-free hosted Chromium provisioning, fail closed
        id: provision
        if: ${{ !cancelled() && steps.cloud_c_tests.outcome == 'success' }}
        timeout-minutes: 16
        working-directory: validator
        shell: bash
        env:
          ZAMEROVAC_QA_VALIDATOR_ROOT: ${{ github.workspace }}/validator
          ZAMEROVAC_EXPECTED_PRODUCT_SHA: ${{ env.QA_PRODUCT_SHA }}
          ZAMEROVAC_CLOUD_REVIEWED_V_SHA: ${{ env.QA_VALIDATOR_SHA }}
          ZAMEROVAC_CLOUD_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # QUICK must not have dirtied either checkout before provisioning.
          test "$(git rev-parse HEAD)" = "$QA_VALIDATOR_SHA"
          test "$(git -C ../product rev-parse HEAD)" = "$QA_PRODUCT_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git -C ../product status --porcelain --untracked-files=all)"
          # The provisioning INTERPRETER receives only these reviewed inputs.
          # No automatic Actions/OIDC/REST token, proxy, npmrc or Node preload.
          env -i PATH="$PATH" LANG=C.UTF-8 \
            RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            GITHUB_SHA="$GITHUB_SHA" \
            ZAMEROVAC_QA_VALIDATOR_ROOT="$ZAMEROVAC_QA_VALIDATOR_ROOT" \
            ZAMEROVAC_EXPECTED_PRODUCT_SHA="$ZAMEROVAC_EXPECTED_PRODUCT_SHA" \
            ZAMEROVAC_CLOUD_REVIEWED_V_SHA="$ZAMEROVAC_CLOUD_REVIEWED_V_SHA" \
            ZAMEROVAC_CLOUD_EVENT_SHA="$ZAMEROVAC_CLOUD_EVENT_SHA" \
            ZAMEROVAC_CLOUD_DEADLINE="$ZAMEROVAC_CLOUD_DEADLINE" \
            python3 tools/qa_cloud_provision.py --prepare
      - name: STRICT Chromium – one-root handoff, no second npm or fallback
        id: strict_browser
        if: ${{ !cancelled() && steps.quick.outcome == 'success' && steps.provision.outcome == 'success' }}
        working-directory: validator
        timeout-minutes: 210
        shell: bash
        env:
          QA_CLOUD_METADATA_TOKEN: ${{ github.token }}
          ZAMEROVAC_QA_MODE: cloud
          NODE_OPTIONS: ''
          NODE_PATH: ''
          PYTHONPATH: ''
          ZAMEROVAC_CLOUD_TRUST: trusted-host/change-detection
          ZAMEROVAC_CLOUD_STAGE: ${{ runner.temp }}/zamerovac-cloud-stage
          ZAMEROVAC_CLOUD_SCRATCH: ${{ runner.temp }}/zamerovac-cloud-final
          ZAMEROVAC_CLOUD_INVENTORY_SHA256: ${{ steps.provision.outputs.inventory_sha256 }}
          ZAMEROVAC_EXPECTED_PRODUCT_SHA: ${{ env.QA_PRODUCT_SHA }}
          ZAMEROVAC_CLOUD_REVIEWED_V_SHA: ${{ env.QA_VALIDATOR_SHA }}
          ZAMEROVAC_CLOUD_EVENT_SHA: ${{ github.sha }}
          ZAMEROVAC_SOURCE_ROOT: ${{ github.workspace }}/product
          ZAMEROVAC_QA_RESULT_PARENT: ${{ runner.temp }}/zamerovac-cloud-browser
          ZAMEROVAC_EXPECTED_QA_SHA: ${{ env.QA_VALIDATOR_SHA }}
        run: |
          set -euo pipefail
          export ZAMEROVAC_PYTHON="$(realpath "$(command -v python3)")"
          node tools/qa-cloud-diag.cjs
      - name: Prepare JDK 17 after browser KNOWN_CLEAN only
        id: java_setup
        if: ${{ !cancelled() && steps.pinned.outcome == 'success' && steps.quick.outcome == 'success' && steps.strict_browser.outputs.cleanup == 'KNOWN_CLEAN' }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2 cache disabled
        id: gradle_setup
        if: ${{ !cancelled() && steps.java_setup.outcome == 'success' }}
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.10.2'
          cache-disabled: true
      - name: Native Drive public config – offline only, no APK
        id: drive
        if: ${{ !cancelled() && steps.gradle_setup.outcome == 'success' }}
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          gradle --offline --no-daemon -p product/tools/drive-config-checks verify
      - name: RAW JVM 64/513 – retain 2 genuine #88 FAIL, no Gradle downloads
        id: jvm
        if: ${{ !cancelled() && steps.gradle_setup.outcome == 'success' && steps.drive.outcome == 'success' }}
        timeout-minutes: 35
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          date +%s%N > "$RUNNER_TEMP/zamerovac-native-start"
          set +e
          gradle --offline --no-daemon :app:verifyDriveRegistration :app:compilePreviewJavaWithJavac :app:testPreviewUnitTest -PdriveRequireConfigured=true
          code=$?
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/zamerovac-raw-exit"
          exit "$code"
      - name: Strict fresh JVM XML – no count-only or false green
        id: strict_xml
        if: ${{ !cancelled() && steps.jvm.outcome != 'skipped' && steps.jvm.outcome != 'cancelled' && steps.strict_browser.outputs.cleanup == 'KNOWN_CLEAN' }}
        working-directory: validator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/zamerovac-native-start"
          test -s "$RUNNER_TEMP/zamerovac-raw-exit"
          python3 tools/qa_cloud_native.py xml "$GITHUB_WORKSPACE/product" "$(cat "$RUNNER_TEMP/zamerovac-native-start")" "$(cat "$RUNNER_TEMP/zamerovac-raw-exit")"
      - name: Synthetic PDF – 3 fresh ZIP, no unapproved pip/apt/install
        id: pdf
        if: ${{ !cancelled() && steps.strict_xml.outputs.jvm_verified == 'true' && steps.strict_browser.outputs.cleanup == 'KNOWN_CLEAN' }}
        working-directory: validator
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import pypdf,pymupdf"
          python3 tools/qa_cloud_native.py pdf "$GITHUB_WORKSPACE/product" "$(cat "$RUNNER_TEMP/zamerovac-native-start")" "$(cat "$RUNNER_TEMP/zamerovac-raw-exit")"
      - name: Final live P/V/E check, no stale HEAD or fake PASS
        if: ${{ !cancelled() && steps.strict_browser.outputs.full_verified == 'true' }}
        timeout-minutes: 2
        env:
          QA_CLOUD_METADATA_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          e=os.environ
          if not e.get('QA_CLOUD_METADATA_TOKEN'):raise SystemExit('BLOCKED missing metadata token')
          reviewed=((150,e['QA_PRODUCT_SHA'],'main'),
                    (155,'9f733b24194a7870fa1377b256076bca7a71eb5a','implement/home4-p1-p4-20261115'),
                    (156,'ca6c23727f692e26811d9e7f3b346116533aa6b5','programator/cloud-qa-a1-a3-20261116'),
                    (163,e['QA_VALIDATOR_SHA'],'fix/quick155-real-regression-20261116'))
          for number,sha,base in reviewed:
            request=urllib.request.Request(
              'https://api.github.com/repos/zaplikj30-ui/Zamerovac-android/pulls/'+str(number),
              headers={'Accept':'application/vnd.github+json','User-Agent':'zamerovac-cloud-qa',
                'Authorization':'Bearer '+e['QA_CLOUD_METADATA_TOKEN']})
            with urllib.request.urlopen(request,timeout=12) as response: pr=json.load(response)
            head=pr.get('head') or {}
            if (pr.get('state')!='open' or head.get('sha')!=sha
                or (head.get('repo') or {}).get('full_name')!='zaplikj30-ui/Zamerovac-android'
                or (pr.get('base') or {}).get('ref')!=base
                or (number==163 and head.get('ref')!='fix/cloud-validator-owner-comment-live-20261117')):
              raise SystemExit('BLOCKED stale P/V/Q-parent/Q; STOP / NO RETRY')
          if e['QA_EVENT_SHA']!=e['GITHUB_SHA'] or e['QA_EVENT_SHA']!=e.get('GITHUB_WORKFLOW_SHA'):raise SystemExit('BLOCKED stale E')
          def live_ref(branch):
            request=urllib.request.Request('https://api.github.com/repos/zaplikj30-ui/Zamerovac-android/git/ref/heads/'+branch,
              headers={'User-Agent':'zamerovac-cloud-qa','Authorization':'Bearer '+e['QA_CLOUD_METADATA_TOKEN']})
            with urllib.request.urlopen(request,timeout=12) as response: return json.load(response)
          if (live_ref('main').get('object') or {}).get('sha')!=e['QA_EVENT_SHA']:raise SystemExit('BLOCKED moved main')
          if (live_ref('fix/cloud-validator-owner-comment-live-20261117').get('object') or {}).get('sha')!=e['QA_VALIDATOR_SHA']:raise SystemExit('BLOCKED moved Q branch')
          print('Final P/V/Q-parent/Q/E still exactly reviewed; individual test results remain raw')
          PY
