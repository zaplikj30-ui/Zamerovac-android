name: Zaměřovač – jednorázové offline testy APK gate PR186
# Disposable read-only QA on the existing request branch; never merge into main.
# Runs only after the exact request file is created. No APK, no publishing, no HOME.
on:
  push:
    branches: [qa/chromium-request]
    paths:
      - qa/apk186-python-once.txt

permissions:
  contents: read

jobs:
  gate-unit:
    name: PR186 Python gate tests
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.ref == 'refs/heads/qa/chromium-request' && github.event_name == 'push' && github.actor == 'zaplikj30-ui' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_SHA: 20199836e51ea53a1af0a2357ef13522f6a3dd3c
    steps:
      - name: Checkout request branch without stored token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify one exact authorized request
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat qa/apk186-python-once.txt)" = "$TEST_SHA"
      - name: Checkout exact PR186 source without stored token
        uses: actions/checkout@v4
        with:
          ref: 20199836e51ea53a1af0a2357ef13522f6a3dd3c
          path: product
          persist-credentials: false
      - name: Verify exact revision and Python syntax
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          python3 -m py_compile tools/release/apk_gate.py tests/test_apk_gate.py tests/test_ci_cloud_release_gate.py
          printf 'Verified SHA %s; Python syntax PASS\n' "$TEST_SHA"
      - name: New 13 offline APK gate unit tests
        working-directory: product
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_apk_gate.py' -v
      - name: Updated 9 offline release safety regression tests
        if: ${{ !cancelled() }}
        working-directory: product
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_ci_cloud_release_gate.py' -v
