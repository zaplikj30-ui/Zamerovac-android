name: TEMP Chat31 PR94 adversarial RED - trusted HOME only
on:
  push:
    branches: [qa/chat31-home-gate-red-20261110]
    paths: ['.github/workflows/chat31-home-gate-red-20261110.yml']
permissions:
  contents: read
concurrency:
  group: chat31-home-gate-red-20261110
  cancel-in-progress: false
jobs:
  red:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/qa/chat31-home-gate-red-20261110' && github.event_name == 'push' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 18
    env:
      EXPECTED_SHA: '45052f5a65ab7490b4e5387941871a90ec3bd0ab'
    steps:
      - name: Owner Windows service and pinned local tools
        shell: cmd
        run: |
          if /I not "%USERNAME%"=="ZamerovacQA" exit /b 1
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          if not exist "C:\actions-runner\tools\Python313\python.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
          echo C:\actions-runner\tools\Python313>>"%GITHUB_PATH%"
      - name: Checkout exact test-first SOURCE SHA without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 45052f5a65ab7490b4e5387941871a90ec3bd0ab
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Prove expected RED from six adversarial negative tests
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\source"
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL=%%H"
          if /I not "%ACTUAL%"=="%EXPECTED_SHA%" exit /b 1
          echo RED_TESTED_SOURCE_SHA=%ACTUAL%
          python -m unittest discover -s tests -p test_home_qa_gate.py -v
          if errorlevel 1 exit /b 1
          echo ERROR new adversarial tests unexpectedly passed
          exit /b 1
