name: Zamerovac - offline pinned one-shot HOME Chromium smoke 2026-11-13

# REVIEW branch cannot trigger this workflow. Explicit marker-only activation is separate.
on:
  push:
    branches:
      - 'qa/browser-smoke-offline-20261113-run'
    paths:
      - 'docs/qa/browser-smoke-offline-20261113.trigger'

permissions:
  contents: read

concurrency:
  group: zamerovac-offline-browser-smoke-20261113-one-shot
  cancel-in-progress: false

jobs:
  windows-browser-smoke:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.triggering_actor == 'zaplikj30-ui' && github.ref == 'refs/heads/qa/browser-smoke-offline-20261113-run' && github.event_name == 'push' && github.run_number == 1 && github.run_attempt == 1 && github.event.created == false && github.event.head_commit.message == 'APPROVED-ONE-SHOT-OFFLINE-BROWSER-20261113' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 50
    env:
      CI: '1'
      PYTHONUTF8: '1'
      ZAMEROVAC_EXPECTED_QA_SHA: '${{ github.event.before }}'
      ZAMEROVAC_SOURCE_ROOT: '${{ github.workspace }}\source'
      CHROMIUM_PATH: 'C:\actions-runner\tools\ms-playwright\chromium-1234\chrome-win64\chrome.exe'
      ZAMEROVAC_PYTHON: 'C:\actions-runner\tools\Python313\python.exe'
    steps:
      - name: Verify owner-only run and real Windows service identity
        shell: cmd
        run: |
          @echo off
          if /i not "%GITHUB_REPOSITORY%"=="zaplikj30-ui/Zamerovac-android" exit /b 1
          if /i not "%GITHUB_ACTOR%"=="zaplikj30-ui" exit /b 1
          if /i not "%GITHUB_TRIGGERING_ACTOR%"=="zaplikj30-ui" exit /b 1
          if /i not "%GITHUB_REF%"=="refs/heads/qa/browser-smoke-offline-20261113-run" exit /b 1
          if not "%GITHUB_EVENT_NAME%"=="push" exit /b 1
          if not "%GITHUB_RUN_ATTEMPT%"=="1" exit /b 1
          if not "%GITHUB_RUN_NUMBER%"=="1" exit /b 1
          set "QA_USER="
          for /f "delims=" %%A in ('C:\Windows\System32\whoami.exe') do (
            if defined QA_USER exit /b 1
            set "QA_USER=%%A"
          )
          if not defined QA_USER exit /b 1
          if not defined COMPUTERNAME exit /b 1
          if /i not "%QA_USER%"=="%COMPUTERNAME%\ZamerovacQA" exit /b 1
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          if not exist "C:\actions-runner\tools\Python313\python.exe" exit /b 1
          if not exist "C:\actions-runner\tools\ms-playwright\chromium-1234\chrome-win64\chrome.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
          echo C:\actions-runner\tools\Python313>>"%GITHUB_PATH%"
          echo TRUSTED_WINDOWS_SERVICE_ACCOUNT=%QA_USER%

      - name: Exact reviewed QA gate checkout (no scripts yet)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: zaplikj30-ui/Zamerovac-android
          ref: '${{ github.event.before }}'
          path: gate
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Exact approved PR121 product checkout (no scripts yet)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: zaplikj30-ui/Zamerovac-android
          ref: ae3b4df53c25557f28b4a25ccb65adc2abdff639
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: SHA and clean-byte preflight BEFORE executing checkout code
        shell: cmd
        run: |
          @echo off
          if "%ZAMEROVAC_EXPECTED_QA_SHA%"=="" exit /b 1
          if "%ZAMEROVAC_EXPECTED_QA_SHA%"=="0000000000000000000000000000000000000000" exit /b 1
          set "ACTUAL_QA="
          set "ACTUAL_PRODUCT="
          for /f %%H in ('git -C "%GITHUB_WORKSPACE%\gate" rev-parse HEAD') do set "ACTUAL_QA=%%H"
          for /f %%H in ('git -C "%GITHUB_WORKSPACE%\source" rev-parse HEAD') do set "ACTUAL_PRODUCT=%%H"
          if not defined ACTUAL_QA exit /b 1
          if not defined ACTUAL_PRODUCT exit /b 1
          if /i not "%ACTUAL_QA%"=="%ZAMEROVAC_EXPECTED_QA_SHA%" exit /b 1
          if /i not "%ACTUAL_PRODUCT%"=="ae3b4df53c25557f28b4a25ccb65adc2abdff639" exit /b 1
          git -C "%GITHUB_WORKSPACE%\gate" status --porcelain --untracked-files=all > "%RUNNER_TEMP%\qa-gate-status.txt"
          if errorlevel 1 exit /b 1
          for %%F in ("%RUNNER_TEMP%\qa-gate-status.txt") do if %%~zF GTR 0 exit /b 1
          git -C "%GITHUB_WORKSPACE%\source" status --porcelain --untracked-files=all > "%RUNNER_TEMP%\qa-source-status.txt"
          if errorlevel 1 exit /b 1
          for %%F in ("%RUNNER_TEMP%\qa-source-status.txt") do if %%~zF GTR 0 exit /b 1
          echo TRUSTED_QA_SHA=%ACTUAL_QA%
          echo TRUSTED_PRODUCT_SHA=%ACTUAL_PRODUCT%

      - name: Restore pinned Playwright from offline cache into isolated per-run temp
        shell: cmd
        run: |
          @echo off
          set "DEPS=%RUNNER_TEMP%\zamerovac-qa-playwright-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          if exist "%DEPS%" (
            echo BLOCKED: stale dependency directory
            exit /b 1
          )
          if not exist "%GITHUB_WORKSPACE%\gate\tools\qa-browser\package.json" exit /b 1
          if not exist "%GITHUB_WORKSPACE%\gate\tools\qa-browser\package-lock.json" exit /b 1
          set "PKG_BLOB="
          set "LOCK_BLOB="
          for /f %%H in ('git -C "%GITHUB_WORKSPACE%\gate" hash-object tools/qa-browser/package.json') do set "PKG_BLOB=%%H"
          for /f %%H in ('git -C "%GITHUB_WORKSPACE%\gate" hash-object tools/qa-browser/package-lock.json') do set "LOCK_BLOB=%%H"
          if /i not "%PKG_BLOB%"=="cd80df5950316c233785c4c96768d836689c79f5" exit /b 1
          if /i not "%LOCK_BLOB%"=="2901dfe9699efa4edbeab7e9655f4462228c39e9" exit /b 1
          mkdir "%DEPS%"
          if errorlevel 1 exit /b 1
          copy /y "%GITHUB_WORKSPACE%\gate\tools\qa-browser\package.json" "%DEPS%\package.json" >nul
          if errorlevel 1 exit /b 1
          copy /y "%GITHUB_WORKSPACE%\gate\tools\qa-browser\package-lock.json" "%DEPS%\package-lock.json" >nul
          if errorlevel 1 exit /b 1
          cd /d "%DEPS%"
          set "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1"
          set "npm_config_offline=true"
          call npm.cmd ci --offline --ignore-scripts --omit=optional --no-audit --no-fund
          if errorlevel 1 (
            echo BLOCKED: pinned Playwright packages missing from offline cache
            exit /b 1
          )
          set "NODE_PATH=%DEPS%\node_modules"
          node -e "const p=require('playwright/package.json'),c=require('playwright-core/package.json');if(p.version!=='1.62.1'||c.version!=='1.62.1')process.exit(3)"
          if errorlevel 1 exit /b 1
          echo NODE_PATH=%NODE_PATH%>>"%GITHUB_ENV%"
          if errorlevel 1 exit /b 1
          echo PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1>>"%GITHUB_ENV%"
          if errorlevel 1 exit /b 1
          echo OFFLINE_PINNED_PLAYWRIGHT_READY=1.62.1

      - name: Offline tool preflight - no network or fallback
        shell: cmd
        working-directory: gate
        run: |
          @echo off
          where node
          if errorlevel 1 exit /b 1
          node --version
          if errorlevel 1 exit /b 1
          "%ZAMEROVAC_PYTHON%" --version
          if errorlevel 1 exit /b 1
          node -e "const p=require('playwright/package.json');if(p.version!=='1.62.1')process.exit(2);console.log('PLAYWRIGHT_VERSION='+p.version)"
          if errorlevel 1 (
            echo BLOCKED: approved Playwright 1.62.1 not already resolvable offline
            exit /b 1
          )
          node --test tests/home_qa_integrity.js
          if errorlevel 1 exit /b 1
          node tools/local-browser-qa.cjs --self-test
          if errorlevel 1 exit /b 1

      - name: Run actual pinned Windows browser sandbox and three smoke suites
        shell: cmd
        working-directory: gate
        run: |
          @echo off
          set "ZAMEROVAC_QA_RESULT_PARENT=%RUNNER_TEMP%\zamerovac-one-shot-offline-browser-20261113"
          node tools/local-browser-qa.cjs --smoke
          if errorlevel 1 exit /b 1

      - name: Publish only synthetic text evidence (no cache or browser profiles)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zamerovac-one-shot-offline-browser-smoke-20261113
          path: |
            ${{ runner.temp }}/zamerovac-one-shot-offline-browser-20261113/run-*/results.json
            ${{ runner.temp }}/zamerovac-one-shot-offline-browser-20261113/run-*/*.log
            ${{ runner.temp }}/zamerovac-one-shot-offline-browser-20261113/run-*/evidence/**/report.json
          if-no-files-found: error
          retention-days: 3
