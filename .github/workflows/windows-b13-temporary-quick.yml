name: Zaměřovač – B13 cílený domácí RED/GREEN test (dočasný)
# Interní jednorázová kontrola; po PASS odstranit. Bez cloudu, bez APK.
on:
  push:
    branches: [qa/b13-three-pointer-safety-20261108]
    paths:
      - 'tests/gesture_history_undo_redo.js'
      - 'app/src/main/assets/editor.js'
      - '.github/workflows/windows-b13-temporary-quick.yml'
permissions:
  contents: read
concurrency:
  group: zamerovac-b13-home-quick
  cancel-in-progress: false
jobs:
  b13-quick:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/qa/b13-three-pointer-safety-20261108' && github.event_name == 'push' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 10
    steps:
      - name: Trusted installed Git before checkout
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
      - name: Read-only exact own SHA checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Verify actual checked-out commit and run ONLY targeted Node regression
        shell: cmd
        run: |
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if /I not "%ACTUAL_SHA%"=="%GITHUB_SHA%" exit /b 1
          node --check app\src\main\assets\editor.js
          if errorlevel 1 exit /b 1
          node tests\gesture_history_undo_redo.js
          if errorlevel 1 exit /b 1
