name: Zamerovac - TEMP trusted HOME offline release safety tests (NO APK)
# Short-lived Windows QA on owner-controlled branch; never PR/forks.
# No Gradle, no release, no real token, no cloud-hosted runner.
on:
  push:
    branches: [fix/home-release-safety-preflight-20261108]
    paths:
      - '.github/workflows/home-release-safety-offline-temporary.yml'

permissions:
  contents: read

concurrency:
  group: zamerovac-temp-home-release-safety
  cancel-in-progress: false

jobs:
  trusted-release-safety:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/fix/home-release-safety-preflight-20261108' && github.event_name == 'push' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 10
    steps:
      - name: Verifikace duveryhodne vetve a lokalniho Git
        shell: cmd
        run: |
          if not "%GITHUB_REF%"=="refs/heads/fix/home-release-safety-preflight-20261108" exit /b 1
          if not "%GITHUB_ACTOR%"=="zaplikj30-ui" exit /b 1
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
      - name: Checkout exact owner-controlled commit, no saved credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Assert actual checked-out SHA
        shell: cmd
        run: |
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if not defined ACTUAL_SHA exit /b 1
          if /I not "%ACTUAL_SHA%"=="%GITHUB_SHA%" exit /b 1
          echo VERIFIED_RELEASE_QA_SOURCE_SHA=%ACTUAL_SHA%
      - name: Offline 10 Python preflight negative regressions
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\Python313\python.exe" exit /b 1
          "C:\actions-runner\tools\Python313\python.exe" -m unittest discover -s tests -p "test_home_qa_version_preflight.py" -v
          if errorlevel 1 exit /b 1
      - name: Offline 7 Python authenticated upload negative regressions
        shell: cmd
        run: |
          "C:\actions-runner\tools\Python313\python.exe" -m unittest discover -s tests -p "test_home_release_publish_url_security.py" -v
          if errorlevel 1 exit /b 1
          echo PASS 17/17 offline release security tests - no APK, no cloud, no GitHub API
