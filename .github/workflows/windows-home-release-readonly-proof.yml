name: Zamerovac - domaci read-only release asset a monotonic code proof
on:
  push:
    branches: [infra/windows-self-hosted-qa-20261108]
    paths:
      - '.github/workflows/windows-home-release-readonly-proof.yml'
permissions:
  contents: read
jobs:
  release-readonly:
    if: github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui'
    name: Validate most recent published APK, no build/no API writes
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 10
    env:
      ANDROID_HOME: 'C:\actions-runner\tools\AndroidSdk'
      PYTHONUTF8: '1'
    steps:
      - name: Trusted MinGit available before checkout
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
      - name: Only immutable main snapshot before changing anything
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 4953d66b2d32104916b0e6050e87a878613d376a
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Java 17 for apksigner on home PC
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Read GitHub release metadata and last APK from the real API, verify signer and code
        shell: 'C:\actions-runner\tools\Python313\python.exe {0}'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import urllib.request

          expected_sha = "4953d66b2d32104916b0e6050e87a878613d376a"
          actual_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual_sha != expected_sha or os.environ.get("USERNAME", "").lower() != "zamerovacqa":
              sys.exit("STOP: not trusted main snapshot/runner")
          token = os.environ["GH_TOKEN"]
          url = "https://api.github.com/repos/zaplikj30-ui/Zamerovac-android"
          def fetch(path, accept="application/vnd.github+json"):
              headers = {"Authorization": "Bearer " + token,
                         "Accept": accept,
                         "User-Agent": "Zamerovac-readonly-proof",
                         "X-GitHub-Api-Version": "2022-11-28"}
              req = urllib.request.Request(url + path, headers=headers)
              with urllib.request.urlopen(req, timeout=90) as response:
                  return response.read()
          releases = json.loads(fetch("/releases?per_page=50"))
          current = next((x for x in releases if x.get("tag_name", "").startswith("test-v")
                          and not x.get("draft") and x.get("published_at")), None)
          if not current:
              sys.exit("STOP: no published test release")
          assets = [x for x in current.get("assets", []) if x.get("name", "").endswith(".apk")]
          if len(assets) != 1:
              sys.exit("STOP: expected one previous APK")
          apk = Path(os.environ["RUNNER_TEMP"]) / "zamerovac-previous-release-readonly.apk"
          sdk = Path(os.environ["ANDROID_HOME"]) / "build-tools" / "34.0.0"
          try:
              payload = fetch("/releases/assets/" + str(assets[0]["id"]),
                              accept="application/octet-stream")
              print("Asset HTTP bytes:", len(payload), "APK ZIP header:", payload[:4] == b"PK\x03\x04")
              if not payload.startswith(b"PK\x03\x04"):
                  sys.exit("STOP: release asset is not APK bytes")
              apk.write_bytes(payload)
              info = subprocess.run([str(sdk / "aapt.exe"), "dump", "badging", str(apk)],
                                    capture_output=True, text=True, check=True).stdout
              sign = subprocess.run([str(sdk / "apksigner.bat"), "verify", "--min-sdk-version",
                                     "26", "--print-certs", str(apk)], capture_output=True,
                                    text=True, check=True).stdout.lower()
              m = re.search(r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'",info,re.M)
              if not m or m.group(1) != "cz.zamerovac.app.preview":
                  sys.exit("STOP: published APK package mismatch")
              if "c828c96739e554e8da4f5851913356134f1359a98d5013772ad5587e74a2d229" not in sign:
                  sys.exit("STOP: published APK signing SHA256 mismatch")
              prior_code = int(m.group(2))
              if prior_code < 1154:
                  sys.exit("STOP: published code regressed")
              next_code = prior_code + 1
              if next_code > 2147483647:
                  sys.exit("STOP: version code overflow")
              print("PASS: most recent test release:", current["tag_name"],
                    "previous_code:", prior_code, "calculated_next_code:", next_code,
                    "package:", m.group(1), "certificate consistent")
              print("PASS: read-only API and exact previous APK download; no new APK built or published")
          finally:
              apk.unlink(missing_ok=True)
