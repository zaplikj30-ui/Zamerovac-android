name: Zamerovac - temporary integrated B13 home safety quick check
on:
  push:
    branches: [integration/b12-b13-safe-home-20261108]
    paths:
      - '.github/workflows/windows-integrated-qa-temporary.yml'
permissions:
  contents: read
jobs:
  integrated-home-quick:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/integration/b12-b13-safe-home-20261108' && github.event_name == 'push' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 12
    steps:
      - name: Use trusted MinGit
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Quick integration and release security regressions
        shell: cmd
        run: |
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if not defined ACTUAL_SHA exit /b 1
          if /I not "%ACTUAL_SHA%"=="%GITHUB_SHA%" exit /b 1
          echo VERIFIED_COMBINED_SOURCE_SHA=%ACTUAL_SHA%
          if not exist "C:\actions-runner\tools\Python313\python.exe" exit /b 1
          echo C:\actions-runner\tools\Python313>>"%GITHUB_PATH%"
          node --check app\src\main\assets\editor.js
          if errorlevel 1 exit /b 1
          node tests\gesture_history_undo_redo.js
          if errorlevel 1 exit /b 1
          node tools\local-qa.cjs --quick
          if errorlevel 1 exit /b 1
          "C:\actions-runner\tools\Python313\python.exe" -m unittest discover -s tests -p "test_home_release_asset_redirect.py" -v
          if errorlevel 1 exit /b 1
          "C:\actions-runner\tools\Python313\python.exe" -m unittest discover -s tests -p "test_ci_cloud_release_gate.py" -v
          if errorlevel 1 exit /b 1
          echo PASS integrated quick and both release guards, NO CLOUD, NO APK
