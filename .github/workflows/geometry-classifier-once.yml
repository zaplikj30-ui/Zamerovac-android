name: "#221: krátký Node + JVM test klasifikátoru"
# Owner GO: 2026-11-21 'Tak dělej, na co čekáš?' Short targeted tests only.
# Run ONLY when this new one-shot workflow file is committed to its QA branch.
on:
  push:
    branches: [qa/221-geometry-classifier-once]
    paths: [.github/workflows/geometry-classifier-once.yml]
permissions:
  contents: read
concurrency:
  group: z221-classifier-once
  cancel-in-progress: true
jobs:
  classifier:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.ref == 'refs/heads/qa/221-geometry-classifier-once' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact product SHA from draft PR #235
        uses: actions/checkout@v4
        with:
          ref: f540bd31933e77b60b31e0ed13832b9f13e6549a
          persist-credentials: false
      - name: Verify immutable source SHA
        run: |
          test "$(git rev-parse HEAD)" = "f540bd31933e77b60b31e0ed13832b9f13e6549a"
          echo "Product SHA: $(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real production JS editor commit -> golden fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/geometry_classifier_editor_roundtrip.js
          timeout --signal=TERM --kill-after=5s 45s node tests/geometry_classifier_editor_roundtrip.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true
      - name: ONLY GeometrySaveClassifierTest (hard six-minute cap)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 6m gradle --no-daemon --console=plain \
            :app:testPreviewUnitTest --tests 'cz.zamerovac.app.GeometrySaveClassifierTest' \
            -PdriveRequireConfigured=false
      - name: Save exact target-class JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z221-geometry-classifier-targeted-junit
          path: app/build/test-results/testPreviewUnitTest/
          if-no-files-found: ignore
          retention-days: 7
