name: Zaměřovač - TEMP B16 cílená domácí JVM regrese bez APK
# One-shot owner-controlled branch; fixed source SHA, no pull_request/fork or cloud runner.
on:
  push:
    branches: [qa/b16-native-0d01fdb-20261109]
    paths:
      - '.github/workflows/b16-native-oneoff-20261109.yml'
permissions:
  contents: read
concurrency:
  group: zamerovac-b16-native-0d01fdb-oneoff
  cancel-in-progress: false
jobs:
  targeted-native:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/qa/b16-native-0d01fdb-20261109' && github.event_name == 'push' }}
    name: Windows QA WSL2 - compile + focused Robolectric on pinned PR79 SHA
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 45
    env:
      CI: '1'
      TESTED_SHA: '6d6721aae77cad8457e0e72ed0d25ad53d35478d'
    steps:
      - name: Verify owner-controlled branch and unprivileged Windows service
        shell: cmd
        run: |
          if /I not "%USERNAME%"=="ZamerovacQA" exit /b 1
          if not "%GITHUB_REF%"=="refs/heads/qa/b16-native-0d01fdb-20261109" exit /b 1
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          if not exist "C:\actions-runner\tools\Python313\python.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
          echo PASS owner branch and local tooling
      - name: Read-only source checkout pinned to reviewed immutable PR79 SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 6d6721aae77cad8457e0e72ed0d25ad53d35478d
          path: b16-source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Compile Java and run four focused Robolectric classes in capped WSL2
        shell: 'C:\actions-runner\tools\Python313\python.exe {0}'
        run: |
          import os, subprocess
          from pathlib import Path
          expected = os.environ["TESTED_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "zaplikj30-ui/Zamerovac-android" or os.environ.get("USERNAME", "").lower() != "zamerovacqa":
              raise SystemExit("STOP untrusted account/repository")
          source = str(Path(os.environ["GITHUB_WORKSPACE"]) / "b16-source")
          reports = str(Path(os.environ["GITHUB_WORKSPACE"]) / "b16-junit-reports")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=source, text=True).strip()
          if actual != expected:
              raise SystemExit("STOP checkout SHA mismatch "+actual)
          print("TESTED_SOURCE_SHA="+actual,flush=True)
          linux = r"""
          set -Eeuo pipefail
          export CI=1 LC_ALL=C.UTF-8 ANDROID_HOME=/opt/android-sdk ANDROID_SDK_ROOT=/opt/android-sdk
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 GRADLE_USER_HOME=/root/.gradle
          source_dir="$(wslpath -u "$1")"
          reports="$(wslpath -u "$2")"
          expected="$3"
          test -f "$source_dir/app/build.gradle"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x /opt/gradle-8.10.2/bin/gradle
          test -x "$JAVA_HOME/bin/java"
          base=/root/zamerovac-qa-commits
          mkdir -p "$base" "$reports"
          destination="$(mktemp -d "$base/b16-targeted-XXXXXXXX")"
          trap 'rc=$?; if [ -d "$destination/app/build/test-results/testPreviewUnitTest" ]; then cp -a "$destination/app/build/test-results/testPreviewUnitTest" "$reports/"; fi; rm -rf "$destination"; exit "$rc"' EXIT
          cp -a "$source_dir/." "$destination/"
          cd "$destination"
          actual="$(git rev-parse HEAD)"
          echo "WSL_TESTED_SOURCE_SHA=$actual"
          test "$actual" = "$expected"
          gradle=/opt/gradle-8.10.2/bin/gradle
          common=(--offline --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m" -PdriveRequireConfigured=true --console=plain)
          echo "PHASE_1_JAVAC compilePreviewJavaWithJavac"
          "$gradle" "${common[@]}" :app:verifyDriveRegistration :app:compilePreviewJavaWithJavac
          echo "PASS PHASE_1_JAVAC"
          echo "PHASE_2_TESTS two original RED TLS and three new first-sync/registry regressions"
          set +e
          "$gradle" "${common[@]}" :app:testPreviewUnitTest \
            --tests cz.zamerovac.app.PeerTransferTest.firstSyncIntoCleanReceiverKeepsExactPhotoAndNoDuplicateOnRetry \
            --tests cz.zamerovac.app.PeerTransferTest.interruptedFirstPhotoTransferKeepsCleanBaselineAndResumesSafely \
            --tests cz.zamerovac.app.PeerTransferTest.receiverFailureBeforeFirstPhotoBaselineIsNotDatabaseLoss \
            --tests cz.zamerovac.app.DatabaseInstallEvidenceTest.approvedPairingWithoutAnyProjectCanInitializeButNeverResetAfterFirstSave \
            --tests cz.zamerovac.app.DatabaseInstallEvidenceTest.unmarkedLegacyPairingRemainsFailClosedWithoutPrimary
          test_rc=$?
          set -e
          python3 - <<'PY_XML'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          directory=Path("app/build/test-results/testPreviewUnitTest")
          files=sorted(directory.glob("TEST-*.xml"))
          stats={k:0 for k in ("tests","failures","errors","skipped")}
          for p in files:
              root=ET.parse(p).getroot()
              for k in stats: stats[k]+=int(root.attrib.get(k,"0"))
          print("B16_JUNIT_XML_COUNTS:",stats,"XML_FILES:",len(files),flush=True)
          if not files or stats["tests"]==0 or any(stats[k] for k in ("failures","errors","skipped")):
              raise SystemExit("FAIL or SKIP: check exact JUnit XML and Gradle log")
          PY_XML
          test "$test_rc" -eq 0
          echo "PASS TARGETED ROBOLECTRIC - exact SHA, no APK"
          """
          cmd = ["wsl.exe", "--distribution", "Zamerovac-Ubuntu-QA", "--user", "root",
                 "--exec", "/bin/bash", "-lc", linux, "_", source, reports, expected]
          print("Home WSL2 capped 4 GB RAM / 2 CPU, one Gradle worker, offline dependencies; no APK",flush=True)
          result = subprocess.run(cmd, stdin=subprocess.DEVNULL, check=False)
          if result.returncode:
              raise SystemExit("NATIVE_TEST_EXIT="+str(result.returncode))
      - name: Preserve only native JUnit evidence, never APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b16-native-junit-6d6721a
          path: b16-junit-reports/
          if-no-files-found: ignore
          retention-days: 7
