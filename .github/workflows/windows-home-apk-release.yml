name: Zamerovac - schvalene vydani APK z domaciho Windows PC

# Deployment is intentionally MANUAL, not part of push/PR/build-proof QA.
# No release/asset is created unless owner explicitly approves and exact main SHA QA passed.
# Runs on the home Windows service, never GitHub-hosted infrastructure.
on:
  workflow_dispatch:
    inputs:
      qa_run_id:
        description: 'ID dokončeného domácího Windows QA běhu se 4 PASS jobs na STEJNÉM main SHA'
        type: string
        required: true
      publish_release:
        description: 'Výslovně schvaluji vydání jediné nové testovací APK na GitHubu'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: zamerovac-approved-home-apk-publish
  cancel-in-progress: false

jobs:
  home-preview-release:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true && inputs.qa_run_id != '' }}
    name: Home Windows - signed preview APK then explicit GitHub Release
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 50
    env:
      CI: '1'
      PYTHONUTF8: '1'
      ANDROID_HOME: 'C:\actions-runner\tools\AndroidSdk'
      ANDROID_SDK_ROOT: 'C:\actions-runner\tools\AndroidSdk'
      QA_RUN_ID: ${{ inputs.qa_run_id }}
    steps:
      - name: Trusted pinned Git for real checked-out main SHA
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"

      - name: Immutable checkout, credentials not saved
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify actual production release source SHA is this main event
        shell: cmd
        run: |
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if not defined ACTUAL_SHA exit /b 1
          if /I not "%ACTUAL_SHA%"=="%GITHUB_SHA%" exit /b 1
          echo RELEASE_SOURCE_SHA=%ACTUAL_SHA%

      - name: Java 17 from pinned setup-java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preverified local Gradle 8.10.2 - no runtime download
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\Gradle-8.10.2\bin\gradle.bat" exit /b 1
          echo C:\actions-runner\tools\Gradle-8.10.2\bin>>"%GITHUB_PATH%"
          call "C:\actions-runner\tools\Gradle-8.10.2\bin\gradle.bat" --version
          if errorlevel 1 exit /b 1

      - name: Validate real home QA run and previous released APK versionCode and signer
        shell: 'C:\actions-runner\tools\Python313\python.exe {0}'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = "zaplikj30-ui/Zamerovac-android"
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["QA_RUN_ID"]
          if os.environ.get("USERNAME", "").lower() != "zamerovacqa":
              sys.exit("STOP: release must use isolated QA account")
          if not re.fullmatch(r"[0-9]{8,15}", run_id):
              sys.exit("STOP: invalid verified home QA run ID")
          sdk = Path(os.environ["ANDROID_HOME"])
          aapt = sdk / "build-tools" / "34.0.0" / "aapt.exe"
          signer = sdk / "build-tools" / "34.0.0" / "apksigner.bat"
          if not aapt.is_file() or not signer.is_file():
              sys.exit("STOP: pinned Android SDK tools unavailable")

          class VerifiedReleaseAssetRedirect(urllib.request.HTTPRedirectHandler):
              """Never forward the GitHub API bearer token to an asset CDN."""
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is None:
                      return None
                  old = urllib.parse.urlsplit(req.full_url)
                  new = urllib.parse.urlsplit(redirected.full_url)
                  if new.scheme != "https":
                      raise ValueError("STOP: insecure GitHub release asset redirect")
                  if (new.hostname, new.port) != (old.hostname, old.port):
                      sensitive = {"authorization", "proxy-authorization",
                                   "cookie", "x-github-api-version"}
                      for key in tuple(redirected.headers):
                          if key.lower() in sensitive:
                              redirected.remove_header(key)
                  return redirected

          release_asset_opener = urllib.request.build_opener(VerifiedReleaseAssetRedirect())

          def request(url, method="GET", payload=None, accept="application/vnd.github+json"):
              target = urllib.parse.urlsplit(url)
              if (target.scheme != "https" or target.hostname != "api.github.com"
                      or not target.path.startswith("/repos/zaplikj30-ui/Zamerovac-android/")):
                  sys.exit("STOP: unexpected GitHub API asset URL")
              headers = {
                  "Authorization": "Bearer " + token,
                  "Accept": accept,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Zamerovac-home-release"}
              req = urllib.request.Request(url, data=payload, method=method, headers=headers)
              with release_asset_opener.open(req, timeout=80) as response:
                  return response.read()

          api = "https://api.github.com/repos/" + repo
          def get_json(path):
              return json.loads(request(api + path))
          qa = get_json("/actions/runs/" + run_id)
          if any([
              qa.get("status") != "completed", qa.get("conclusion") != "success",
              qa.get("head_sha") != sha, qa.get("head_branch") != "main",
              qa.get("path") != ".github/workflows/windows-self-hosted-qa.yml",
              qa.get("event") not in ("push", "workflow_dispatch"),
          ]):
              sys.exit("STOP: home QA did not PASS for this EXACT main source commit")
          jobs = get_json("/actions/runs/" + run_id + "/jobs?per_page=100").get("jobs", [])
          required = (
              "Windows 11 - Node + Python lokální QA",
              "Windows Chromium - kreslení a viditelné pixely",
              "Home WSL2 native Java + 265 Robolectric + PDF",
              "Windows technicke sestaveni APK BEZ vydani"
          )
          for name in required:
              found = [j for j in jobs if j.get("name") == name]
              if len(found) != 1 or found[0].get("conclusion") != "success":
                  sys.exit("STOP: required home QA job not PASS: " + name)
          print("PASS: exact source SHA, quick, Chromium, 265 native + PDF, technical signed APK smoke")

          result = subprocess.run(["node", "tools/release/versioning.js", "--release"],
                                  capture_output=True, text=True, check=True)
          version = result.stdout.strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              sys.exit("STOP: invalid semantic release version")

          def parse_package(apk):
              p = subprocess.run([str(aapt), "dump", "badging", str(apk)],
                                 capture_output=True, text=True, check=True).stdout
              m = re.search(r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'", p, flags=re.M)
              if not m or m.group(1) != "cz.zamerovac.app.preview":
                  sys.exit("STOP: previous APK has incorrect package")
              signature = subprocess.run([str(signer), "verify", "--min-sdk-version", "26",
                                          "--print-certs", str(apk)], capture_output=True,
                                         text=True, check=True).stdout.lower()
              if "c828c96739e554e8da4f5851913356134f1359a98d5013772ad5587e74a2d229" not in signature:
                  sys.exit("STOP: previous signing certificate differs")
              return int(m.group(2)), m.group(3)

          try:
              get_json("/releases/tags/" + urllib.parse.quote("test-v" + version))
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
          else:
              sys.exit("STOP: release already exists and must NEVER be replaced")

          releases = get_json("/releases?per_page=100")
          previous = next((x for x in releases if x.get("tag_name", "").startswith("test-v")
                           and not x.get("draft") and x.get("published_at")), None)
          if not previous:
              sys.exit("STOP: no previous published preview release")
          old_semver = previous["tag_name"][len("test-v"):]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", old_semver):
              sys.exit("STOP: previous release semver invalid")
          if tuple(map(int, version.split("."))) <= tuple(map(int, old_semver.split("."))):
              sys.exit("STOP: release version must increase")
          assets = [x for x in previous.get("assets", []) if x.get("name", "").endswith(".apk")]
          if len(assets) != 1:
              sys.exit("STOP: expected exactly one APK in previous release")
          archive = Path(os.environ["RUNNER_TEMP"]) / "zamerovac-previous-preview.apk"
          try:
              payload = request(assets[0]["url"], accept="application/octet-stream")
              if not payload.startswith(b"PK\x03\x04"):
                  sys.exit("STOP: previous release asset download is not an APK")
              archive.write_bytes(payload)
              prior_code, prior_name = parse_package(archive)
          finally:
              archive.unlink(missing_ok=True)
          new_code = prior_code + 1
          if not 1000 < new_code < 2147483647:
              sys.exit("STOP: Android versionCode out of supported range")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"APP_VERSION={version}\n")
              output.write(f"RELEASE_VERSION_CODE={new_code}\n")
              output.write(f"VERSION_WORKFLOW_OFFSET={new_code - 1000}\n")
          print(f"PASS: previous released package/signer, previous_code={prior_code}, new_code={new_code}; release version={version}")

      - name: Build one Android preview package on local Windows ONLY
        shell: cmd
        run: |
          rem Keep Gradle's existing 1000 + GITHUB_RUN_NUMBER versionCode rule,
          rem but bind it to the VERIFIED previous released APK code +1.
          set "GITHUB_RUN_NUMBER=%VERSION_WORKFLOW_OFFSET%"
          call gradle.bat --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=-Xmx1536m" :app:verifyDriveRegistration :app:assemblePreview -PdriveRequireConfigured=true
          if errorlevel 1 exit /b 1
          if not exist "app\build\outputs\apk\preview\app-preview.apk" exit /b 1

      - name: Verify FINAL APK signer, package, exact versionCode/versionName
        shell: 'C:\actions-runner\tools\Python313\python.exe {0}'
        run: |
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess

          sdk = Path(os.environ["ANDROID_HOME"]) / "build-tools" / "34.0.0"
          apk = Path("app/build/outputs/apk/preview/app-preview.apk")
          if not apk.is_file() or not apk.stat().st_size:
              raise SystemExit("STOP: missing signed preview APK")
          sign = subprocess.run([str(sdk / "apksigner.bat"), "verify",
                                "--min-sdk-version", "26", "--print-certs", str(apk)],
                                capture_output=True, text=True, check=True).stdout.lower()
          required = "c828c96739e554e8da4f5851913356134f1359a98d5013772ad5587e74a2d229"
          if required not in sign:
              raise SystemExit("STOP: release signer mismatch")
          badging = subprocess.run([str(sdk / "aapt.exe"), "dump", "badging", str(apk)],
                                   capture_output=True, text=True, check=True).stdout
          m = re.search(r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'",badging,re.M)
          if not m or m.groups() != ("cz.zamerovac.app.preview", os.environ["RELEASE_VERSION_CODE"],
                                      os.environ["APP_VERSION"] + "-test"):
              raise SystemExit("STOP: release package/code/version mismatch")
          print("PASS: signer SHA256, package, versionCode strictly higher, versionName; APK SHA256:",
                hashlib.sha256(apk.read_bytes()).hexdigest(), flush=True)

      - name: Publish only explicitly approved RELEASE after passing every gate
        shell: 'C:\actions-runner\tools\Python313\python.exe {0}'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.parse
          import urllib.request

          version = os.environ["APP_VERSION"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          repo = "zaplikj30-ui/Zamerovac-android"
          tag = "test-v" + version
          apk = Path("app/build/outputs/apk/preview/app-preview.apk")
          data = apk.read_bytes()
          api = "https://api.github.com/repos/" + repo
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Zamerovac-home-release"}

          def api_call(url, method="GET", data=None, mime=None):
              h = dict(headers)
              if mime:
                  h["Content-Type"] = mime
              req = urllib.request.Request(url, data=data, method=method, headers=h)
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.loads(response.read())

          # Check again immediately before mutation: never replace existing release.
          try:
              api_call(api + "/releases/tags/" + urllib.parse.quote(tag))
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
          else:
              raise SystemExit("STOP: release appeared during build, refusing to overwrite")

          draft = api_call(api + "/releases", "POST",
                           json.dumps({"tag_name": tag, "target_commitish": sha,
                                       "name": "Zaměřovač " + version,
                                       "draft": True, "prerelease": True,
                                       "generate_release_notes": False,
                                       "body": "Jedna souhrnná testovací APK po schválené domácí regresi. Instalovat přes stávající verzi bez mazání dat. Praktické Samsung, S Pen a Bosch ověření je samostatný krok."}).encode(),
                           "application/json")
          if not draft.get("draft") or draft.get("tag_name") != tag:
              raise SystemExit("STOP: draft release not confirmed")
          upload_url = draft["upload_url"].split("{", 1)[0]
          filename = "Zamerovac-v" + version + ".apk"
          upload = api_call(upload_url + "?name=" + urllib.parse.quote(filename),
                            "POST", data, "application/vnd.android.package-archive")
          if upload.get("name") != filename or upload.get("size") != len(data):
              raise SystemExit("STOP: uploaded asset verification failed; release remains DRAFT")
          published = api_call(api + "/releases/" + str(draft["id"]), "PATCH",
                               json.dumps({"draft": False, "prerelease": True}).encode(),
                               "application/json")
          if published.get("draft") or published.get("tag_name") != tag:
              raise SystemExit("STOP: release publication confirmation failed")
          print("PUBLISHED:", published.get("html_url"))
          print("PUBLISHED_SHA256:", hashlib.sha256(data).hexdigest())
          print("SOURCE_SHA:", sha)
          print("VERIFIED_QA_RUN_ID:", os.environ["QA_RUN_ID"])

      - name: Clean only local signed APK after confirmation or any failure
        if: always()
        shell: cmd
        run: |
          if exist "app\build\outputs\apk\preview\app-preview.apk" del /f /q "app\build\outputs\apk\preview\app-preview.apk"
          if exist "%RUNNER_TEMP%\zamerovac-previous-preview.apk" del /f /q "%RUNNER_TEMP%\zamerovac-previous-preview.apk"
          echo Local build removed. GitHub release exists ONLY if explicit publish step passed.
