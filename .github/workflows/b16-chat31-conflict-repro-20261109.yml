name: Zaměřovač - TEMP Chat31 B16 legacy conflict targeted Chromium (no APK)
on:
  push:
    branches: [qa/chat31-b16-conflict-repro-20261109]
    paths: ['.github/workflows/b16-chat31-conflict-repro-20261109.yml']
permissions:
  contents: read
concurrency:
  group: chat31-b16-legacy-conflict-oneoff
  cancel-in-progress: false
jobs:
  test:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/qa/chat31-b16-conflict-repro-20261109' && github.event_name == 'push' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 30
    env:
      TESTED_SHA: '83e770d2e8975e8e6c98cb3cae72f4ef04096380'
      PLAYWRIGHT_BROWSERS_PATH: 'C:\actions-runner\tools\ms-playwright'
    steps:
      - name: Trusted owner Windows runner
        shell: cmd
        run: |
          if /I not "%USERNAME%"=="ZamerovacQA" exit /b 1
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
      - name: Read-only pinned application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 83e770d2e8975e8e6c98cb3cae72f4ef04096380
          path: b16-source
          persist-credentials: false
          submodules: false
      - name: Execute targeted real Chromium test only
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\b16-source"
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if /I not "%ACTUAL_SHA%"=="%TESTED_SHA%" exit /b 1
          echo TESTED_CHROMIUM_SOURCE_SHA=%ACTUAL_SHA%
          set "CI=1"
          set "LOCALAPPDATA=%GITHUB_WORKSPACE%\browser-evidence"
          node tools\local-browser-qa.cjs --self-test
          if errorlevel 1 exit /b 1
          call npm.cmd install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          if errorlevel 1 exit /b 1
          call npx.cmd --no-install playwright install chromium
          if errorlevel 1 exit /b 1
          node tools\local-browser-qa.cjs --legacy-conflict
          if errorlevel 1 exit /b 1
          echo PASS legacy conflict persistence - no APK
      - name: Preserve Chromium trace and exact test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat31-legacy-conflict-green-83e770d
          path: browser-evidence/Zamerovac-QA/browser/
          if-no-files-found: ignore
          retention-days: 7
