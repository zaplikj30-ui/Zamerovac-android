name: Sestavit a vydat Zaměřovač (testovací verze)
# STAGED ONLY. Emergency cloud fallback, explicit owner approval only; NO auto cloud build.
# Publishing needs explicit owner dispatch with publish_release=true.
# This staging branch is NOT main. Do not merge until paid automatic triggers are safely gated.
on:
  workflow_dispatch:
    inputs:
      cloud_run_approved:
        description: 'Placený cloud jen s výslovným souhlasem vlastníka (limit 12 USD/měsíc)'
        required: true
        type: boolean
        default: false
      publish_release:
        description: 'Explicitni souhlas se zverejnenim (vyzaduje predepsane kontroly)'
        required: true
        type: boolean
        default: false
concurrency:
  group: zamerovac-test-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/main' && inputs.cloud_run_approved == true && inputs.publish_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: PŘED sestavením ověřit poslední vydanou APK, podpis a vyšší versionCode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_VERSION="$(node tools/release/versioning.js --release)"
          if gh release view "test-v${APP_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "STOP: vydání této verze již existuje." >&2
            exit 1
          fi
          PREVIOUS_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          if [[ ! "$PREVIOUS_TAG" =~ ^test-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "STOP: nelze bezpečně určit poslední testovací release." >&2
            exit 1
          fi
          node - "$APP_VERSION" "${PREVIOUS_TAG#test-v}" <<'NODE'
          const [next, previous] = process.argv.slice(2).map(s => s.split('.').map(Number));
          if (![next, previous].every(v => v.length === 3 && v.every(Number.isSafeInteger))) process.exit(1);
          for (let i = 0; i < 3; i++) {
            if (next[i] !== previous[i]) process.exit(next[i] > previous[i] ? 0 : 1);
          }
          process.exit(1);
          NODE
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous
          mapfile -t MATCHES < <(find previous -maxdepth 1 -type f -name '*.apk')
          if (( ${#MATCHES[@]} != 1 )); then
            echo "STOP: poslední vydání nemá právě jednu APK." >&2
            exit 1
          fi
          PREVIOUS_APK="${MATCHES[0]}"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT" && test -x "$SIGNER"
          PREVIOUS_SIGN="$("$SIGNER" verify --min-sdk-version 26 --print-certs "$PREVIOUS_APK")"
          printf '%s\n' "$PREVIOUS_SIGN" | grep -Fqi 'c828c96739e554e8da4f5851913356134f1359a98d5013772ad5587e74a2d229'
          BADGING="$("$AAPT" dump badging "$PREVIOUS_APK")"
          PREVIOUS_INFO="${BADGING%%$'\n'*}"
          printf '%s\n' "$PREVIOUS_INFO" | grep -Fq "name='cz.zamerovac.app.preview'"
          PREVIOUS_CODE="$(printf '%s\n' "$PREVIOUS_INFO" | grep -oE "versionCode='[0-9]+'" | cut -d "'" -f 2)"
          if [[ ! "$PREVIOUS_CODE" =~ ^[0-9]+$ ]] || (( PREVIOUS_CODE < 1001 || PREVIOUS_CODE >= 2147483646 )); then
            echo "STOP: neplatné či nepoužitelné číslo poslední vydané APK." >&2
            exit 1
          fi
          NEW_CODE=$((PREVIOUS_CODE + 1))
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION_CODE=$PREVIOUS_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$NEW_CODE" >> "$GITHUB_ENV"
          echo "VERSION_WORKFLOW_OFFSET=$((NEW_CODE - 1000))" >> "$GITHUB_ENV"
          echo "PASS: vydaná APK code=$PREVIOUS_CODE; nový code=$NEW_CODE, totožný podpis."
      - name: Kontrola JavaScriptu a struktury projektu
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/editor.js
          node --check app/src/main/assets/upgrade.js
          node --check app/src/main/assets/rich-notes.js
          node --check app/src/main/assets/sketch.js
          node --check app/src/main/assets/address-correction.js
          node --check app/src/main/assets/inset-workspace.js
          node tests/inset_workspace_interaction.js
          node tests/note_leader_interaction.js
          node --check app/src/main/assets/editor-extra-toolbar.js
          node --check app/src/main/assets/laser-autofill.js
          node --check app/src/main/assets/feedback-reports.js
          node tests/feedback_report_structure.js
          node tests/laser_tap_interaction.js
          node tests/laser_auto_interaction.js
          node tests/extra_toolbar_interaction.js
          python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Sestavit testovací variantu aplikace Zaměřovač
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_* nejde přepsat přes GITHUB_ENV; pouze pro subprocess Gradlu.
          export GITHUB_RUN_NUMBER="$VERSION_WORKFLOW_OFFSET"
          gradle --no-daemon :app:verifyDriveRegistration assemblePreview -PdriveRequireConfigured=true
      - name: Ověřit podpis a jednoznačnou verzi testovací APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/preview/app-preview.apk
          SIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ ! -f "$APK" ] || [ ! -x "$SIGNER" ]; then
            echo "Chybí testovací APK nebo nástroj apksigner." >&2
            exit 1
          fi
          VERIFY_OUTPUT="$("$SIGNER" verify --min-sdk-version 26 --print-certs "$APK")"
          echo "$VERIFY_OUTPUT"
          # Pin the same development signing certificate across all app updates.
          echo "$VERIFY_OUTPUT" | grep -qi 'c828c96739e554e8da4f5851913356134f1359a98d5013772ad5587e74a2d229'
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          PACKAGE_INFO="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$PACKAGE_INFO"
          echo "$PACKAGE_INFO" | grep -q "name='cz.zamerovac.app.preview'"
          echo "$PACKAGE_INFO" | grep -q "versionCode='${RELEASE_VERSION_CODE}'"
          echo "$PACKAGE_INFO" | grep -q "versionName='${APP_VERSION}-test'"
          if (( RELEASE_VERSION_CODE <= PREVIOUS_VERSION_CODE )); then
            echo "STOP: nevzestupný versionCode." >&2
            exit 1
          fi
          CURRENT_PREVIOUS_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          if [ "$CURRENT_PREVIOUS_TAG" != "$PREVIOUS_TAG" ]; then
            echo "STOP: během sestavení se změnilo poslední vydání, nutná nová kontrola." >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/Zamerovac-v${APP_VERSION}.apk"
          sha256sum dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zamerovac-testovaci-APK
          path: dist/*.apk
          retention-days: 30
      - name: Vydat APK přímo do GitHub Releases (bez ZIP)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="test-v${APP_VERSION}"
          FILE="dist/Zamerovac-v${APP_VERSION}.apk"
          for attempt in 1 2 3; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Vydání této verze již existuje; nelze jej přepsat." >&2
              exit 1
            fi
            if gh release create "$TAG" "$FILE" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Zaměřovač ${APP_VERSION}" \
                --notes "Testovací Zaměřovač ${APP_VERSION}. Aktuální změny a opravy popisuje historie změn přímo v aplikaci. Jde o aktualizaci stávající testovací aplikace, nikoliv o novou aplikaci. Fyzické ověření po instalaci je samostatný krok." \
                --latest; then
              exit 0
            fi
            echo "GitHub odmítl vydání, pokus $attempt ze 3." >&2
            sleep $((attempt * 5))
          done
          exit 1
