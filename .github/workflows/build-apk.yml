name: Sestavit a vydat Zaměřovač (testovací verze)
# APK spustit jen rucne nebo zmenou vyhrazeneho spousteciho souboru.
# Obycejne commity na main nesestavuji aplikaci.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/apk-build-request.txt'
concurrency:
  group: zamerovac-test-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Kontrola JavaScriptu a struktury projektu
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/editor.js
          node --check app/src/main/assets/upgrade.js
          node --check app/src/main/assets/rich-notes.js
          node --check app/src/main/assets/sketch.js
          node --check app/src/main/assets/address-correction.js
          node --check app/src/main/assets/inset-workspace.js
          node tests/inset_workspace_interaction.js
          node tests/note_leader_interaction.js
          node --check app/src/main/assets/editor-extra-toolbar.js
          node --check app/src/main/assets/laser-autofill.js
          node --check app/src/main/assets/feedback-reports.js
          node tests/feedback_report_structure.js
          node tests/laser_tap_interaction.js
          node tests/laser_auto_interaction.js
          node tests/extra_toolbar_interaction.js
          python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Před vydáním ověřit verzi a nepřepisovat existující APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_VERSION="$(node tools/release/versioning.js --release)"
          if gh release view "test-v${APP_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Vydání této verze již existuje a nesmí být přepsáno." >&2
            exit 1
          fi
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
      - name: Sestavit testovací variantu aplikace Zaměřovač
        run: gradle --no-daemon :app:verifyDriveRegistration assemblePreview -PdriveRequireConfigured=true
      - name: Ověřit podpis a jednoznačnou verzi testovací APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/preview/app-preview.apk
          SIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ ! -f "$APK" ] || [ ! -x "$SIGNER" ]; then
            echo "Chybí testovací APK nebo nástroj apksigner." >&2
            exit 1
          fi
          VERIFY_OUTPUT="$("$SIGNER" verify --min-sdk-version 26 --print-certs "$APK")"
          echo "$VERIFY_OUTPUT"
          # Pin the same development signing certificate across all app updates.
          echo "$VERIFY_OUTPUT" | grep -qi 'c828c96739e554e8da4f5851913356134f1359a98d5013772ad5587e74a2d229'
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          PACKAGE_INFO="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$PACKAGE_INFO"
          echo "$PACKAGE_INFO" | grep -q "name='cz.zamerovac.app.preview'"
          echo "$PACKAGE_INFO" | grep -q "versionCode='$((1000 + GITHUB_RUN_NUMBER))'"
          echo "$PACKAGE_INFO" | grep -q "versionName='${APP_VERSION}-test'"
          # An update must have a strictly higher versionCode and the unchanged signature.
          PREVIOUS_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          test -n "$PREVIOUS_TAG"
          mkdir -p previous dist
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous
          PREVIOUS_APK="$(find previous -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$PREVIOUS_APK"
          PREVIOUS_INFO="$("$AAPT" dump badging "$PREVIOUS_APK" | head -n 1)"
          echo "$PREVIOUS_INFO" | grep -q "name='cz.zamerovac.app.preview'"
          "$SIGNER" verify --min-sdk-version 26 --print-certs "$PREVIOUS_APK" | grep -qi 'c828c96739e554e8da4f5851913356134f1359a98d5013772ad5587e74a2d229'
          PREVIOUS_CODE="$(echo "$PREVIOUS_INFO" | grep -oE "versionCode='[0-9]+'" | grep -oE '[0-9]+')"
          NEW_CODE="$((1000 + GITHUB_RUN_NUMBER))"
          test -n "$PREVIOUS_CODE"
          if (( NEW_CODE <= PREVIOUS_CODE )); then
            echo "Nová APK by nemohla aktualizovat předchozí versionCode." >&2
            exit 1
          fi
          cp "$APK" "dist/Zamerovac-v${APP_VERSION}.apk"
          sha256sum dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zamerovac-testovaci-APK
          path: dist/*.apk
          retention-days: 30
      - name: Vydat APK přímo do GitHub Releases (bez ZIP)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="test-v${APP_VERSION}"
          FILE="dist/Zamerovac-v${APP_VERSION}.apk"
          for attempt in 1 2 3; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Vydání této verze již existuje; nelze jej přepsat." >&2
              exit 1
            fi
            if gh release create "$TAG" "$FILE" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Zaměřovač ${APP_VERSION}" \
                --notes "Testovací Zaměřovač. Nově používá přehledné číslování vydání; funkce z 1.2.153 zůstaly zachovány. Instaluj jako aktualizaci přes stávající testovací verzi bez odinstalování nebo mazání dat. Fyzická akceptace zatím nebyla provedena." \
                --latest; then
              exit 0
            fi
            echo "GitHub odmítl vydání, pokus $attempt ze 3." >&2
            sleep $((attempt * 5))
          done
          exit 1
