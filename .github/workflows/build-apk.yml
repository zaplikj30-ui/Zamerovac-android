name: Sestavit a vydat Zaměřovač TEST
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: release-test-main
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Kontrola JavaScriptu a struktury projektu
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/editor.js
          node --check app/src/main/assets/upgrade.js
          node --check app/src/main/assets/rich-notes.js
          node --check app/src/main/assets/sketch.js
          node --check app/src/main/assets/address-correction.js
          node --check app/src/main/assets/inset-workspace.js
          node tests/inset_workspace_interaction.js
          node tests/note_leader_interaction.js
          node --check app/src/main/assets/editor-extra-toolbar.js
          node --check app/src/main/assets/laser-autofill.js
          node --check app/src/main/assets/feedback-reports.js
          node tests/feedback_report_structure.js
          node tests/laser_tap_interaction.js
          node tests/laser_auto_interaction.js
          node tests/extra_toolbar_interaction.js
          python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Sestavit obě varianty se stejným vývojovým klíčem
        run: gradle --no-daemon assembleDebug assemblePreview
      - name: Ověřit podpis a jednoznačnou verzi testovací APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/preview/app-preview.apk
          SIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ ! -f "$APK" ] || [ ! -x "$SIGNER" ]; then
            echo "Chybí testovací APK nebo nástroj apksigner." >&2
            exit 1
          fi
          VERIFY_OUTPUT="$("$SIGNER" verify --min-sdk-version 26 --print-certs "$APK")"
          echo "$VERIFY_OUTPUT"
          # Pin the same development signing certificate across all app updates.
          echo "$VERIFY_OUTPUT" | grep -qi 'c828c96739e554e8da4f5851913356134f1359a98d5013772ad5587e74a2d229'
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          PACKAGE_INFO="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$PACKAGE_INFO"
          echo "$PACKAGE_INFO" | grep -q "name='cz.zamerovac.app.preview'"
          echo "$PACKAGE_INFO" | grep -q "versionCode='$((1000 + GITHUB_RUN_NUMBER))'"
          mkdir -p dist
          cp "$APK" "dist/Zamerovac-v1.2.${GITHUB_RUN_NUMBER}.apk"
          sha256sum dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zamerovac-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Zamerovac-TEST-APK
          path: dist/*.apk
          retention-days: 30
      - name: Vydat APK přímo do GitHub Releases (bez ZIP)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="test-v1.2.${GITHUB_RUN_NUMBER}"
          FILE="dist/Zamerovac-v1.2.${GITHUB_RUN_NUMBER}.apk"
          for attempt in 1 2 3; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber && \
                 gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest; then
                echo "Vydání bylo aktualizováno."
                exit 0
              fi
            else
              if gh release create "$TAG" "$FILE" \
                  --repo "$GITHUB_REPOSITORY" \
                  --target "$GITHUB_SHA" \
                  --title "Zaměřovač 1.2.${GITHUB_RUN_NUMBER}" \
                  --notes "Testovací verze pro Android. Aktualizuje nainstalovaný Zaměřovač TEST bez smazání dat. Původní Zaměřovač zůstává nedotčený. Otevři APK přímo ze Stažených souborů." \
                  --latest; then
                exit 0
              fi
            fi
            echo "GitHub odmítl vydání, pokus $attempt ze 3." >&2
            sleep $((attempt * 5))
          done
          exit 1
