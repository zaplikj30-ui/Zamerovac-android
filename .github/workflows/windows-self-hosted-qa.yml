name: Zaměřovač - důvěryhodná Windows QA

# Domácí runner: jen důvěryhodný main commit; žádné PR/forky ani testovací infra checkouty.
# Před sloučením odstranen dočasný pevný QA B12 ref i dočasný infra trigger.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/**'
      - 'app/src/main/java/**'
      - 'app/src/main/res/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'config/**'
      - 'gradle/**'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'
      - 'tests/**'
      - 'sync/**'
      - 'tools/**'
      - '.github/workflows/windows-self-hosted-qa.yml'
      - '.github/workflows/windows-home-apk-release.yml'

permissions:
  contents: read

env:
  # Všechny čtyři joby testují přesné SHA události pouze na main.
  # Bez volného target_ref, pull_request ani pevného B12 ref.
  QA_TEST_REF: ${{ github.sha }}

concurrency:
  group: zamerovac-trusted-windows-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-quick:
    # Push na main nebo explicitní ruční spuštění vlastníkem; job-level gate blokuje ostatní branche.
    # ZÁMĚRNĚ žádné pull_request ani pull_request_target.
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    name: Windows 11 - Node + Python lokální QA
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 25
    env:
      CI: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Zakazat spousteni mimo vlastni main
        shell: cmd
        run: |
          if not "%GITHUB_EVENT_NAME%"=="push" if not "%GITHUB_EVENT_NAME%"=="workflow_dispatch" exit /b 1
          if not "%GITHUB_REF%"=="refs/heads/main" exit /b 1
          echo PASS: trusted event and branch

      - name: Git CLI pro skutecny checkout SHA
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"

      - name: Read-only checkout - bez uložených GitHub přihlašovacích údajů
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_TEST_REF }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Dolozit presny commit testovaneho kodu
        shell: cmd
        run: |
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if not defined ACTUAL_SHA exit /b 1
          if /I not "%ACTUAL_SHA%"=="%QA_TEST_REF%" (
            echo FAIL: checkout SHA mismatch
            exit /b 1
          )
          echo TESTED_SOURCE_SHA=%ACTUAL_SHA%

      - name: Python pro testovací službu (jen tento job)
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\Python313\python.exe" (
            echo CHYBI oddeleny Python 3.13 v runneru.
            exit /b 1
          )
          "C:\actions-runner\tools\Python313\python.exe" -c "import sys,unittest;print(sys.version)"
          if errorlevel 1 exit /b 1
          echo C:\actions-runner\tools\Python313>>"%GITHUB_PATH%"

      - name: Kontrola prostředí
        shell: cmd
        run: |
          whoami
          where node
          node --version
          if errorlevel 1 exit /b 1
          where python
          python --version
          if errorlevel 1 exit /b 1

      - name: Kompletní rychlé Node/Python testy - žádná APK
        shell: cmd
        run: |
          node tools\local-qa.cjs --quick
          if errorlevel 1 exit /b 1

  browser-smoke:
    # Domácí runner po rychlé kontrole; jeden fyzický runner serializuje těžké úlohy.
    needs: local-quick
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    name: Windows Chromium - kreslení a viditelné pixely
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 30
    env:
      CI: '1'
      PLAYWRIGHT_BROWSERS_PATH: 'C:\actions-runner\tools\ms-playwright'
    steps:
      # GitHub Desktop neni potreba. Git musime dat do PATH JESTE PRED checkout,
      # aby checkout vytvoril skutečny .git adresar pro E2E rev-parse HEAD.
      # Pouze duveryhodny Git for Windows MinGit + pevny SHA256, bez instalatoru
      # a bez systemovych uprav na domacim 16GB Windows PC.
      - name: Zakazat spousteni mimo vlastni main
        shell: cmd
        run: |
          if not "%GITHUB_EVENT_NAME%"=="push" if not "%GITHUB_EVENT_NAME%"=="workflow_dispatch" exit /b 1
          if not "%GITHUB_REF%"=="refs/heads/main" exit /b 1
          echo PASS: trusted event and branch

      - name: Git CLI pro prohlizecove testy - pripnuty overeny MinGit
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" (
            if not exist "C:\actions-runner\tools\MinGit-2.56.0.4" mkdir "C:\actions-runner\tools\MinGit-2.56.0.4"
            if errorlevel 1 exit /b 1
            curl.exe --fail --silent --show-error --location "https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.4/MinGit-2.56.0.4-64-bit.zip" --output "%RUNNER_TEMP%\zamerovac-MinGit-2.56.0.4.zip"
            if errorlevel 1 exit /b 1
            certutil.exe -hashfile "%RUNNER_TEMP%\zamerovac-MinGit-2.56.0.4.zip" SHA256 | findstr.exe /i /c:"e3bf78351fe777fba47ddee5950082f8a98bb0f02604fdc7ba3ee2cb68ffa877" >nul
            if errorlevel 1 (
              echo CHYBA: SHA256 MinGit nesouhlasi s GitHub release.
              exit /b 1
            )
            tar.exe -xf "%RUNNER_TEMP%\zamerovac-MinGit-2.56.0.4.zip" -C "C:\actions-runner\tools\MinGit-2.56.0.4"
            if errorlevel 1 exit /b 1
          )
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          set "PATH=C:\actions-runner\tools\MinGit-2.56.0.4\cmd;%PATH%"
          git --version
          if errorlevel 1 exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"

      - name: Načíst důvěryhodný testovaný commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_TEST_REF }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Dolozit presny commit testovaneho kodu
        shell: cmd
        run: |
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if not defined ACTUAL_SHA exit /b 1
          if /I not "%ACTUAL_SHA%"=="%QA_TEST_REF%" (
            echo FAIL: checkout SHA mismatch
            exit /b 1
          )
          echo TESTED_SOURCE_SHA=%ACTUAL_SHA%

      - name: Ověřit bezpečnost lokálního HTTP serveru
        shell: cmd
        run: |
          node tools\local-browser-qa.cjs --self-test
          if errorlevel 1 exit /b 1

      - name: Připravit připnutý Playwright a Chromium
        shell: cmd
        run: |
          call npm.cmd install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          if errorlevel 1 exit /b 1
          call npx.cmd --no-install playwright install chromium
          if errorlevel 1 exit /b 1

      - name: Chromium FULL - vsechny UI scenare vcetne pixelu a ulozeni
        shell: cmd
        run: |
          set "LOCALAPPDATA=%GITHUB_WORKSPACE%\test-artifacts"
          where git
          if errorlevel 1 exit /b 1
          git rev-parse --verify HEAD
          if errorlevel 1 exit /b 1
          node tools\local-browser-qa.cjs --all
          if errorlevel 1 exit /b 1

      - name: Diagnostika neúspěšných i úspěšných vizuálních scénářů
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zamerovac-windows-browser-smoke
          path: test-artifacts/Zamerovac-QA/browser/
          if-no-files-found: ignore
          retention-days: 7

  native-jvm:
    # All Linux tests on the SAME trusted Windows runner through an isolated WSL2 distro.
    # Direct Windows Robolectric produced 85 filesystem-specific failures (not suppressed).
    # Full 265 native tests, Drive negative cases, Java compile + independent PDF renderer.
    needs: local-quick
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    name: Home WSL2 native Java + 265 Robolectric + PDF
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 60
    env:
      CI: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Pinned trusted Git before source checkout
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"

      - name: Read-only checkout of same exact commit as quick and browser tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_TEST_REF }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify exact source SHA on Windows
        shell: cmd
        run: |
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if not defined ACTUAL_SHA exit /b 1
          if /I not "%ACTUAL_SHA%"=="%QA_TEST_REF%" exit /b 1
          echo TESTED_NATIVE_SOURCE_SHA=%ACTUAL_SHA%

      - name: Linux ext4 testovni adresar, Gradle SHA256, vsechny Robolectric + Drive testy
        shell: 'C:\actions-runner\tools\Python313\python.exe {0}'
        run: |
          import os
          from pathlib import Path
          import subprocess

          expected = os.environ["QA_TEST_REF"]
          if os.environ.get("USERNAME", "").lower() != "zamerovacqa":
              raise SystemExit("STOP: unexpected Windows account")
          workspace = os.environ["GITHUB_WORKSPACE"]
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=workspace, text=True).strip()
          if sha != expected:
              raise SystemExit("STOP: checkout SHA mismatch")

          linux = r"""
          set -Eeuo pipefail
          export CI=1
          export DEBIAN_FRONTEND=noninteractive
          export LC_ALL=C.UTF-8
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export GRADLE_USER_HOME=/root/.gradle

          source_dir="$(wslpath -u "$1")"
          reports="$(wslpath -u "$2")"
          sha="$3"
          destination="/root/zamerovac-qa-commits/$sha"
          mkdir -p "$reports"
          trap 'if [ -d "$destination/app/build/test-results/testPreviewUnitTest" ]; then cp -a "$destination/app/build/test-results/testPreviewUnitTest" "$reports/"; fi' EXIT

          echo "[WSL] Linux ext4 isolated fixture and pinned SHA"
          test -d "$source_dir/.git"
          test -f "$source_dir/app/build.gradle"
          if [ ! -d "$destination/.git" ]; then
            mkdir -p "$destination"
            cp -a "$source_dir/." "$destination/"
          fi
          cd "$destination"
          actual="$(git rev-parse HEAD)"
          echo "[WSL] TESTED_SOURCE_SHA=$actual"
          test "$actual" = "$sha"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test "$(uname -s)" = "Linux"
          java -version

          echo "[WSL] Pinned official Gradle 8.10.2 SHA256"
          archive=/opt/gradle-8.10.2-bin.zip
          check=31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26
          if [ ! -x /opt/gradle-8.10.2/bin/gradle ]; then
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 --max-time 900 \
              https://services.gradle.org/distributions/gradle-8.10.2-bin.zip --output "$archive"
            echo "$check  $archive" | sha256sum --check
            unzip -q "$archive" -d /opt
            rm -f "$archive"
          fi
          gradle=/opt/gradle-8.10.2/bin/gradle
          "$gradle" --version

          # Force the exact tests to execute again; old cache must not masquerade as a new pass.
          rm -rf app/build/test-results/testPreviewUnitTest
          rm -f app/build/customer-pdf-1.zip app/build/customer-pdf-3.zip app/build/customer-pdf-multipage.zip

          echo "[WSL] Negative Drive configuration test first"
          "$gradle" --no-daemon --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=384m" \
            -p tools/drive-config-checks verify --console=plain

          echo "[WSL] FULL native Java/Robolectric at exact source SHA"
          "$gradle" --no-daemon --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=384m" \
            :app:verifyDriveRegistration :app:compilePreviewJavaWithJavac \
            :app:testPreviewUnitTest -PdriveRequireConfigured=true --console=plain

          echo "[WSL] Independent XML assertion for the full native suite"
          python3 - <<'PY_XML'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = sorted(Path('app/build/test-results/testPreviewUnitTest').glob('TEST-*.xml'))
          if not files:
              raise SystemExit("FAIL: no native test reports")
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for path in files:
              root = ET.parse(path).getroot()
              for name in totals:
                  totals[name] += int(root.attrib.get(name, '0'))
          print("LINUX_ROBOLECTRIC_XML_COUNTS:", totals, "FILES:", len(files), flush=True)
          if totals['tests'] < 265 or totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit("FAIL: expected all 265+ native tests to pass without skips")
          print("PASS: complete Java/Robolectric regression on Linux ext4, exact B12 SHA", flush=True)
          PY_XML
          for pdf_fixture in customer-pdf-1.zip customer-pdf-3.zip customer-pdf-multipage.zip; do
            test -s "app/build/$pdf_fixture"
            cp "app/build/$pdf_fixture" "$reports/$pdf_fixture"
          done
          echo "[WSL] PDF fixtures copied to Windows for independent renderer"
          echo "[WSL] NO APK generated or uploaded, NO cloud hosted runner"
          """

          output_dir = str(Path(workspace) / "wsl-native-reports")
          cmd = ["wsl.exe", "--distribution", "Zamerovac-Ubuntu-QA", "--user",
                 "root", "--exec", "/bin/bash", "-lc", linux, "_", workspace,
                 output_dir, expected]
          print("WSL 2 capped 4GB RAM / 2 CPUs; serial Gradle; no emulator / no release", flush=True)
          p = subprocess.Popen(cmd, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                               stderr=subprocess.STDOUT)
          for line in p.stdout:
              print(line.decode("utf-8", errors="replace").rstrip(), flush=True)
          rc = p.wait()
          if rc != 0:
              raise SystemExit("FAIL: Linux native QA returned " + str(rc))


      - name: Independent PDF parse and render of ALL generated fixture ZIPs
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\Python313\python.exe" exit /b 1
          if not exist "wsl-native-reports\customer-pdf-1.zip" exit /b 1
          if not exist "wsl-native-reports\customer-pdf-3.zip" exit /b 1
          if not exist "wsl-native-reports\customer-pdf-multipage.zip" exit /b 1
          "C:\actions-runner\tools\Python313\python.exe" -m pip install --disable-pip-version-check "pypdf[image]>=5,<7" "pymupdf>=1.24,<2"
          if errorlevel 1 exit /b 1
          "C:\actions-runner\tools\Python313\python.exe" tools\check-customer-pdf.py wsl-native-reports\customer-pdf-1.zip wsl-native-reports\customer-pdf-3.zip wsl-native-reports\customer-pdf-multipage.zip
          if errorlevel 1 exit /b 1
          echo PASS native 265 and independent PDF renderer

      - name: Preserve home Linux JUnit evidence; never upload APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zamerovac-home-wsl-native-and-pdf
          path: wsl-native-reports/
          if-no-files-found: ignore
          retention-days: 7

  # Souhrnna technicka zkouska: plny Windows browser + native PASS nejprve.
  # Pouze mistni vystup, po overeni vzdy smazan. ZADNY RELEASE ANI APK ARTIFAKT.
  preview-build-smoke:
    needs: [browser-smoke, native-jvm]
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    name: Windows technicke sestaveni APK BEZ vydani
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 45
    env:
      CI: '1'
      ANDROID_HOME: 'C:\actions-runner\tools\AndroidSdk'
      ANDROID_SDK_ROOT: 'C:\actions-runner\tools\AndroidSdk'
    steps:
      - name: Kontrola duveryhodne udalosti
        shell: cmd
        run: |
          if not "%GITHUB_EVENT_NAME%"=="push" if not "%GITHUB_EVENT_NAME%"=="workflow_dispatch" exit /b 1
          if not "%GITHUB_REF%"=="refs/heads/main" exit /b 1
      - name: Pripnout overeny Git CLI
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
      - name: Načíst přesný důvěryhodný commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_TEST_REF }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Dolozit presny checkout SHA i pro build
        shell: cmd
        run: |
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if not defined ACTUAL_SHA exit /b 1
          if /I not "%ACTUAL_SHA%"=="%QA_TEST_REF%" exit /b 1
          echo TESTED_BUILD_SOURCE_SHA=%ACTUAL_SHA%
      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preverified Gradle 8.10.2 from LOCAL Windows tools - no HTTP
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\Gradle-8.10.2\bin\gradle.bat" exit /b 1
          echo C:\actions-runner\tools\Gradle-8.10.2\bin>>"%GITHUB_PATH%"
          call "C:\actions-runner\tools\Gradle-8.10.2\bin\gradle.bat" --version
          if errorlevel 1 exit /b 1
      - name: Read-only preflight poslední vydané podepsané APK (bez vydání)
        shell: 'C:\actions-runner\tools\Python313\python.exe {0}'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os
          import sys
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from tools.release.home_qa_version_preflight import main
          main()
      - name: Build Preview a kontrola podpisu, balicku a verze - bez uploadu
        shell: cmd
        run: |
          rem Build uses code computed from the verified LAST published signed APK.
          if not defined QA_PREVIEW_BUILD_OFFSET exit /b 1
          if not defined QA_PREVIEW_EXPECTED_CODE exit /b 1
          if not defined QA_PREVIEW_EXPECTED_VERSION_NAME exit /b 1
          set "GITHUB_RUN_NUMBER=%QA_PREVIEW_BUILD_OFFSET%"
          call gradle.bat --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=-Xmx1536m" :app:verifyDriveRegistration :app:assemblePreview -PdriveRequireConfigured=true
          if errorlevel 1 exit /b 1
          set "APK=%GITHUB_WORKSPACE%\app\build\outputs\apk\preview\app-preview.apk"
          if not exist "%APK%" exit /b 1
          call "%ANDROID_HOME%\build-tools\34.0.0\apksigner.bat" verify --min-sdk-version 26 --print-certs "%APK%" > "%RUNNER_TEMP%\apk-sign-check.txt"
          if errorlevel 1 exit /b 1
          findstr /i /c:"c828c96739e554e8da4f5851913356134f1359a98d5013772ad5587e74a2d229" "%RUNNER_TEMP%\apk-sign-check.txt" >nul
          if errorlevel 1 exit /b 1
          "%ANDROID_HOME%\build-tools\34.0.0\aapt.exe" dump badging "%APK%" > "%RUNNER_TEMP%\apk-package-check.txt"
          if errorlevel 1 exit /b 1
          findstr /c:"name='cz.zamerovac.app.preview'" "%RUNNER_TEMP%\apk-package-check.txt" >nul
          if errorlevel 1 exit /b 1
          findstr /c:"versionCode='%QA_PREVIEW_EXPECTED_CODE%'" "%RUNNER_TEMP%\apk-package-check.txt" >nul
          if errorlevel 1 exit /b 1
          findstr /c:"versionName='%QA_PREVIEW_EXPECTED_VERSION_NAME%'" "%RUNNER_TEMP%\apk-package-check.txt" >nul
          if errorlevel 1 exit /b 1
          echo PASS: technicka APK; stejny certifikat, balicek, versionCode %QA_PREVIEW_EXPECTED_CODE% nad %QA_PREVIEW_PREVIOUS_RELEASE_CODE%.
          echo NOT RELEASED, NOT UPLOADED, NOT INSTALLED.
      - name: Smazat docasne APK po testu i pri selhani
        if: always()
        shell: cmd
        run: |
          if exist "app\build\outputs\apk\preview\app-preview.apk" del /f /q "app\build\outputs\apk\preview\app-preview.apk"
          if exist "%RUNNER_TEMP%\apk-sign-check.txt" del /f /q "%RUNNER_TEMP%\apk-sign-check.txt"
          if exist "%RUNNER_TEMP%\apk-package-check.txt" del /f /q "%RUNNER_TEMP%\apk-package-check.txt"
          echo Testovaci APK neni uchovana jako artefakt.
