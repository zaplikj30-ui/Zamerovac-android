name: Zaměřovač - důvěryhodná Windows QA

# Domácí runner: žádné nedůvěryhodné PR ani fork. Automaticky jen main.
# Pro rozpracované větve je nutné ruční workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Důvěryhodný commit SHA nebo vlastní větev k otestování'
        required: true
        default: 'main'
        type: string
  push:
    branches: [main, infra/windows-self-hosted-qa-20261108] # pouze prvotní test, před merge odebrat
    paths:
      - 'app/src/main/assets/**'
      - 'app/src/main/java/**'
      - 'app/src/test/**'
      - 'tests/**'
      - 'sync/**'
      - 'tools/**'
      - '.github/workflows/windows-self-hosted-qa.yml'

permissions:
  contents: read

concurrency:
  group: zamerovac-trusted-windows-stage2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-quick:
    # Push na chráněný main nebo explicitní ruční spuštění vlastníkem.
    # ZÁMĚRNĚ žádné pull_request ani pull_request_target.
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' }}
    name: Windows 11 - Node + Python lokální QA
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 25
    env:
      CI: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Read-only checkout - bez uložených GitHub přihlašovacích údajů
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PRVOTNÍ VALIDACE: suite local-qa je zatím jen na B12, nikoli na main.
          # Před sloučením tohoto workflow změnit výchozí ref zpět na github.sha.
          ref: ${{ inputs.target_ref || 'fix/b12-pan-pinch-lifecycle-20261108' }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Python pro testovací službu (jen tento job)
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\Python313\python.exe" (
            echo CHYBI oddeleny Python 3.13 v runneru.
            exit /b 1
          )
          "C:\actions-runner\tools\Python313\python.exe" -c "import sys,unittest;print(sys.version)"
          if errorlevel 1 exit /b 1
          echo C:\actions-runner\tools\Python313>>"%GITHUB_PATH%"

      - name: Kontrola prostředí
        shell: cmd
        run: |
          whoami
          where node
          node --version
          if errorlevel 1 exit /b 1
          where python
          python --version
          if errorlevel 1 exit /b 1

      - name: Kompletní rychlé Node/Python testy - žádná APK
        shell: cmd
        run: |
          node tools\local-qa.cjs --quick
          if errorlevel 1 exit /b 1

  browser-smoke:
    # Domácí runner po rychlé kontrole; nesoučasně s Gradlem či emulátorem.
    needs: local-quick
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' }}
    name: Windows Chromium - kreslení a viditelné pixely
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 30
    env:
      CI: '1'
      PLAYWRIGHT_BROWSERS_PATH: 'C:\actions-runner\tools\ms-playwright'
    steps:
      # GitHub Desktop neni potreba. Git musime dat do PATH JESTE PRED checkout,
      # aby checkout vytvoril skutečny .git adresar pro E2E rev-parse HEAD.
      # Pouze duveryhodny Git for Windows MinGit + pevny SHA256, bez instalatoru
      # a bez systemovych uprav na domacim 16GB Windows PC.
      - name: Git CLI pro prohlizecove testy - pripnuty overeny MinGit
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" (
            if not exist "C:\actions-runner\tools\MinGit-2.56.0.4" mkdir "C:\actions-runner\tools\MinGit-2.56.0.4"
            if errorlevel 1 exit /b 1
            curl.exe --fail --silent --show-error --location "https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.4/MinGit-2.56.0.4-64-bit.zip" --output "%RUNNER_TEMP%\zamerovac-MinGit-2.56.0.4.zip"
            if errorlevel 1 exit /b 1
            certutil.exe -hashfile "%RUNNER_TEMP%\zamerovac-MinGit-2.56.0.4.zip" SHA256 | findstr.exe /i /c:"e3bf78351fe777fba47ddee5950082f8a98bb0f02604fdc7ba3ee2cb68ffa877" >nul
            if errorlevel 1 (
              echo CHYBA: SHA256 MinGit nesouhlasi s GitHub release.
              exit /b 1
            )
            tar.exe -xf "%RUNNER_TEMP%\zamerovac-MinGit-2.56.0.4.zip" -C "C:\actions-runner\tools\MinGit-2.56.0.4"
            if errorlevel 1 exit /b 1
          )
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          set "PATH=C:\actions-runner\tools\MinGit-2.56.0.4\cmd;%PATH%"
          git --version
          if errorlevel 1 exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"

      - name: Načíst důvěryhodný testovaný commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Před merge vrátit github.sha; B12 zatím není na main.
          ref: ${{ inputs.target_ref || 'fix/b12-pan-pinch-lifecycle-20261108' }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Ověřit bezpečnost lokálního HTTP serveru
        shell: cmd
        run: |
          node tools\local-browser-qa.cjs --self-test
          if errorlevel 1 exit /b 1

      - name: Připravit připnutý Playwright a Chromium
        shell: cmd
        run: |
          call npm.cmd install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          if errorlevel 1 exit /b 1
          call npx.cmd --no-install playwright install chromium
          if errorlevel 1 exit /b 1

      - name: Chromium smoke - kreslení, přesnost a čitelnost galerie
        shell: cmd
        run: |
          set "LOCALAPPDATA=%GITHUB_WORKSPACE%\test-artifacts"
          where git
          if errorlevel 1 exit /b 1
          git rev-parse --verify HEAD
          if errorlevel 1 exit /b 1
          node tools\local-browser-qa.cjs --smoke
          if errorlevel 1 exit /b 1

      - name: Diagnostika neúspěšných i úspěšných vizuálních scénářů
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zamerovac-windows-browser-smoke
          path: test-artifacts/Zamerovac-QA/browser/
          if-no-files-found: ignore
          retention-days: 7

  native-jvm:
    # Nezavisle na browser smoke, ale až po rychlém PASS; jediný místní runner
    # vykonává jobs postupně. Žádné sestavení APK ani Android emulátor.
    needs: local-quick
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' }}
    name: Windows JVM + Robolectric (bez APK)
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      CI: '1'
      PYTHONUTF8: '1'
      # Vlastní izolovaný SDK adresář runneru, nezávislý na osobním profilu.
      ANDROID_HOME: 'C:\actions-runner\tools\AndroidSdk'
      ANDROID_SDK_ROOT: 'C:\actions-runner\tools\AndroidSdk'
    steps:
      - name: Načíst pouze důvěryhodné zdroje
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # DOČASNÉ B12: po integraci přepnout na github.sha stejně jako další jobs.
          ref: ${{ inputs.target_ref || 'fix/b12-pan-pinch-lifecycle-20261108' }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Python 3.13 pro nezávislou kontrolu PDF
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\Python313\python.exe" exit /b 1
          echo C:\actions-runner\tools\Python313>>"%GITHUB_PATH%"

      - name: JDK 17 (uživatelská cache runneru)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2 (bez wrapperu v repozitáři)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      # setup-android@v4 na této Windows službě padá kvůli Expand-Archive
      # na dočasném souboru bez .zip; používáme podporovaný přímo stažený ZIP.
      # Oficiální Google Android SDK tools pro Windows; SHA-256 z developer.android.com/studio.
      - name: Android command-line tools - oficiální ZIP a SHA256 kontrola
        shell: cmd
        run: |
          if not exist "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" (
            if not exist "%ANDROID_HOME%\cmdline-tools" mkdir "%ANDROID_HOME%\cmdline-tools"
            if errorlevel 1 exit /b 1
            curl.exe --fail --silent --show-error --location "https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip" --output "%RUNNER_TEMP%\zamerovac-android-commandline-15859902.zip"
            if errorlevel 1 exit /b 1
            certutil.exe -hashfile "%RUNNER_TEMP%\zamerovac-android-commandline-15859902.zip" SHA256 | findstr.exe /i /c:"90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a" >nul
            if errorlevel 1 (
              echo CHYBA: SHA256 oficialniho Android SDK archivu nesouhlasi.
              exit /b 1
            )
            tar.exe -xf "%RUNNER_TEMP%\zamerovac-android-commandline-15859902.zip" -C "%ANDROID_HOME%\cmdline-tools"
            if errorlevel 1 exit /b 1
            ren "%ANDROID_HOME%\cmdline-tools\cmdline-tools" latest
            if errorlevel 1 exit /b 1
          )
          if not exist "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" exit /b 1
          echo %ANDROID_HOME%\cmdline-tools\latest\bin>>"%GITHUB_PATH%"
          echo %ANDROID_HOME%\platform-tools>>"%GITHUB_PATH%"
          echo %ANDROID_HOME%\build-tools\35.0.0>>"%GITHUB_PATH%"

      - name: Android SDK licence, API 35 a build tools (bez APK)
        shell: cmd
        run: |
          (for /L %%i in (1,1,50) do @echo y) | call sdkmanager.bat --sdk_root="%ANDROID_HOME%" --licenses
          if errorlevel 1 exit /b 1
          call sdkmanager.bat --sdk_root="%ANDROID_HOME%" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if errorlevel 1 exit /b 1

      - name: Ověření přesných verzí (bez APK)
        shell: cmd
        run: |
          java -version
          if errorlevel 1 exit /b 1
          call gradle.bat --version
          if errorlevel 1 exit /b 1
          call sdkmanager.bat --sdk_root="%ANDROID_HOME%" --list_installed
          if errorlevel 1 exit /b 1

      - name: Veřejná Drive registrace a chybové konfigurace
        shell: cmd
        run: |
          call gradle.bat --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2048m -p tools/drive-config-checks verify
          if errorlevel 1 exit /b 1

      - name: Java kompilace + Robolectric jednotkové testy
        shell: cmd
        run: |
          call gradle.bat --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2048m :app:verifyDriveRegistration :app:compilePreviewJavaWithJavac :app:testPreviewUnitTest -PdriveRequireConfigured=true
          if errorlevel 1 exit /b 1

      - name: Nezávisle otevřít a vykreslit zákaznická PDF
        shell: cmd
        run: |
          python -m pip install "pypdf[image]>=5,<7" "pymupdf>=1.24,<2"
          if errorlevel 1 exit /b 1
          python tools\check-customer-pdf.py app\build\customer-pdf-1.zip app\build\customer-pdf-3.zip app\build\customer-pdf-multipage.zip
          if errorlevel 1 exit /b 1

      - name: Uložit testovací důkazy (nikoliv APK)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zamerovac-windows-native-jvm
          path: |
            app/build/test-results/testPreviewUnitTest/
            app/build/reports/drive-registration.json
            app/build/customer-pdf-*.zip
          if-no-files-found: ignore
          retention-days: 7
