name: Zaměřovač - HOME QA 4/4 (prepared, NOT ACTIVATED)
# Activation requires independent review, verified inventory and owner approval.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zamerovac-trusted-windows-qa-${{ github.ref }}
  cancel-in-progress: false
env:
  HOME4_SOURCE_SHA: c7e71327d69bfe87f622ff6293422e2e15332a11
  HOME4_VALIDATOR_SHA: 937961e676ac2b68411c332c9afe3cb7e44a7aa4
  HOME4_APPROVED_MAIN_SHA: '' # Deliberately unresolved; no approved future main run.
  HOME4_PROFILE_FILE: 'C:\actions-runner\tools\home4-approved-inventory.json'
  HOME4_PROFILE_SHA256: UNVERIFIED
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  npm_config_offline: 'true'
  NODE_OPTIONS: ''
  NODE_PATH: ''
  PYTHONHOME: ''
  PYTHONPATH: ''
  GIT_CONFIG_NOSYSTEM: '1'
  GIT_CONFIG_GLOBAL: NUL
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  local-quick:
    name: Windows quick
    if: ${{ false && github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.triggering_actor == 'zaplikj30-ui' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 40
    steps:
      - name: Read-only bootstrap; missing inventory means BLOCKED
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            if ($env:GITHUB_REPOSITORY -cne 'zaplikj30-ui/Zamerovac-android' -or $env:GITHUB_ACTOR -cne 'zaplikj30-ui' -or $env:GITHUB_TRIGGERING_ACTOR -cne 'zaplikj30-ui' -or $env:GITHUB_REF -cne 'refs/heads/main' -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'identity' }
            if ($env:HOME4_APPROVED_MAIN_SHA -cne $env:GITHUB_SHA -or $env:HOME4_PROFILE_SHA256 -cnotmatch '^[a-f0-9]{64}$') { throw 'approval' }
            if ((Get-FileHash -LiteralPath $env:HOME4_PROFILE_FILE -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:HOME4_PROFILE_SHA256) { throw 'inventory' }
            $p = Get-Content -LiteralPath $env:HOME4_PROFILE_FILE -Raw | ConvertFrom-Json
            if ($p.verified -cne $true) { throw 'unverified' }
            foreach ($key in @('node','python','git')) {
              $tool = $p.components.$key
              $file = Join-Path $tool.root $tool.entry
              $digest = $tool.files.($tool.entry)
              if ($digest -cnotmatch '^[a-f0-9]{64}$') { throw 'tool' }
              $names = @($tool.files.PSObject.Properties.Name)
              $actual = @(Get-ChildItem -LiteralPath $tool.root -Force -Recurse -File)
              if ($names.Count -eq 0 -or $actual.Count -ne $names.Count) { throw 'tool files' }
              foreach ($item in $actual) {
                $entry = $item.FullName.Substring($tool.root.TrimEnd('\').Length + 1).Replace('\','/')
                if ($names -cnotcontains $entry) { throw 'extra tool file' }
                $walk = $item
                while ($null -ne $walk) {
                  if (($walk.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'redirected tool' }
                  $walk = if ($walk -is [IO.FileInfo]) { $walk.Directory } else { $walk.Parent }
                }
                if ((Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $tool.files.($entry)) { throw 'tool bytes' }
              }
              if ($key -eq 'node') { "HOME4_NODE=$file" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
              Split-Path -Parent $file | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          } catch { Write-Output 'BLOCKED bootstrap; STOP / NO RETRY'; exit 78 }
      - name: Pinned validator source transfer only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HOME4_VALIDATOR_SHA }}
          path: validator
          persist-credentials: false
          fetch-depth: 1
      - name: Pinned integrated product source transfer only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HOME4_SOURCE_SHA }}
          path: product
          persist-credentials: false
          fetch-depth: 1
      - name: Required historical Git DATA (never execute old workflows)
        shell: powershell
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            # Per-process authorization only; no credential/config persistence.
            $env:GIT_CONFIG_COUNT = '2'
            $env:GIT_CONFIG_KEY_1 = 'http.https://github.com/.extraheader'
            $env:GIT_CONFIG_VALUE_1 = 'AUTHORIZATION: basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('x-access-token:' + $env:GH_READ_TOKEN))
            git -C validator fetch --no-tags --depth=1 origin a3cc8eb3a14a9a6710664b73ba8a5c70ed1a340a ae3b4df53c25557f28b4a25ccb65adc2abdff639 1d6a786c77aa2a797bf7bd75f9977a3ae6613459 6f98ceffff50d337f7c2999fed0e0878d20a582e $env:HOME4_SOURCE_SHA *> $null
            if ($LASTEXITCODE -ne 0) { throw 'objects' }
          } catch { Write-Output 'BLOCKED pinned Git data; STOP / NO RETRY'; exit 78 }
          finally { Remove-Item Env:GIT_CONFIG_KEY_1,Env:GIT_CONFIG_VALUE_1,Env:GH_READ_TOKEN -ErrorAction SilentlyContinue }
      - name: Owned quick with bounded redacted result
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $source = (Resolve-Path product).Path
            $script = (Resolve-Path validator/tools/qa/home4.cjs).Path
            $text = & $env:HOME4_NODE $script quick $source $env:HOME4_PROFILE_FILE $env:HOME4_PROFILE_SHA256 $env:HOME4_SOURCE_SHA $env:HOME4_VALIDATOR_SHA 2>$null
            $code = $LASTEXITCODE
            $json = ($text -join "`n")
            if ($json.Length -gt 4096) { throw 'evidence limit' }
            $r = $json | ConvertFrom-Json
            if ($code -ne 0 -or $r.status -cne 'PASS' -or $r.cleanupVerified -cne $true) { throw 'blocked' }
            Write-Output 'PASS quick; required results and cleanup verified'
          } catch { Write-Output 'BLOCKED quick; STOP / NO RETRY'; exit 78 }
