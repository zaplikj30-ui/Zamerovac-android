name: Zaměřovač – rychlá kontrola zdrojů (bez APK)

# Po změně editoru/poznámek provést jen krátké testy.
# Sestavení a vydání APK řídí zvlášť build-apk.yml na vyžádání.
on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/**'
      - 'app/src/main/java/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/test/**'
      - 'app/build.gradle'
      - 'tests/**'
      - 'sync/**'
      - 'tools/check-post*-browser.cjs'
      - 'tools/check-orientation-browser.cjs'
      - 'tools/check-loupe-exit-browser.cjs'
      - 'tools/e2e/**'
      - 'tools/qa/**'
      - 'qa/**'
      - '.github/workflows/quick-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/assets/**'
      - 'app/src/main/java/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/test/**'
      - 'app/build.gradle'
      - 'tests/**'
      - 'sync/**'
      - 'tools/check-post*-browser.cjs'
      - 'tools/check-orientation-browser.cjs'
      - 'tools/check-loupe-exit-browser.cjs'
      - 'tools/e2e/**'
      - 'tools/qa/**'
      - 'qa/**'
      - '.github/workflows/quick-check.yml'

permissions:
  contents: read

concurrency:
  group: zamerovac-fast-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    name: Syntaxe JS a regresní testy bez Gradlu
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Zkontrolovat syntax všech JavaScriptových souborů
        shell: bash
        run: |
          set -euo pipefail
          for file in app/src/main/assets/*.js sync/*.js; do
            node --check "$file"
          done
      - name: Spustit rychlé testy editoru a poznámek
        shell: bash
        run: |
          set -euo pipefail
          node tools/qa/audit.cjs
          for script in tests/*.js; do
            node "$script"
          done
          python3 -m unittest discover -s tests -p 'test_*.py' -v

  browser-check:
    name: Chromium – nabídky, rozpracované kóty a bezpečný koš
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Připravit izolovaný prohlížeč
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          # ubuntu-latest already has the Chromium runtime libraries and Czech fonts.
          # Download only the pinned browser; apt font mirrors timed out before tests.
          npx playwright install chromium
      - name: Skutečné kliknutí, dotyk, persistence a exportní vstupy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory app/src/main/assets > /tmp/zamerovac-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tools/check-post17-browser.cjs
          node tools/check-post148-browser.cjs
          node tools/check-post149-browser.cjs
          node tools/check-orientation-browser.cjs
          node tools/check-loupe-exit-browser.cjs
          node tools/check-address-map-browser.cjs
          node tools/check-untrusted-ids-browser.cjs

  practical-e2e:
    name: Praktické UI a barevné pixely (syntetická data)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Připravit Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          # ubuntu-latest already has the Chromium runtime libraries and Czech fonts.
          # Download only the pinned browser; apt font mirrors timed out before tests.
          npx playwright install chromium
      - name: Kreslení, hodnoty, úchopy, Undo/Redo, pixely a persistence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory app/src/main/assets > /tmp/zamerovac-e2e-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tools/e2e/drawing.cjs
          node tools/e2e/workflows.cjs
          node tools/e2e/interactions.cjs
          node tools/e2e/zoom-grid.cjs
          node tools/e2e/update39.cjs
          node tools/e2e/peer-sync.cjs
          node tools/e2e/drive-accounts.cjs
          node tools/e2e/sync-cadence.cjs
          node tools/e2e/backup-history.cjs
          node tools/e2e/read-only-sync.cjs
          node tools/e2e/sync-edit-guard.cjs
          node tools/e2e/note-sync.cjs
          node tools/e2e/web-content-policy.cjs
          node tools/e2e/media-import.cjs
          node tools/e2e/help.cjs
          node tools/e2e/release-history.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practical-e2e-diagnostics
          path: test-artifacts/
          retention-days: 14
