name: Zaměřovač – kontrola kompilace Androidu bez APK
# STAGED ONLY, DO NOT MERGE BEFORE LOCAL WINDOWS LINUX-COMPATIBLE TEST PASS.
# Cloud QA stays available as manual emergency regression backup; never run without owner approval.
on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Obnovit veřejné Robolectric SDK artefakty
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.16.1-sdk26-35-v1-${{ runner.os }}
      - name: Ověřit veřejnou Drive registraci a chybové konfigurace bez APK
        run: gradle --no-daemon -p tools/drive-config-checks verify
      - name: Ověřit Java a Android zdroje bez vydání APK
        run: gradle --no-daemon :app:verifyDriveRegistration :app:compilePreviewJavaWithJavac :app:testPreviewUnitTest -PdriveRequireConfigured=true
      - name: Nezávisle parsovat a vykreslit zákaznické PDF
        run: |
          python3 -m pip install 'pypdf[image]>=5,<7' 'pymupdf>=1.24,<2'
          python3 tools/check-customer-pdf.py app/build/customer-pdf-1.zip app/build/customer-pdf-3.zip app/build/customer-pdf-multipage.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-regression-results
          path: |
            app/build/test-results/testPreviewUnitTest/
            app/build/reports/drive-registration.json
            app/build/customer-pdf-*.zip
          retention-days: 14
