name: Zamerovac - post-install Visual Studio inventory read-only
on:
  push:
    branches: [qa/coord42-vs2026-inventory-20261115]
    paths: ['.github/workflows/coord42-win32-inventory.yml']
permissions:
  contents: read
concurrency:
  group: coord42-vs2026-inventory-20261115
  cancel-in-progress: false
jobs:
  inventory:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.triggering_actor == 'zaplikj30-ui' && github.event_name == 'push' && github.event.created == false && github.run_number == 5 && github.run_attempt == 1 && github.ref == 'refs/heads/qa/coord42-vs2026-inventory-20261115' && github.event.head_commit.message == 'execute-coord42-vs2026-inventory' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 4
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Trust and local runtime guard
        shell: cmd
        run: |
          if /I not "%USERNAME%"=="ZamerovacQA" exit /b 1
          if not "%RUNNER_ENVIRONMENT%"=="self-hosted" exit /b 1
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          if not exist "C:\actions-runner\tools\Python313\python.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
      - name: Read-only checkout at pinned reviewed script SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: 0591009eeb7344b11e638fed674f76cfd909fdac
          path: qa42-inventory-${{ github.run_id }}
          clean: false
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify exact source SHA, run inventory once
        shell: cmd
        working-directory: qa42-inventory-${{ github.run_id }}
        run: |
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if /I not "%ACTUAL_SHA%"=="0591009eeb7344b11e638fed674f76cfd909fdac" exit /b 1
          echo TRUSTED_INVENTORY_SCRIPT_SHA=0591009eeb7344b11e638fed674f76cfd909fdac
          "C:\actions-runner\tools\Python313\python.exe" -I tools\coord42-win32-inventory.py
          if errorlevel 1 exit /b 1
# Owner-only one-time activation of verified read-only inventory (no build).
