name: Zaměřovač - TEMP B16 důvěryhodné domácí rychlé testy (bez APK)
# Jednorázové ověření přesného B16 SHA; po výsledku workflow z větve odstranit.
on:
  push:
    branches: [fix/b16-native-cas-response-guard-20261108]
    paths: ['.github/workflows/b16-trusted-home-quick-temporary.yml']
permissions:
  contents: read
concurrency:
  group: zamerovac-b16-trusted-quick
  cancel-in-progress: false
jobs:
  b16-quick:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.event_name == 'push' && github.ref == 'refs/heads/fix/b16-native-cas-response-guard-20261108' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 25
    env:
      CI: '1'
      PYTHONUTF8: '1'
      B16_EXACT_SHA: '4054d50db85ff0657b0d4ade67e2898a980520ec'
    steps:
      - name: Odmítnout jiný trigger, větev či neautorizovaný commit
        shell: cmd
        run: |
          if not "%GITHUB_EVENT_NAME%"=="push" exit /b 1
          if not "%GITHUB_REF%"=="refs/heads/fix/b16-native-cas-response-guard-20261108" exit /b 1
          echo PASS: trusted B16 branch and push event
      - name: Ověřený Git pro skutečný checkout
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
      - name: Pinned read-only checkout přesného aplikačního SHA (bez PR/forků)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.B16_EXACT_SHA }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Doložit přesné testované SHA a práva uživatele
        shell: cmd
        run: |
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%H"
          if not defined ACTUAL_SHA exit /b 1
          if /I not "%ACTUAL_SHA%"=="%B16_EXACT_SHA%" exit /b 1
          if /I not "%USERNAME%"=="ZamerovacQA" exit /b 1
          echo TESTED_SOURCE_SHA=%ACTUAL_SHA%
          echo PASS: trusted test service account
      - name: Přesný produkční CAS + dosavadní regrese ukládání
        shell: cmd
        run: |
          node --version
          node --check app\src\main\assets\app.js
          if errorlevel 1 exit /b 1
          node --check tests\save_cas_conflict_guard.js
          if errorlevel 1 exit /b 1
          node tests\save_cas_conflict_guard.js
          if errorlevel 1 exit /b 1
          node tests\save_acknowledgement.js
          if errorlevel 1 exit /b 1
          node tests\save_blocked_load_regression.js
          if errorlevel 1 exit /b 1
          node tests\sync_conflict_bridge.js
          if errorlevel 1 exit /b 1
          echo PASS: B16 targeted save / CAS / sync regression
      - name: Kompletní rychlé Node a Python testy bez sestavení
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\Python313\python.exe" exit /b 1
          set "PATH=C:\actions-runner\tools\Python313;%PATH%"
          where python
          if errorlevel 1 exit /b 1
          python --version
          if errorlevel 1 exit /b 1
          node tools\local-qa.cjs --quick
          if errorlevel 1 exit /b 1
          echo PASS: full quick suite, NO APK, NO cloud
