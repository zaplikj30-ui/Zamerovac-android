name: Zamerovac - isolated integration of five PRs (one-shot, no APK)
on:
  push:
    branches:
      - integration/combined-209-223-215-220-222-20261120
    paths:
      - .github/workflows/integrate-five-prs-once.yml
permissions:
  contents: write
concurrency:
  group: zamerovac-5pr-one-shot
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'zaplikj30-ui/Zamerovac-android' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify inputs, merge with fail-closed conflict reporting
        shell: bash
        run: |
          set -euo pipefail
          BASE=82bd99ee95e8b08a6e2d4f4a430e04567bf7c82c
          mkdir -p integration-evidence/conflicts
          printf 'Base=%s\nKickoff=%s\n' "$BASE" "$GITHUB_SHA" > integration-evidence/provenance.txt
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$BASE" ]; then
            echo 'BLOCKED: main drift' | tee integration-evidence/blocked.txt
            exit 30
          fi
          if ! git merge-base --is-ancestor "$BASE" "$GITHUB_SHA"; then
            echo 'BLOCKED: kickoff does not descend from base' | tee integration-evidence/blocked.txt
            exit 31
          fi
          git fetch --no-tags origin \
            '+refs/pull/223/head:refs/remotes/source-pr223' \
            '+refs/pull/220/head:refs/remotes/source-pr220' \
            '+refs/pull/222/head:refs/remotes/source-pr222'
          test "$(git rev-parse refs/remotes/source-pr223)" = 89037d6d3d1b1afbac74383d61a511b8953f4881 || { echo 'BLOCKED: #223 drift' | tee integration-evidence/blocked.txt; exit 32; }
          test "$(git rev-parse refs/remotes/source-pr220)" = ea5ae399d1834917615a6d40546b60f3117e4a59 || { echo 'BLOCKED: #220 drift' | tee integration-evidence/blocked.txt; exit 32; }
          test "$(git rev-parse refs/remotes/source-pr222)" = d71c79ede1dfdd47953175e561084fc67371e3aa || { echo 'BLOCKED: #222 drift' | tee integration-evidence/blocked.txt; exit 32; }
          git config user.name 'Zamerovac Integration QA'
          git config user.email 'integration-qa@users.noreply.github.com'
          merge_one() {
            ref="$1"; label="$2"
            if git merge --no-ff --no-commit "refs/remotes/$ref"; then
              git commit -m "Integrate $label"
            else
              echo "BLOCKED: real merge conflict for $label" | tee integration-evidence/blocked.txt
              git status --short > integration-evidence/git-status.txt
              git ls-files -u > integration-evidence/unmerged-stages.txt
              git diff --cc > integration-evidence/combined.diff || true
              git diff --name-only --diff-filter=U | while IFS= read -r f; do
                [ -n "$f" ] || continue
                name="$(printf '%s' "$f" | tr / _)"
                cp "$f" "integration-evidence/conflicts/$name.conflicted" || true
                for n in 1 2 3; do
                  git show ":$n:$f" > "integration-evidence/conflicts/$name.stage$n" 2>/dev/null || true
                done
              done
              if [ "$ref" = source-pr220 ]; then
                python3 - <<'PY'
          from pathlib import Path
          import re
          expected = {
              'app/src/main/assets/app.js',
              'app/src/main/assets/index.html',
          }
          import subprocess
          unresolved = set(subprocess.check_output(
              ['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert unresolved == expected, f'Unexpected conflicts: {unresolved}'
          pattern = re.compile(r'(?ms)^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> refs/remotes/source-pr220\n')
          def parts(s):
              matches=list(pattern.finditer(s))
              assert len(matches)==1, f'Unexpected conflict markers: {len(matches)}'
              m=matches[0]
              return m,m.group(1),m.group(2)
          app=Path('app/src/main/assets/app.js')
          s=app.read_text()
          match,ours,theirs=parts(s)
          assert "window.ZFlight.record('native-save'" in ours
          assert 'newRecordIntent&&!candidateAllowsNewRecord' in theirs
          assert 'invalidateSyncBadgeAfterSave()' in theirs
          assert 'let presentationFailed=false' in theirs
          assert 'persistedSnapshot=text;' in theirs
          assert '   const text=JSON.stringify({...candidate,syncProtocol:2});' in theirs
          assert '   const result=JSON.parse(Native.saveDataChecked(text,expected));' in theirs
          combined=theirs.replace('   const text=JSON.stringify({...candidate,syncProtocol:2});',
          """   let zTiming=false;
             try{zTiming=window.ZFlight?.isEnabled?.()===true&&typeof performance!=='undefined'}catch(ignored){}
             const zSerializeStart=zTiming?performance.now():0;
             const text=JSON.stringify({...candidate,syncProtocol:2});
             const zSerializeMs=zTiming?performance.now()-zSerializeStart:0;""".replace('             ','   '),1)
          combined=combined.replace('   const result=JSON.parse(Native.saveDataChecked(text,expected));',
          """   const zSaveStart=zTiming?performance.now():null;
             const result=JSON.parse(Native.saveDataChecked(text,expected));
             if(zSaveStart!==null)try{window.ZFlight?.record('native-save',{serializeMs:zSerializeMs,bridgeMs:performance.now()-zSaveStart,success:result?.ok===true?1:0,...(result?.diag||{})})}catch(ignored){}""".replace('             ','   '),1)
          assert 'zSerializeMs' in combined and 'zSaveStart' in combined
          s=s[:match.start()]+combined+s[match.end():]
          original="}catch(e){window.ZFlight?.record('save-error',{},true);notify('Neuloženo: '+e.message);return reportSaveResult(false)}"
          safer="}catch(e){try{window.ZFlight?.record('save-error',{},true)}catch(ignored){}notify('Neuloženo: '+e.message);return reportSaveResult(false)}"
          assert s.count(original)==1
          s=s.replace(original,safer)
          app.write_text(s)
          html=Path('app/src/main/assets/index.html')
          s=html.read_text()
          match,ours,theirs=parts(s)
          assert ours.count('flight-recorder.js')==1
          assert theirs.count('settings-navigation.js')==1 and theirs.count('sync-status.js')==1
          assert theirs.count('flight-recorder.js')==0
          combined=theirs.replace('<script src="app.js"></script>',
                                  '<script src="flight-recorder.js"></script><script src="app.js"></script>',1)
          assert combined.count('flight-recorder.js')==1
          s=s[:match.start()]+combined+s[match.end():]
          html.write_text(s)
          print('PASS: manually specified, exact two-file conflict resolution')
          PY
                git add app/src/main/assets/app.js app/src/main/assets/index.html
                test -z "$(git ls-files -u)"
                git commit -m 'Integrate #215+#220 with checked CAS/diagnostics and script-order conflict resolution'
              else
                exit 33
              fi
            fi
          }
          merge_one source-pr223 '#209+#223'
          merge_one source-pr220 '#215+#220'
          merge_one source-pr222 '#222'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/flight_recorder.js')
          s=p.read_text()
          old="assert.match(app,/ZFlight\\.record\\('native-save'/);"
          new="assert.match(app,/ZFlight\\?\\.record\\('native-save'/);"
          assert s.count(old)==1, 'Unexpected diagnostic assertion'
          p.write_text(s.replace(old,new))
          p=Path('tests/new_record_save_failure.js')
          s=p.read_text()
          old='assert.equal(saveCalls,1);'
          new="assert.equal(saveCalls,1,'Case '+kind+'/'+confirmed+' notices='+failNotice.join(';'));"
          assert s.count(old)==1, 'Unexpected CAS regression assertion'
          s=s.replace(old,new)
          old="assert.equal(folderRenders,confirmed&&(kind==='photo'||kind==='folder'||kind==='prompt')?1:0);"
          new="assert.equal(folderRenders,confirmed&&(kind==='folder'||kind==='prompt')?1:0,'Photo opens the editor without a redundant list redraw');"
          assert s.count(old)==1, 'Unexpected photo-redraw assertion'
          p.write_text(s.replace(old,new))
          PY
          git add tests/flight_recorder.js tests/new_record_save_failure.js
          git commit -m 'Retain optional-safe diagnostic assertion and case-specific native save regression'
          git diff --check "$BASE" HEAD
          git diff --name-status "$BASE" HEAD > integration-evidence/changed-files.txt
          git log -8 --format='%H %s' > integration-evidence/merge-history.txt
          echo PASS > integration-evidence/merge-status.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All source Node and Python regression scripts
        shell: bash
        run: |
          set -euo pipefail
          for f in app/src/main/assets/*.js sync/*.js; do node --check "$f"; done
          node tools/qa/audit.cjs
          node tools/check-android-window.cjs
          failures=0
          for t in tests/*.js; do
            logfile="integration-evidence/$(basename "$t").log"
            if node "$t" > "$logfile" 2>&1; then
              rm "$logfile"
            else
              echo "FAIL test: $t" | tee -a integration-evidence/test-failures.txt
              tail -25 "$logfile"
              failures=$((failures+1))
            fi
          done
          if python3 -m unittest discover -s tests -p 'test_*.py' -v > integration-evidence/python-tests.log 2>&1; then
            rm integration-evidence/python-tests.log
          else
            echo 'FAIL Python unit tests' | tee -a integration-evidence/test-failures.txt
            tail -45 integration-evidence/python-tests.log
            failures=$((failures+1))
          fi
          if [ "$failures" -ne 0 ]; then
            echo "BLOCKED: $failures test failures" | tee integration-evidence/blocked.txt
            exit 40
          fi
          echo 'PASS Node/Python' > integration-evidence/test-status.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and JVM preview tests, no APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compilePreviewJavaWithJavac :app:testPreviewUnitTest
          echo 'PASS JVM' >> integration-evidence/test-status.txt
      - name: Publish to isolated integration branch ONLY after tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/integrate-five-prs-once.yml
          git commit -m 'Remove one-shot integration workflow from product tree'
          remote_sha="$(git ls-remote origin refs/heads/integration/combined-209-223-215-220-222-20261120 | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA" || { echo 'BLOCKED: integration branch drift' | tee integration-evidence/blocked.txt; exit 34; }
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/integration/combined-209-223-215-220-222-20261120
          git rev-parse HEAD | tee integration-evidence/published-sha.txt
      - name: Store evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-five-prs
          path: integration-evidence/
          if-no-files-found: warn
          retention-days: 7
