name: Zamerovac - domaci Gradle bez opakovaneho placeneho nebo internetoveho stahovani
on:
  push:
    branches: [infra/windows-self-hosted-qa-20261108]
    paths:
      - '.github/workflows/windows-local-gradle-provision-proof.yml'
permissions:
  contents: read
jobs:
  local-gradle:
    if: github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui'
    name: Copy SHA256-verified WSL Gradle 8.10.2 to isolated Windows tool dir
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 12
    steps:
      - name: Java 17 from trusted local JDK cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Copy from already verified Ubuntu ZIP extraction and independently compare every file SHA256
        shell: 'C:\actions-runner\tools\Python313\python.exe {0}'
        run: |
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          if os.environ.get("USERNAME", "").lower() != "zamerovacqa":
              sys.exit("STOP: not QA service account")
          target = Path(r"C:\actions-runner\tools\Gradle-8.10.2")
          install = r"""
          set -Eeuo pipefail
          src=/opt/gradle-8.10.2
          dst=/mnt/c/actions-runner/tools/Gradle-8.10.2
          test -x "$src/bin/gradle"
          test -f "$src/bin/gradle.bat"
          mkdir -p "$dst"
          cp -rL "$src/." "$dst/"
          cd "$src"
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          """
          p = subprocess.run(["wsl.exe", "--distribution", "Zamerovac-Ubuntu-QA",
                              "--user", "root", "--exec", "/bin/bash", "-lc", install],
                             stdin=subprocess.DEVNULL, capture_output=True, text=True,
                             errors="replace", timeout=420)
          if p.returncode:
              sys.exit("STOP: WSL verified Gradle copy failed: " + p.stderr[-1700:])
          count = 0
          for line in p.stdout.splitlines():
              m = re.fullmatch(r"([a-f0-9]{64})  \./(.+)", line)
              if not m:
                  sys.exit("STOP: unsupported WSL hash manifest entry")
              expected, rel = m.groups()
              filename = target.joinpath(*rel.split("/"))
              if not filename.is_file():
                  sys.exit("STOP: Windows copy missing " + rel)
              actual = hashlib.sha256(filename.read_bytes()).hexdigest()
              if actual != expected:
                  sys.exit("STOP: SHA256 mismatch Windows local Gradle " + rel)
              count += 1
          if count < 130:
              sys.exit("STOP: unexpected incomplete Gradle file set")
          batch = target / "bin" / "gradle.bat"
          p = subprocess.run([str(batch), "--version"], capture_output=True, text=True,
                             errors="replace", timeout=75)
          if p.returncode or "Gradle 8.10.2" not in p.stdout:
              sys.exit("STOP: Windows local Gradle executable unavailable: " +
                       p.stdout[-500:] + p.stderr[-500:])
          print("PASS: verified all", count, "Gradle 8.10.2 files against WSL hash manifest")
          print("PASS: local Windows gradle.bat --version; no SDK/API or APK changes")
          print("Windows Gradle path:", batch)
