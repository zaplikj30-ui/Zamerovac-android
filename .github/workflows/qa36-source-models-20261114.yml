name: QA36 - one-shot safe mocked Windows review fixes
# Model-only tests. No native CreateProcessW worker, no browser or customer data.
on:
  push:
    branches: ['coord36/pr135-review-fixes-20261114']
    paths: ['docs/qa/qa36-source-models.trigger']
permissions:
  contents: read
concurrency:
  group: qa36-source-mock-models-once
  cancel-in-progress: false
jobs:
  qa36-source-models:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.triggering_actor == 'zaplikj30-ui' && github.event_name == 'push' && github.ref == 'refs/heads/coord36/pr135-review-fixes-20261114' && github.event.created == false && github.run_number == 1 && github.run_attempt == 1 && github.event.head_commit.message == 'OWNER-APPROVED-QA36-SOURCE-MODELS-20261114' }}
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ZAMEROVAC_PYTHON: 'C:\actions-runner\tools\Python313\python.exe'
      EXPECTED_QA_SHA: ${{ github.event.before }}
    steps:
      - name: Verify trusted service account and pinned tools
        shell: cmd
        run: |
          @echo off
          if /i not "%GITHUB_REPOSITORY%"=="zaplikj30-ui/Zamerovac-android" exit /b 1
          if /i not "%GITHUB_ACTOR%"=="zaplikj30-ui" exit /b 1
          if /i not "%GITHUB_TRIGGERING_ACTOR%"=="zaplikj30-ui" exit /b 1
          if /i not "%GITHUB_EVENT_NAME%"=="push" exit /b 1
          if not "%GITHUB_RUN_ATTEMPT%"=="1" exit /b 1
          if not "%GITHUB_RUN_NUMBER%"=="1" exit /b 1
          set "QA_USER="
          for /f "delims=" %%U in ('C:\Windows\System32\whoami.exe') do set "QA_USER=%%U"
          if not defined QA_USER exit /b 1
          if not defined COMPUTERNAME exit /b 1
          if /i not "%QA_USER%"=="%COMPUTERNAME%\ZamerovacQA" exit /b 1
          if not exist "%ZAMEROVAC_PYTHON%" exit /b 1
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"
          where node >nul 2>nul
          if errorlevel 1 exit /b 1
          node -e "if(!process.version.startsWith('v26.13.'))process.exit(1)"
          if errorlevel 1 exit /b 1
          echo QA36_TRUSTED_IDENTITY=PASS
      - name: Exact reviewed source in unique nonclean checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.before }}
          path: qa36-source-${{ github.run_id }}
          clean: false
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Assert exact immutable SHA and clean trusted checkout
        shell: cmd
        run: |
          @echo off
          set "QA_SHA="
          for /f %%H in ('git -C "%GITHUB_WORKSPACE%\qa36-source-%GITHUB_RUN_ID%" rev-parse HEAD') do set "QA_SHA=%%H"
          if not defined QA_SHA exit /b 1
          if /i not "%QA_SHA%"=="%EXPECTED_QA_SHA%" exit /b 1
          git -C "%GITHUB_WORKSPACE%\qa36-source-%GITHUB_RUN_ID%" status --porcelain --untracked-files=all >"%RUNNER_TEMP%\qa36-status-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          for %%F in ("%RUNNER_TEMP%\qa36-status-%GITHUB_RUN_ID%.txt") do if %%~zF GTR 0 exit /b 1
          del /q "%RUNNER_TEMP%\qa36-status-%GITHUB_RUN_ID%.txt"
          if errorlevel 1 exit /b 1
          echo QA36_EXACT_CLEAN_SHA=PASS
      - name: Safe mock-only Python and Node tests
        shell: cmd
        working-directory: qa36-source-${{ github.run_id }}
        run: |
          @echo off
          "%ZAMEROVAC_PYTHON%" -Werror::ResourceWarning tests\test_qa_process_diagnostic.py -v
          if errorlevel 1 exit /b 1
          "%ZAMEROVAC_PYTHON%" -Werror::ResourceWarning tests\test_qa_windows_job_contract.py -v
          if errorlevel 1 exit /b 1
          node --check tools\qa-process-client.cjs
          if errorlevel 1 exit /b 1
          node --check tests\qa36_soft_timeout.js
          if errorlevel 1 exit /b 1
          node --test tests\qa36_soft_timeout.js tests\qa34_client_gate_integration.js tests\qa41_diag.js
          if errorlevel 1 exit /b 1
          echo QA36_MOCK_MODELS=PASS
