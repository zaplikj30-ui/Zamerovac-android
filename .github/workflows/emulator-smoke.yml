name: Zaměřovač – Android emulátor a snímky obrazovky

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle'
      - 'tools/emulator-smoke.sh'
      - '.github/workflows/emulator-smoke.yml'

concurrency:
  group: zamerovac-android-emulator-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Android 13 – kontrola obrazovek
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ověřit JavaScript a zdrojové testy
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/editor.js
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Sestavit testovací Android APK
        run: gradle --no-daemon assemblePreview
      - name: Povolit akceleraci Android emulátoru
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Spustit Android emulátor a ověřit Zaměřovač
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/emulator-smoke.sh
      - name: Uložit snímky, záznam obrazovek a chybové logy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zamerovac-EMULATOR-snimky-a-logy
          path: emulator-results/
          retention-days: 30
          if-no-files-found: warn
