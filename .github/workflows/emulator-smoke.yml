name: Zaměřovač – Android 13 QA PR220
on:
  workflow_dispatch:
    inputs:
      cloud_run_approved:
        description: Owner approved this exact QA revision and temporary APK build
        type: boolean
        required: true
        default: false
      scope:
        description: Run launch first. Compare requires a successful launch and separate owner GO.
        type: choice
        options: [launch, compare]
        default: launch
permissions:
  contents: read
concurrency:
  group: zamerovac-android-pr220
  cancel-in-progress: false
jobs:
  emulator:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qa/pr220-android-review' && github.actor == 'zaplikj30-ui' && github.triggering_actor == 'zaplikj30-ui' && github.run_attempt == '1' && inputs.cloud_run_approved }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QA_SCOPE: ${{ inputs.scope }}
      QA_BEFORE: 2009e0acf57a97ab32a8217a1365f62653884001
      QA_AFTER: d9c42ef5b352db8321533c46f50681ff19f0c349
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check runner before provisioning
        shell: bash
        run: |
          set -euo pipefail
          case "$QA_SCOPE" in launch|compare) ;; *) exit 2 ;; esac
          test -c /dev/kvm
          # Grant only the current user access on this disposable hosted VM.
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          test "$(df -Pk . | awk 'END{print $4}')" -ge 12582912
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.QA_AFTER }}
          path: qa-after
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.scope == 'compare'
        with:
          ref: ${{ env.QA_BEFORE }}
          path: qa-before
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build verified preview revisions for this job only
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/pr220-gradle
        run: |
          set -euo pipefail
          checksum=31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26
          [[ "$checksum" =~ ^[[:xdigit:]]{64}$ ]]
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o "$RUNNER_TEMP/pr220-gradle.zip"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/pr220-gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/pr220-gradle.zip" -d "$RUNNER_TEMP"
          build() {
            test "$(git -C "$1" rev-parse HEAD)" = "$2"
            "$RUNNER_TEMP/gradle-8.10.2/bin/gradle" --no-daemon -p "$1" :app:assemblePreview
          }
          build qa-after "$QA_AFTER"
          if [[ "$QA_SCOPE" == compare ]]; then build qa-before "$QA_BEFORE"; fi
          npm ci --prefix tools/qa-browser --ignore-scripts --no-audit --no-fund
      - name: Android 13 on GitHub-hosted KVM
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 480
          pre-emulator-launch-script: test "$(df -Pk . | awk 'END{print $4}')" -ge 8388608
          script: node tools/e2e/android-pr220.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/tools/qa-browser/node_modules
      - name: Remove temporary APK files
        if: always()
        shell: bash
        run: rm -f qa-before/app/build/outputs/apk/preview/app-preview.apk qa-after/app/build/outputs/apk/preview/app-preview.apk
