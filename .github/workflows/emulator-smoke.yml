name: Zaměřovač – Android emulátor a snímky obrazovky

# Emulator je narocny, spousti se pouze pred vetsim testovanim na vyzadani.
on:
  workflow_dispatch:

concurrency:
  group: zamerovac-android-emulator-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Android 13 – kontrola obrazovek
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ověřit JavaScript a zdrojové testy
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/editor.js
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Sestavit testovací Android APK
        run: gradle --no-daemon assemblePreview
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Připravit stávající Playwright pro skutečnou WebView (bez dalšího browseru)
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Povolit akceleraci Android emulátoru
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Stáhnout systémový obraz Androidu s opakováním při chybě ZIP
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOL="$SDK/cmdline-tools/latest/bin/sdkmanager"
          PKG="system-images;android-33;google_apis;x86_64"
          IMAGE="$SDK/system-images/android-33/google_apis/x86_64"
          for n in 1 2 3 4; do
            echo "Stažení Android 13 obrazu, pokus $n/4"
            if "$TOOL" --install "$PKG" --channel=0 > /tmp/sdk-install-image.log 2>&1 &&
               test -s "$IMAGE/system.img"; then
              echo "Android systémový obraz je připraven."
              exit 0
            fi
            tail -n 16 /tmp/sdk-install-image.log || true
            echo "::warning::Poškozené/neúplné stažení obrazu Androidu ($n/4); odstraním jen neúplný balíček."
            rm -rf "$IMAGE" "$SDK/.temp" "$SDK/.downloadIntermediates" || true
            sleep 10
          done
          echo "::error::Systémový obraz se nepodařilo stáhnout ani po čtyřech pokusech."
          exit 1
      - name: Připravit prokázaně potřebné místo pro testovací Android disk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p emulator-results
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          # This is an ephemeral Actions runner. Java/WebView tests use neither
          # .NET nor the Android NDK; keep the SDK, Java, Gradle and all app data.
          df -h . | tee emulator-results/disk-before.txt
          sudo du -sh /usr/share/dotnet /usr/lib/dotnet "$SDK/ndk" 2>/dev/null || true
          sudo rm -rf -- /usr/share/dotnet /usr/lib/dotnet "$SDK/ndk"
          df -h . | tee emulator-results/disk-after.txt
          # Emulator 37.2 required 7373 MB even when disk-size=2048M was set.
          # Check actual capacity after system-image installation, with headroom.
          AVAILABLE_KB=$(df --output=avail -k . | tail -1 | tr -d ' ')
          if [ "$AVAILABLE_KB" -lt 8388608 ]; then
            echo '::error::Android AVD needs at least 8 GiB free after installing its image.'
            exit 1
          fi
      - name: Spustit Android emulátor a ověřit Zaměřovač
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Keep both real gates visible even if the older accessibility smoke
          # fails; any failure still fails the job, without continue-on-error.
          script: bash -c 'result=0; bash tools/emulator-smoke.sh || result=1; node tools/e2e/android-system.cjs || result=1; exit "$result"'
      - name: Uložit snímky, záznam obrazovek a chybové logy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zamerovac-EMULATOR-snimky-a-logy
          path: emulator-results/
          retention-days: 30
          if-no-files-found: warn
