name: Zamerovac - domaci PDF integrita oddelena od Windows FS
# Jen dve existujici Android JVM PDF fixtures a nezavisle vykresleni.
# NESKRYVAJ ani NEVYPINEJ 85 selhavajicich Windows AtomicFile testu.
on:
  push:
    branches: [infra/windows-self-hosted-qa-20261108]
    paths:
      - '.github/workflows/windows-pdf-isolated-qa.yml'
permissions:
  contents: read

jobs:
  pdf-proof:
    if: ${{ github.repository == 'zaplikj30-ui/Zamerovac-android' && github.actor == 'zaplikj30-ui' && github.ref == 'refs/heads/infra/windows-self-hosted-qa-20261108' }}
    name: Windows PDF - vybrane nativni fixture a nezavisly renderer
    runs-on: [self-hosted, Windows, X64, zamerovac-qa]
    timeout-minutes: 40
    env:
      CI: '1'
      PYTHONUTF8: '1'
      QA_SOURCE_SHA: 'bc67b1a3507829a39be46a2b41e04198c71fe767'
      ANDROID_HOME: 'C:\actions-runner\tools\AndroidSdk'
      ANDROID_SDK_ROOT: 'C:\actions-runner\tools\AndroidSdk'
    steps:
      - name: Zpristupnit uz drive overeny MinGit
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\MinGit-2.56.0.4\cmd\git.exe" exit /b 1
          echo C:\actions-runner\tools\MinGit-2.56.0.4\cmd>>"%GITHUB_PATH%"

      - name: Overene vlastni zdroje - zadne PR nebo forky
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Dukaz skutecneho SHA
        shell: cmd
        run: |
          for /f %%H in ('git rev-parse HEAD') do set "TEST_SHA=%%H"
          if not defined TEST_SHA exit /b 1
          if /I not "%TEST_SHA%"=="%QA_SOURCE_SHA%" exit /b 1
          echo TESTED_PDF_SOURCE_SHA=%TEST_SHA%

      - name: Python pro servisni ucet - bez upravy globalniho PATH
        shell: cmd
        run: |
          if not exist "C:\actions-runner\tools\Python313\python.exe" exit /b 1
          echo C:\actions-runner\tools\Python313>>"%GITHUB_PATH%"

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Jen dve existujici PDF JVM fixture bez odebrani jinych regresi
        shell: cmd
        run: |
          call gradle.bat --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=-Xmx1536m" :app:testPreviewUnitTest --tests "cz.zamerovac.app.Post147DataTest.customerZipContainsOnlyRasterPdfForOneAndMultiplePhotos" --tests "cz.zamerovac.app.Post149NativeTest.pagesStayTogetherAndIncompletePdfCannotBeSaved"
          if errorlevel 1 exit /b 1
          if not exist "app\build\customer-pdf-1.zip" exit /b 1
          if not exist "app\build\customer-pdf-3.zip" exit /b 1
          if not exist "app\build\customer-pdf-multipage.zip" exit /b 1

      - name: Nezavisle otevrit a vykreslit vytvorene PDF
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check "pypdf[image]>=5,<7" "pymupdf>=1.24,<2"
          if errorlevel 1 exit /b 1
          python tools\check-customer-pdf.py app\build\customer-pdf-1.zip app\build\customer-pdf-3.zip app\build\customer-pdf-multipage.zip
          if errorlevel 1 exit /b 1
          echo PASS: PDF vytvoreni a nezavisle vykresleni na domacim PC
          echo POZOR: ostatni Robolectric testy na Windows zustavaji FAIL
